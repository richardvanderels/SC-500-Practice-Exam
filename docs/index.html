e SQL Managed Instance. An administrator will write the audit of MI1 to a blob container by using CREATE SERVER AUDIT ... TO URL. The instance must authenticate to the container with a SAS token.\n\nWhat should you create in MI1 before you create the server audit?","choices":["A credential that is named after the container URL and holds the SAS token","A diagnostic setting that has the SQLSecurityAuditEvents category selected","A database audit specification for the user database","A Microsoft Entra admin for the managed instance"],"answer":[0],"explanation":"For the TO URL destination, the instance needs a credential named after the container URL with the identity SHARED ACCESS SIGNATURE and the SAS token as the secret. The server audit, then an audit specification, are created after that.","rationale":["Correct: CREATE CREDENTIAL with IDENTITY = SHARED ACCESS SIGNATURE and the SAS token as secret, named with the container URL, lets MI1 write to the container.","Incorrect: a diagnostic setting is used when the destination is Event Hubs or Azure Monitor logs together with a server audit TO EXTERNAL_MONITOR. It is not part of the blob storage path.","Incorrect: an audit specification defines which actions are audited and needs the server audit to exist first. Creating it before the destination exists is not possible.","Incorrect: a Microsoft Entra admin controls who can sign in as an administrator. It is not needed for the audit to write to storage. Use it for Entra authentication on the instance."],"ref":"https://learn.microsoft.com/azure/azure-sql/managed-instance/auditing-configure?view=azuresql"},{"id":"2.2.2-04","obj":"2.2.2","difficulty":"medium","type":"order","stem":"Tailspin Toys must send the audit log of Server1, an Azure SQL Database logical server in resource group RG1, to a new Log Analytics workspace named LAW1. An engineer then must confirm that audit events arrive.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create the Log Analytics workspace LAW1.","`$id = az monitor log-analytics workspace show --workspace-name LAW1 --resource-group RG1 -o tsv --query id`","`Set-AzSqlServerAudit -ResourceGroupName RG1 -ServerName Server1 -LogAnalyticsTargetState Enabled -WorkspaceResourceId $id`","In LAW1, open Logs and run `search \"SQLSecurityAuditEvents\"`.","`Set-AzSqlServerMSSupportAudit -ResourceGroupName RG1 -ServerName Server1 -LogAnalyticsTargetState Enabled -WorkspaceResourceId $id`","`az sql db audit-policy update --resource-group RG1 --server Server1 --name DB1 --state Enabled --storage-account st1`"],"answer":[0,1,2,3],"explanation":"The workspace must exist before you can read its resource ID, and the ID is a parameter of the audit cmdlet. Verification comes last because audit events appear only after the policy is enabled.","rationale":["Step 1: the workspace is the destination, so it must exist before anything can reference it.","Step 2: the workspace resource ID is the value that the audit command needs, and it can be read only once the workspace exists.","Step 3: Set-AzSqlServerAudit with -LogAnalyticsTargetState Enabled and the workspace resource ID enables the server audit policy and creates the diagnostic setting for the audit events.","Step 4: after the policy is on, searching the workspace for SQLSecurityAuditEvents confirms that audit records are arriving.","Incorrect: Set-AzSqlServerMSSupportAudit configures auditing of Microsoft support operations, a separate policy. Use it to audit support engineers, not regular database activity.","Incorrect: this command enables database-level auditing for DB1 with a storage account as destination, not the server-level policy and not Log Analytics. Use it for a per-database blob destination."],"ref":"https://learn.microsoft.com/powershell/module/az.sql/set-azsqlserveraudit?view=azps-16.5.0"},{"id":"2.2.2-05","obj":"2.2.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank enabled server auditing on Server1 with three destinations: a storage account, a Log Analytics workspace and an event hub. User1 has the SQL Security Manager role on Server1 and permissions on the storage account and the workspace. When User1 saves the audit configuration, the save fails.\n\nWhat should you do?","choices":["Grant User1 permissions on the Event Hubs namespace that is used as a destination.","Assign User1 the SQL Server Contributor role on Server1.","Make User1 the Microsoft Entra admin of Server1.","Move the audit configuration from the server level to the database level."],"answer":[0],"explanation":"When several audit targets are configured, the user who saves the configuration needs permissions on all of the targets, because the settings are saved for every target. A missing permission on one target fails the whole save.","rationale":["Correct: with multiple targets the save writes settings for all of them, so User1 also needs permissions on the Event Hubs namespace.","Incorrect: SQL Server Contributor manages the server resource but gives no rights on the destination resources.","Incorrect: the Microsoft Entra admin is an authentication setting for logging in to the databases. It does not grant rights on the storage account, workspace or event hub.","Incorrect: a database-level policy still sends records to the same destinations and needs the same target permissions. Use database-level auditing for per-database settings, not to bypass permissions."],"ref":"https://learn.microsoft.com/azure/azure-sql/database/auditing-setup?view=azuresql"},{"id":"2.2.2-06","obj":"2.2.2","difficulty":"medium","type":"dropdown","stem":"Adatum Corporation currently writes the audit log of Server1 to blob storage. The security team must send the audit log to the Log Analytics workspace whose resource ID is in $id and must stop writing to blob storage.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```powershell\nSet-AzSqlServerAudit -ResourceGroupName RG1 -ServerName Server1 `\n  -[[1]] Enabled -WorkspaceResourceId $id `\n  -[[2]] Disabled\n```","targets":[{"label":"Box 1","options":["LogAnalyticsTargetState","EventHubTargetState","BlobStorageTargetState"],"why":["Correct: -LogAnalyticsTargetState Enabled turns on the Log Analytics destination, and it goes together with -WorkspaceResourceId.","Incorrect: -EventHubTargetState controls the event hub destination and would need an event hub name and authorization rule, not a workspace ID.","Incorrect: -BlobStorageTargetState controls the storage destination. Enabling it would keep writing to blob storage and would need a storage account resource ID."]},{"label":"Box 2","options":["BlobStorageTargetState","LogAnalyticsTargetState","EventHubTargetState"],"why":["Correct: -BlobStorageTargetState Disabled stops audit records from being written to blob storage while the other destination stays on.","Incorrect: disabling -LogAnalyticsTargetState would cancel the destination that you just enabled in the same command.","Incorrect: -EventHubTargetState Disabled changes the event hub destination, which is not used here, and would leave blob storage on."]}],"answer":[0,0],"explanation":"Set-AzSqlServerAudit has one state parameter per destination: BlobStorageTargetState, EventHubTargetState and LogAnalyticsTargetState. Enable one and disable another in the same call to change the destination.","ref":"https://learn.microsoft.com/powershell/module/az.sql/set-azsqlserveraudit?view=azps-16.5.0"},{"id":"2.2.2-07","obj":"2.2.2","difficulty":"hard","type":"yesno","stem":"Relecloud configured auditing of DB1 and Server1 in Azure SQL Database. Server1 sends its server-level audit to a Log Analytics workspace by using the Azure portal, and DB1 also has its own database-level audit that writes to a storage account.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["If an administrator deletes the diagnostic setting that the portal created for the audit, audit logs stop reaching the workspace without an explicit failure.","The database-level audit of DB1 replaces the server-level audit for DB1.","During very high activity, auditing can allow transactions to proceed without recording every selected event."],"answer":[0,2],"explanation":"Auditing to Log Analytics or Event Hubs depends on a diagnostic setting that fails silently when deleted, so alert on its deletion. Database and server audits run side by side, and auditing favors availability and performance over guaranteed capture.","rationale":["Yes: the SQLSecurityAuditEvents diagnostic setting is critical for the destination. If it is deleted, auditing fails silently, so Microsoft recommends an alert on the deletion of diagnostic settings.","No: when server auditing is enabled and a database-level audit is also configured, both exist side by side, and DB1 is audited by both policies.","Yes: auditing is optimized for availability and performance of the database, so during very high activity or network load, some events marked for auditing might not be recorded."],"ref":"https://learn.microsoft.com/azure/azure-sql/database/auditing-setup?view=azuresql"},{"id":"2.2.2-08","obj":"2.2.2","difficulty":"hard","type":"multi","stem":"Northwind Traders must audit the operations that Microsoft support engineers perform on Server1, an Azure SQL Database logical server, and must be able to review them. Server1 already sends its regular audit to a Log Analytics workspace.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Turn on auditing of Microsoft support operations for Server1 and select a destination.","Query the workspace for AzureDiagnostics rows with Category equal to DevOpsOperationsAudit.","Query the workspace for rows with Category equal to SQLSecurityAuditEvents.","Enable database-level auditing on every database on Server1.","Enable the Defender for Azure SQL Databases plan on the subscription."],"answer":[0,1],"explanation":"Auditing of Microsoft support operations is a separate setting that writes to its own destinations with the DevOpsOperationsAudit category. You review the events by querying that category in the workspace.","rationale":["Correct: the Enable Auditing of Microsoft support operations setting is the feature that records support engineer queries and sign-ins, and it needs a destination such as Log Analytics.","Correct: support operations are logged under the DevOpsOperationsAudit category, so this query returns them from the workspace.","Incorrect: SQLSecurityAuditEvents is the category of the regular audit events. Support operations are written under a different category, so this query would not show them.","Incorrect: database-level auditing records regular activity per database and does not add the support engineer operations. Use it for per-database audit settings.","Incorrect: Defender for Azure SQL Databases generates threat alerts and vulnerability findings. It does not provide a log of support engineer operations."],"ref":"https://learn.microsoft.com/azure/azure-sql/database/auditing-microsoft-support-operations?view=azuresql"},{"id":"2.2.2-09","obj":"2.2.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. has MI1, an Azure SQL Managed Instance with a server audit named Audit1 that writes standard events to Azure Monitor logs. The security team must also audit Microsoft support operations on MI1 and must keep the standard events.\n\nWhat should you do?","choices":["Create a separate server audit for Microsoft support operations.","Select the Microsoft support operations option on Audit1.","Add a server audit specification with the BATCH_COMPLETED_GROUP to Audit1.","Create a database audit specification in the master database."],"answer":[0],"explanation":"Auditing of Microsoft support operations on SQL Managed Instance needs its own server audit. Enabling the option on an existing audit overwrites that audit so that it logs only support operations.","rationale":["Correct: a separate server audit (for example with OPERATOR_AUDIT = ON) logs support operations and leaves Audit1 and its standard events untouched.","Incorrect: selecting the option on an existing audit overwrites it, and Audit1 would then log only Microsoft support operations, so the standard events would be lost.","Incorrect: the BATCH_COMPLETED_GROUP captures queries executed by regular users. It is already part of the standard audit and does not capture Microsoft support operations.","Incorrect: a database audit specification in master audits actions in that database for a server audit. It does not enable the Microsoft support operations audit."],"ref":"https://learn.microsoft.com/azure/azure-sql/managed-instance/auditing-configure?view=azuresql"},{"id":"2.2.3-01","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a subscription that contains Azure SQL databases, SQL Server on virtual machines, Azure Database for PostgreSQL servers and Azure Cosmos DB accounts. The security team wants one switch in Microsoft Defender for Cloud that enables threat protection for all of these database types.\n\nWhich Defender plan should you enable on the subscription?","choices":["Databases","Servers","Storage","Cloud Security Posture Management"],"answer":[0],"explanation":"The Defender for Databases plan groups four offerings: Azure SQL Databases, SQL Servers on Machines, open-source relational databases and Azure Cosmos DB. Turning the Databases plan on activates all four, and each is priced separately.","rationale":["Correct: switching the Databases plan to On in Environment settings activates the four database protection plans for the subscription.","Incorrect: the Servers plan protects virtual machines and servers at the host level, for example with endpoint protection. It does not provide the database-specific threat detection of the Databases plan.","Incorrect: the Storage plan protects storage accounts, for example against malware uploads and anomalous access. Use it for Blob, file and data lake storage, not for databases.","Incorrect: Cloud Security Posture Management assesses configuration and attack paths across resources. It is a posture feature and does not turn on the database threat protection plans."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/tutorial-enable-databases-plan"},{"id":"2.2.3-02","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Litware, Inc. creates a new Azure Cosmos DB account. The account must be covered by Microsoft Defender for Azure Cosmos DB.\n\nWhich API should you select for the account?","choices":["API for NoSQL","API for MongoDB","API for Apache Cassandra","API for Apache Gremlin"],"answer":[0],"explanation":"Defender for Azure Cosmos DB supports accounts that use the API for NoSQL. The APIs for MongoDB, Apache Cassandra, Table and Apache Gremlin are not supported.","rationale":["Correct: Azure Cosmos DB for NoSQL is the supported API for Defender for Azure Cosmos DB.","Incorrect: accounts that use the API for MongoDB are not supported by Defender for Azure Cosmos DB. Select it when MongoDB wire-protocol compatibility is needed and accept that this plan does not cover it.","Incorrect: the API for Apache Cassandra is not supported by this plan. Select it for Cassandra-compatible workloads, and use other controls to monitor them.","Incorrect: the API for Apache Gremlin, used for graph data, is not supported by this plan. Select it for graph workloads when threat protection coverage is not required."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-defender-for-cosmos"},{"id":"2.2.3-03","obj":"2.2.3","difficulty":"easy","type":"single","stem":"Woodgrove Bank hosts an Azure Database for PostgreSQL flexible server named PG1. The security team must detect anomalous and potentially harmful attempts to access or exploit PG1 and receive the alerts in Microsoft Defender for Cloud.\n\nWhich plan should you enable?","choices":["Microsoft Defender for open-source relational databases","Microsoft Defender for Azure SQL Databases","Microsoft Defender for SQL Servers on Machines","Microsoft Defender for Azure Cosmos DB"],"answer":[0],"explanation":"Defender for open-source relational databases detects anomalous activity on supported open-source engines such as Azure Database for PostgreSQL and Azure Database for MySQL flexible servers. It can be enabled on the subscription or on the server.","rationale":["Correct: this plan covers Azure Database for PostgreSQL and MySQL flexible servers and raises alerts in Defender for Cloud.","Incorrect: Defender for Azure SQL Databases protects Azure SQL single databases, elastic pools, managed instances and dedicated SQL pools, not PostgreSQL. Use it for SQL engine workloads.","Incorrect: Defender for SQL Servers on Machines protects SQL Server instances that run on virtual machines or Azure Arc-enabled servers. PG1 is a PaaS PostgreSQL server.","Incorrect: Defender for Azure Cosmos DB protects Azure Cosmos DB accounts that use the API for NoSQL. PG1 is a relational PostgreSQL server."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-databases-introduction"},{"id":"2.2.3-04","obj":"2.2.3","difficulty":"medium","type":"single","stem":"Tailspin Toys has Server1, a Windows server in a branch office that runs SQL Server 2019. Server1 is not in Azure. The security team needs vulnerability assessment and threat protection for the databases on Server1 in Microsoft Defender for Cloud.\n\nWhat should you do?","choices":["Onboard Server1 to Azure Arc and enable Microsoft Defender for SQL Servers on Machines.","Enable Microsoft Defender for open-source relational databases on the subscription.","Enable Microsoft Defender for Azure Cosmos DB on the subscription.","Enable Microsoft Defender for SQL on a new Azure SQL logical server."],"answer":[0],"explanation":"Defender for SQL Servers on Machines protects SQL Server on Azure VMs and on-premises or multicloud machines. On-premises machines must be onboarded as Azure Arc-enabled servers so that Defender for Cloud can reach them.","rationale":["Correct: Arc onboarding makes Server1 visible to Defender for Cloud, and the SQL Servers on Machines plan adds vulnerability assessment and threat protection for its databases.","Incorrect: the open-source relational databases plan covers PostgreSQL and MySQL flexible servers, not SQL Server. Use it for those engines.","Incorrect: the Azure Cosmos DB plan covers Cosmos DB accounts that use the API for NoSQL. Server1 runs SQL Server.","Incorrect: enabling Defender for SQL on an Azure SQL logical server protects the databases on that logical server. It does not extend to a separate SQL Server instance in a branch office."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-sql-usage"},{"id":"2.2.3-05","obj":"2.2.3","difficulty":"medium","type":"yesno","stem":"Fabrikam, Inc. enables the Databases plan for a subscription in Microsoft Defender for Cloud. The subscription contains an Azure SQL managed instance, an Azure Database for MySQL flexible server and an Azure Cosmos DB account that uses the API for NoSQL.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Enabling the Databases plan activates the Azure SQL Databases, SQL Servers on Machines, open-source relational databases and Azure Cosmos DB plans.","Each of the database protection plans in the Databases plan is priced separately.","Defender for Azure Cosmos DB reads the documents stored in the account and reduces the performance of the account."],"answer":[0,1],"explanation":"The Databases plan is a bundle of four separately priced offerings that you enable together at subscription level. Defender for Azure Cosmos DB analyzes activity and does not access account data or affect performance.","rationale":["Yes: the Databases plan activates all four Defender plans and protects all supported databases on the subscription.","Yes: each of the four database protection plans has its own price, so cost should be estimated per plan, for example with the Defender for Cloud cost calculator.","No: Defender for Azure Cosmos DB detects threats such as SQL injection and suspicious access patterns, and it does not access the account data or affect the service performance."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-databases-overview"},{"id":"2.2.3-06","obj":"2.2.3","difficulty":"medium","type":"dragdrop","stem":"Relecloud must enable the correct Microsoft Defender for Cloud plan for each database resource.\n\nWhich plan should you use for each resource? To answer, drag the appropriate plans to the correct resources. Each plan may be used once, more than once, or not at all.","choices":["Defender for Azure SQL Databases","Defender for open-source relational databases","Defender for SQL Servers on Machines","Defender for Azure Cosmos DB","Defender for Storage"],"targets":["MI1: an Azure SQL managed instance","MySQL1: an Azure Database for MySQL flexible server","SQL1: SQL Server on an Azure Arc-enabled on-premises machine","Cosmos1: an Azure Cosmos DB account that uses the API for NoSQL"],"answer":[0,1,2,3],"rationale":["MI1 is an Azure SQL managed instance, which is covered by Defender for Azure SQL Databases together with single databases, elastic pools and dedicated SQL pools.","MySQL1 is an open-source relational database on Azure, covered by Defender for open-source relational databases for PostgreSQL and MySQL flexible servers.","SQL1 is SQL Server on an Arc-enabled machine, which is covered by Defender for SQL Servers on Machines after Arc onboarding.","Cosmos1 uses the API for NoSQL, which is the supported API of Defender for Azure Cosmos DB."],"notes":["Protects Azure SQL single databases, elastic pools, managed instances and Synapse dedicated SQL pools with vulnerability assessment and threat protection.","Detects anomalous access and exploit attempts on Azure Database for PostgreSQL and MySQL flexible servers, and on supported AWS RDS engines.","Protects SQL Server on Azure VMs, Arc-enabled on-premises servers and multicloud machines. Use it for IaaS SQL Server.","Detects SQL injection, compromised identities and suspicious access on Azure Cosmos DB accounts that use the API for NoSQL.","Protects storage accounts against malicious uploads and anomalous access. It is not a database plan, so it does not apply to these resources."],"explanation":"Choose the Defender plan by database type: Azure SQL family, open-source relational, SQL Server on machines, and Azure Cosmos DB for NoSQL. Storage protection is a different plan.","ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-databases-overview"},{"id":"2.2.3-07","obj":"2.2.3","difficulty":"hard","type":"single","stem":"Adatum Corporation has a subscription with 15 Azure Cosmos DB accounts. Because of cost, the Databases plan is off for the subscription. Only the production account CosmosPROD must be protected by Microsoft Defender for Azure Cosmos DB, and the other 14 accounts must not be charged.\n\nWhat should you do?","choices":["Enable Microsoft Defender for Azure Cosmos DB on the CosmosPROD account.","Enable the Databases plan on the subscription and select the Azure Cosmos DB resource type.","Enable Microsoft Defender for open-source relational databases on CosmosPROD.","Enable Microsoft Defender for Azure SQL Databases on the subscription."],"answer":[0],"explanation":"Defender for Azure Cosmos DB can be enabled at the subscription level or on a single account. Subscription-level enablement covers all Azure Cosmos DB accounts, so protecting one account needs resource-level enablement in the portal, PowerShell, CLI, an ARM template or Azure Policy.","rationale":["Correct: resource-level enablement protects only CosmosPROD, so the other 14 accounts are not charged.","Incorrect: selecting the Azure Cosmos DB type in the Databases plan limits the plan to that database type, but it still protects every Cosmos DB account in the subscription, so all 15 are charged.","Incorrect: the open-source relational databases plan covers PostgreSQL and MySQL servers and does not apply to Cosmos DB accounts.","Incorrect: Defender for Azure SQL Databases protects the Azure SQL family and does not apply to Azure Cosmos DB accounts. Use it for SQL databases, managed instances and dedicated SQL pools."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-databases-enable-cosmos-protections"},{"id":"2.2.3-08","obj":"2.2.3","difficulty":"hard","type":"multi","stem":"Northwind Traders enables Microsoft Defender for Azure SQL Databases on a subscription. The subscription contains an Azure SQL elastic pool, an Azure SQL managed instance, an Azure Synapse Analytics dedicated SQL pool, an Azure Synapse serverless SQL pool, and an Azure Database for PostgreSQL flexible server.\n\nWhich three resources should you list as protected by this plan? Each correct answer presents part of the solution.","choices":["The Azure SQL elastic pool","The Azure SQL managed instance","The Azure Synapse Analytics dedicated SQL pool","The Azure Synapse Analytics serverless SQL pool","The Azure Database for PostgreSQL flexible server"],"answer":[0,1,2],"explanation":"Defender for Azure SQL Databases protects Azure SQL single databases and elastic pools, managed instances and Synapse dedicated SQL pools. Serverless SQL pools are not covered, and PostgreSQL is covered by the open-source relational databases plan.","rationale":["Correct: single databases and elastic pools are protected by Defender for Azure SQL Databases.","Correct: Azure SQL managed instances are protected by this plan as well.","Correct: Synapse Analytics dedicated SQL pools (formerly SQL Data Warehouse) are covered by this plan.","Incorrect: Defender for SQL does not apply to serverless SQL pools or Apache Spark pools in Azure Synapse Analytics. Only dedicated SQL pools are covered.","Incorrect: PostgreSQL flexible servers are covered by Defender for open-source relational databases, a different plan in the Databases bundle."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-sql-introduction"},{"id":"2.2.3-09","obj":"2.2.3","difficulty":"hard","type":"dropdown","stem":"Litware, Inc. must enable Microsoft Defender for Azure Cosmos DB on one account named Cosmos1 in resource group RG1 by using Az PowerShell, and then verify the setting.\n\nHow should you complete the script? To answer, select the appropriate options in the answer area.\n\n```powershell\n$id = \"/subscriptions/<subscription-id>/resourceGroups/RG1/providers/[[1]]/Cosmos1/\"\n[[2]] -ResourceId $id\nGet-AzSecurityAdvancedThreatProtection -ResourceId $id\n```","targets":[{"label":"Box 1","options":["Microsoft.DocumentDb/databaseAccounts","Microsoft.Sql/servers","Microsoft.DBforPostgreSQL/flexibleServers"],"why":["Correct: Azure Cosmos DB accounts are Microsoft.DocumentDb/databaseAccounts resources, which is the resource type in the resource ID.","Incorrect: Microsoft.Sql/servers is the type of an Azure SQL logical server. Use it as the resource ID type when enabling Defender for SQL on a logical server.","Incorrect: Microsoft.DBforPostgreSQL/flexibleServers identifies an Azure Database for PostgreSQL flexible server. Use it for the open-source relational databases plan."]},{"label":"Box 2","options":["Enable-AzSecurityAdvancedThreatProtection","Get-AzSecurityAdvancedThreatProtection"],"why":["Correct: Enable-AzSecurityAdvancedThreatProtection with the account resource ID enables Defender for Azure Cosmos DB at the resource level.","Incorrect: Get-AzSecurityAdvancedThreatProtection only reads the current setting. It is the right command for the verification line that follows, but it would not enable anything."]}],"answer":[0,0],"explanation":"Resource-level enablement uses Enable-AzSecurityAdvancedThreatProtection with the resource ID of the account, and Get-AzSecurityAdvancedThreatProtection verifies it. The provider path of the ID identifies the resource type.","ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-databases-enable-cosmos-protections"},{"id":"2.3.1-01","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. runs a three-tier app in one virtual network. The web tier VMs are added and removed by scaling operations, and their IP addresses change often. You must allow TCP 443 from the web tier to the app tier in a network security group (NSG) without editing the rule when VMs are added.\n\nWhich source and destination type should you use in the NSG rule?","choices":["An application security group for each tier","A service tag for each tier","An augmented security rule that lists the VM IP addresses","A Virtual Network Manager security admin rule that lists the tier subnets"],"answer":[0],"explanation":"Application security groups let you write NSG rules against logical groups of NICs instead of IP addresses. Membership changes do not require rule edits, which suits scale-out tiers.","rationale":["Correct: An application security group (ASG) groups network interfaces by role. A rule that names ASGs stays valid when VMs join or leave the group, so no IP addresses are maintained.","Incorrect: A service tag is a Microsoft-managed set of address prefixes for an Azure service, and you cannot create custom service tags for your own tiers. Use it to reference services such as Storage in a rule.","Incorrect: An augmented rule combines many explicit IP addresses and ranges in one rule, but you still maintain the list. It breaks the requirement when scaling changes the addresses. Use it for static address sets.","Incorrect: A security admin rule enforces central policy on virtual networks by using address prefixes, not NIC groups, so it still needs address maintenance. Use it for organization-wide baselines, not tier-to-tier rules."],"ref":"https://learn.microsoft.com/azure/virtual-network/application-security-groups"},{"id":"2.3.1-02","obj":"2.3.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has an NSG with a custom inbound rule that denies TCP 3389 from Internet at priority 200 and a custom inbound rule that allows TCP 3389 from 203.0.113.0/24 at priority 300. Users in 203.0.113.0/24 cannot connect to Server1 by using RDP.\n\nWhat should you do?","choices":["Change the priority of the allow rule to 150","Change the priority of the allow rule to 400","Delete the DenyAllInbound default rule from the NSG","Add an outbound allow rule for TCP 3389 at priority 100"],"answer":[0],"explanation":"NSG rules are evaluated by ascending priority number, and the first match ends evaluation. To make a narrow allow win over a broad deny, give the allow a smaller number.","rationale":["Correct: NSG rules are processed from the lowest number to the highest, and processing stops at the first match. Priority 150 puts the allow rule before the deny rule at 200, so the trusted range matches the allow first.","Incorrect: A higher number means a lower precedence. Moving the allow rule to 400 leaves the deny rule at 200 ahead of it, so the traffic is still denied. Use a number below 200 to win.","Incorrect: Default rules cannot be deleted, only overridden by custom rules. DenyAllInbound is also not the rule matching here, because the custom deny at priority 200 matches first.","Incorrect: NSGs are stateful, so return traffic for an allowed inbound flow needs no outbound rule. The block is the inbound deny rule. An outbound rule helps only when outbound connections are denied."],"ref":"https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview"},{"id":"2.3.1-03","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. has VM1 in a subnet that has an NSG allowing inbound TCP 22 from 10.10.0.0/24. VM1 also has a network interface NSG that contains only the default rules. An administrator in 10.10.0.0/24 cannot connect to VM1 by using SSH.\n\nWhat should you do?","choices":["Add an allow rule for TCP 22 from 10.10.0.0/24 to the NIC-level NSG","Change the priority of the subnet allow rule to 100","Delete the DenyAllInbound default rule in the NIC-level NSG","Add an outbound allow rule for TCP 22 to the subnet NSG"],"answer":[0],"explanation":"When a subnet NSG and a NIC NSG both apply, a flow must pass both. Use the effective security rules view to see which one blocks, then add the matching allow rule there.","rationale":["Correct: Inbound traffic must be allowed by both the subnet NSG and the NIC NSG. The NIC NSG has no allow rule for SSH, so its DenyAllInbound default rule blocks the flow. A matching allow rule in it fixes the problem.","Incorrect: Priority only orders rules inside one NSG. The subnet NSG already allows the flow, so a different priority there does not change the decision of the separate NIC NSG that blocks it.","Incorrect: Default rules cannot be removed. You can only override them with custom rules that have a lower priority number, so this action is not possible even though it targets the right NSG.","Incorrect: NSGs are stateful, so replies to allowed inbound SSH are permitted automatically. The failure is an inbound deny at the NIC level, not a missing outbound rule at the subnet level."],"ref":"https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview"},{"id":"2.3.1-04","obj":"2.3.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has VMs in the application security groups AsgLogic and AsgDb in one virtual network. Only AsgLogic VMs may connect to AsgDb on TCP 1433. The default AllowVNetInBound rule still permits other traffic inside the virtual network.\n\nWhich pair of custom inbound rules should you create?","choices":["Allow AsgLogic to AsgDb on 1433 at priority 110, and deny any source to AsgDb on 1433 at priority 120","Allow AsgLogic to AsgDb on 1433 at priority 120, and deny any source to AsgDb on 1433 at priority 110","Allow AsgLogic to AsgDb on 1433 at priority 110, with no deny rule","Deny any source to AsgDb on 1433 at priority 100, and allow AsgLogic to AsgDb on 1433 at priority 4000"],"answer":[0],"explanation":"To restrict a port inside a virtual network, pair a narrow allow with a broader deny and give the allow the smaller priority number. The deny is needed to override AllowVNetInBound.","rationale":["Correct: The allow rule has the lower number, so AsgLogic matches it first. All other sources fall through to the deny at 120, which overrides the default AllowVNetInBound rule at 65000.","Incorrect: The deny rule at 110 is evaluated first and matches every source, including AsgLogic, so the allow at 120 is never reached. The order of the priorities is reversed.","Incorrect: Without a deny rule, other VMs in the virtual network still match AllowVNetInBound at priority 65000 and reach the database. An allow rule alone does not restrict anything.","Incorrect: The deny rule at priority 100 is processed before the allow at 4000 and matches AsgLogic traffic too, so the logic tier is blocked. The allow must be numbered below the deny."],"ref":"https://learn.microsoft.com/azure/virtual-network/application-security-groups"},{"id":"2.3.1-05","obj":"2.3.1","difficulty":"hard","type":"multi","stem":"Woodgrove Bank plans to place 40 VM network interfaces into application security groups (ASGs) and to reference them in NSG rules. The VMs are in two virtual networks.\n\nWhich two design constraints should you account for? Each correct answer presents part of the solution.","choices":["The network interfaces in one ASG must be in the same virtual network","A single NSG rule can name just one ASG as its source","An ASG can be associated with a subnet in place of an NSG","A rule that names an ASG also applies to NICs that are not members of it","The default rules of an NSG can be deleted when ASG rules are used"],"answer":[0,1],"explanation":"ASGs group NICs of one virtual network and are referenced as a single group per rule source or destination. They are not security boundaries by themselves and do not remove default rules.","rationale":["Correct: ASG membership is limited to NICs in a single virtual network. With two virtual networks you need separate ASGs per network, each with its own rule reference.","Correct: A rule can specify one ASG or one service tag per source or destination, so you cannot list several ASGs in one rule. Use several rules or a combined group instead.","Incorrect: ASGs are used inside NSG rules to group NICs. They are not associated with subnets and do not replace an NSG, which is the filtering resource attached to a subnet or NIC.","Incorrect: A rule that names an ASG applies only to NICs that are members of it. A NIC outside the group is not affected even when the subnet NSG contains the rule.","Incorrect: Default rules cannot be removed. You can override them by creating custom rules with a lower priority number, whether or not ASGs are used."],"ref":"https://learn.microsoft.com/azure/networking/design-guide/network-application-security-groups"},{"id":"2.3.1-06","obj":"2.3.1","difficulty":"easy","type":"yesno","stem":"Litware, Inc. manages an NSG named NSG1 in a virtual network that contains Server1 and Server2.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["A custom rule with priority 4000 is evaluated before the default rule AllowVNetInBound.","You can delete the default DenyAllInbound rule to allow inbound traffic from the internet.","One rule can list AsgWeb and AsgApp together as its source application security groups."],"answer":[0],"explanation":"Custom rules use priorities 100 to 4096 and run before the default rules. Default rules cannot be removed, and a source or destination can name one ASG.","rationale":["Yes: Default rules have priorities 65000 and higher, so any custom rule in the range 100 to 4096 is evaluated before them.","No: Default rules cannot be deleted. To allow internet traffic you add a custom allow rule with a lower priority number than 65500.","No: A rule can name only one application security group or service tag per source or destination. Use two rules or one combined group."],"ref":"https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview"},{"id":"2.3.1-07","obj":"2.3.1","difficulty":"medium","type":"dragdrop","stem":"Contoso, Ltd. is writing NSG rules for three requirements.\n\nWhich NSG element should you use for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once, more than once, or not at all.","choices":["Application security group","Service tag","Augmented security rule","Security admin rule"],"targets":["Requirement 1: allow SQL traffic between VM groups by role while VM IP addresses change often","Requirement 2: allow outbound HTTPS to Azure Storage without tracking address ranges that Microsoft changes","Requirement 3: allow TCP 80, 443 and 8080 from three on-premises address blocks in one rule"],"answer":[0,1,2],"rationale":["Requirement 1 depends on VM roles, not on addresses, so grouping NICs in an application security group keeps the rule valid as IPs change.","Requirement 2 refers to an Azure service whose prefixes Microsoft maintains, which is exactly what the Storage service tag provides.","Requirement 3 combines several ports and address blocks, which an augmented security rule expresses in one rule instead of several."],"notes":["Groups NICs by role and is used as a source or destination in NSG rules. Use it when addresses change but roles stay the same.","A Microsoft-managed list of address prefixes for an Azure service. Use it to reference services without maintaining IP ranges.","A rule that holds multiple ports and multiple addresses or ranges. Use it to reduce the number of rules for static sets.","A rule deployed by Azure Virtual Network Manager that is evaluated before NSG rules. Use it for central baselines, not for per-tier rules."],"explanation":"Match the element to what changes: roles map to ASGs, Azure service ranges to service tags, and static multi-value sets to augmented rules.","ref":"https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview"},{"id":"2.3.1-08","obj":"2.3.1","difficulty":"hard","type":"dropdown","stem":"Tailspin Toys is completing the custom inbound rules of NSG1 for a web, logic and database design. Traffic from the internet must reach only AsgWeb on TCP 80. Only AsgLogic may reach AsgDb on TCP 1433, and the default AllowVNetInBound rule must not expose AsgDb to other VMs.\n\nHow should you complete the rules? To answer, select the appropriate options in the answer area.\n\n```text\nPriority  Source      Destination  Port  Access\n100       [[1]]       AsgWeb       80    Allow\n110       AsgLogic    AsgDb        1433  Allow\n[[2]]     *           AsgDb        1433  [[3]]\n```","targets":[{"label":"Box 1","options":["Internet","VirtualNetwork","AzureLoadBalancer"],"why":["Correct: the Internet service tag represents public address space, so the rule admits internet clients to the web tier. The default DenyAllInbound rule blocks the other tiers.","Incorrect: the VirtualNetwork tag covers the virtual network and connected on-premises space, not internet clients. Use it for traffic between internal tiers.","Incorrect: the AzureLoadBalancer tag covers the load balancer health probe source, not user traffic. Use it to let probes reach backends."]},{"label":"Box 2","options":["120","100","105"],"why":["Correct: priority 120 is higher than 110, so the AsgLogic allow is evaluated first and the deny catches everything else before AllowVNetInBound at 65000.","Incorrect: priority 100 is lower than 110, so the deny matches first and blocks AsgLogic as well. The allow rule would never apply.","Incorrect: priority 105 is also lower than 110, so the deny is evaluated before the AsgLogic allow and blocks the logic tier."]},{"label":"Box 3","options":["Deny","Allow"],"why":["Correct: the catch-all rule must deny, so any source other than AsgLogic is blocked from the database port after the allow rule has matched.","Incorrect: an allow here would permit every source to reach AsgDb on 1433, which is what the default AllowVNetInBound rule already does, so the restriction would be lost."]}],"answer":[0,0,0],"explanation":"Use a service tag for internet clients, give narrow allows smaller priority numbers than the catch-all deny, and deny the rest so the default AllowVNetInBound rule cannot expose the database tier.","ref":"https://learn.microsoft.com/azure/virtual-network/application-security-groups"},{"id":"2.3.2-01","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has 30 subscriptions with virtual networks. The central network team must block inbound RDP from the internet on every virtual network, and application teams, who manage their own NSGs, must not be able to override the block.\n\nWhat should you implement?","choices":["A Deny rule in an Azure Virtual Network Manager security admin configuration","A custom inbound deny rule at priority 100 in the NSG of every subnet","A user-defined route with next hop type None on every subnet","An Azure Firewall DNAT rule on a central firewall"],"answer":[0],"explanation":"Azure Virtual Network Manager security admin rules give central teams an enforcement layer that is evaluated before NSGs, so application teams cannot weaken the baseline.","rationale":["Correct: Security admin rules are defined centrally, applied to the virtual networks of a network group, and evaluated before NSG rules. A Deny action ends evaluation, so NSG allow rules cannot override it.","Incorrect: NSG rules are owned by the application teams, who can edit or remove them, and you would have to maintain them in 30 subscriptions. They cannot enforce a central policy that teams cannot change.","Incorrect: A route with next hop None drops traffic by routing, not by port or source filtering, so it would also break legitimate traffic. It is a routing control, not a rule that blocks RDP from the internet.","Incorrect: A DNAT rule translates inbound traffic from a firewall public IP to a private address. It publishes services and does not block RDP on virtual networks that have their own public IP addresses."],"ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-security-admins"},{"id":"2.3.2-02","obj":"2.3.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. creates new virtual networks every week. Every virtual network that has the tag env set to prod must automatically become a target of Azure Virtual Network Manager configurations.\n\nWhat should you configure for the network group?","choices":["Dynamic membership that uses Azure Policy","Static membership with the resource IDs of the virtual networks","A connectivity configuration that uses a mesh topology","A security admin configuration for each subscription"],"answer":[0],"explanation":"Network groups can use static or dynamic membership. Dynamic membership relies on Azure Policy conditions so new virtual networks are picked up without redeployment.","rationale":["Correct: Dynamic membership uses an Azure Policy condition, such as a tag value, with the addToNetworkGroup effect. Matching virtual networks join the group automatically and leave it when they no longer match.","Incorrect: Static membership lists resource IDs by hand, so each new virtual network must be added manually. Use it for small environments, exceptions or pilots where membership rarely changes.","Incorrect: A connectivity configuration defines a topology such as mesh or hub-and-spoke for a group. It does not decide which virtual networks belong to the group. Use it after membership is defined.","Incorrect: A security admin configuration holds rules that apply to a network group. It does not populate the group, so new virtual networks would still need to be added to the group first."],"ref":"https://learn.microsoft.com/azure/networking/design-guide/azure-virtual-network-manager"},{"id":"2.3.2-03","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank uses a security admin configuration to manage virtual networks. Management traffic to TCP 5986 must reach the servers even when an application team has an NSG rule that denies the port.\n\nWhich action should you set on the security admin rule?","choices":["Always Allow","Allow with priority 1","Deny","Allow with the same priority as the NSG rule"],"answer":[0],"explanation":"Security admin rules have three actions. Allow continues to NSG rules, while Always Allow and Deny both end evaluation, so only Always Allow guarantees delivery against NSG denies.","rationale":["Correct: An Always Allow rule delivers matching traffic to the resource and ends evaluation, so downstream NSG deny rules are skipped. It guarantees reachability of critical management traffic.","Incorrect: An Allow rule passes matching traffic on to NSG evaluation, where the application team deny rule can still block it. The priority number of the admin rule does not change this.","Incorrect: A Deny rule blocks traffic before it is delivered, which is the opposite of the requirement. Use it for organization-wide blocks such as inbound SSH from the internet.","Incorrect: Admin rule priorities are compared with other admin rules, not with NSG priorities, and an Allow action still continues to NSG rules. Matching numbers does not prevent the NSG deny."],"ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-security-admins"},{"id":"2.3.2-04","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Litware, Inc. saved a security admin configuration that denies inbound TCP 23 and associated it with the network group Prod. Hosts in a virtual network in West Europe, which is a member of Prod, still accept connections on TCP 23. The virtual network is listed in the group.\n\nWhat should you do?","choices":["Deploy the security admin configuration to the West Europe region","Associate an NSG that denies TCP 23 with the virtual network","Add each subnet of the virtual network to Prod as a static member","Create a connectivity configuration for Prod in West Europe"],"answer":[0],"explanation":"Security admin rules take effect only after the configuration is deployed to a region. Only one security admin configuration can be deployed per region, so extra rules go into more rule collections.","rationale":["Correct: A saved configuration is not enforced until you deploy it to the regions of the target virtual networks. Deployment applies the rules to the virtual networks in the group, with a short delay.","Incorrect: An NSG would block the port, but it does not fix the central rule and leaves the enforcement gap for other virtual networks. The requirement is to make the existing security admin rule effective.","Incorrect: Network groups contain virtual networks, not subnets, and the virtual network is already a member. Adding members does not change whether the rules are deployed.","Incorrect: A connectivity configuration controls topology such as hub-and-spoke or mesh. It carries no security rules, so it would not block TCP 23."],"ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-security-admins"},{"id":"2.3.2-05","obj":"2.3.2","difficulty":"medium","type":"single","stem":"Tailspin Toys deploys a security admin rule that denies inbound SSH from the internet to every virtual network in the network group Prod. An administrator tests SSH access and finds the rule enforced on most subnets.\n\nWhich subnet should you expect to be exempt from this security admin rule?","choices":["AzureBastionSubnet","A subnet that has an NSG with an allow rule for SSH","A subnet in a virtual network that joined Prod through dynamic membership","A subnet whose VM network interface has its own NSG"],"answer":[0],"explanation":"Security admin rules are applied at the virtual network level and take precedence over NSGs, except on exempt service subnets such as Azure Bastion, Azure Firewall and VPN gateway subnets.","rationale":["Correct: Security admin rules do not apply to certain service subnets, including Azure Bastion, Azure Firewall, VPN Gateway, Azure Route Server and Virtual WAN subnets. AzureBastionSubnet is one of the exemptions.","Incorrect: An NSG allow rule does not help, because the security admin Deny is evaluated first and ends evaluation. The NSG rule is never reached for that traffic.","Incorrect: Dynamic membership only decides which virtual networks are targeted. A virtual network that is a member through Azure Policy receives the same rules as a manually added one.","Incorrect: A NIC-level NSG is evaluated after security admin rules, so it cannot exempt the subnet. The admin Deny applies before any NSG is considered."],"ref":"https://learn.microsoft.com/azure/networking/design-guide/azure-virtual-network-manager"},{"id":"2.3.2-06","obj":"2.3.2","difficulty":"easy","type":"yesno","stem":"Contoso, Ltd. uses Azure Virtual Network Manager with a security admin configuration and subnet NSGs.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Security admin rules are evaluated before NSG rules.","An Allow security admin rule ends evaluation, so the NSG rules are skipped.","You can deploy two different security admin configurations to the same region."],"answer":[0],"explanation":"Security admin rules run first and use Allow, Always Allow or Deny. Only one security admin configuration is deployed per region, and extra rules go into rule collections.","rationale":["Yes: Security admin rules have higher precedence than NSG rules, so central policy is applied first and NSGs add team-level control afterward.","No: Allow continues to NSG evaluation, where the traffic can still be denied. Only Always Allow and Deny end evaluation after the admin rule.","No: Only one security admin configuration can be deployed to a region. To add more rules, create additional rule collections in that configuration."],"ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-security-admins"},{"id":"2.3.2-07","obj":"2.3.2","difficulty":"hard","type":"order","stem":"Fabrikam, Inc. has an Azure Virtual Network Manager instance planned for a subscription. The virtual networks of the Prod environment must receive a central rule that blocks inbound TCP 23, and membership is defined by an existing Azure Policy condition.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create the network manager with the security admin feature in its scope.","Create a network group for the Prod virtual networks.","Create a security admin configuration with a rule collection that targets the network group.","Deploy the security admin configuration to the regions of the virtual networks.","Create a connectivity configuration with a hub-and-spoke topology.","Associate an NSG that denies TCP 23 with each subnet."],"answer":[0,1,2,3],"explanation":"Azure Virtual Network Manager builds on dependencies: manager, then network group, then a configuration that targets the group, and finally deployment to regions.","rationale":["Step 1: the network manager is the parent resource, and its scope and features decide which virtual networks and configuration types it can manage, so it must exist first.","Step 2: the network group must exist before a rule collection can target it. Membership then comes from the existing Azure Policy condition.","Step 3: the configuration holds the rule collection with the Deny rule and associates the collection with the network group created earlier.","Step 4: a configuration takes effect only after deployment to a region, so this step comes last and applies the rules to the group members.","Incorrect: a connectivity configuration builds hub-and-spoke or mesh connectivity and contains no security rules. Use it when you need topology, not filtering.","Incorrect: NSGs on each subnet are not a central rule and are owned by application teams. Use them for team-level filtering, after the central admin rules."],"ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-security-admins"},{"id":"2.3.2-08","obj":"2.3.2","difficulty":"hard","type":"dropdown","stem":"Relecloud uses Azure Virtual Network Manager. A rule collection named Block-SSH denies inbound TCP 22 at priority 100 for the network group All. The App network group must be an exception: SSH may be delivered to its virtual networks, but only when the NSGs of the application teams also allow it.\n\nHow should you complete the exception rule? To answer, select the appropriate options in the answer area.\n\n```text\nCollection       Priority  Action  Direction  Port  Target\nException-App    [[1]]     [[2]]   Inbound    22    App\nBlock-SSH        100       Deny    Inbound    22    All\n```","targets":[{"label":"Box 1","options":["10","200","4096"],"why":["Correct: priority 10 is lower than 100, so the exception is evaluated before the organization-wide Deny and SSH to App virtual networks matches it first.","Incorrect: priority 200 is evaluated after the Deny at 100, so the Deny matches first and the exception is never reached.","Incorrect: priority 4096 is the lowest precedence in the range, so the Deny at 100 matches first and the exception has no effect."]},{"label":"Box 2","options":["Allow","Always Allow","Deny"],"why":["Correct: Allow ends the admin rule evaluation for this traffic and continues to NSG evaluation, so application team NSG rules still decide, as the requirement states.","Incorrect: Always Allow delivers the traffic and skips NSG rules, so a team NSG that denies SSH could no longer block it. Use it when central delivery must be guaranteed.","Incorrect: Deny would block SSH to the App virtual networks, which contradicts the exception. Use Deny for the organization-wide block."]}],"answer":[0,0],"explanation":"A narrower exception needs a smaller priority number than the broad Deny, and the Allow action hands the decision to NSGs instead of bypassing them.","ref":"https://learn.microsoft.com/azure/virtual-network-manager/concept-enforcement"},{"id":"2.3.3-01","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Woodgrove Bank uses Azure Virtual WAN to connect branch offices and spoke virtual networks. Traffic between virtual networks and from branches to the internet must be inspected by Azure Firewall. The network team does not want to create and maintain user-defined routes.\n\nWhat should you deploy?","choices":["A secured virtual hub managed by Azure Firewall Manager","Azure Firewall in a hub virtual network with a route table on each spoke","An Azure Firewall instance in every spoke virtual network","An Azure Virtual Network Manager hub-and-spoke connectivity configuration"],"answer":[0],"explanation":"A secured virtual hub combines Virtual WAN routing with Azure Firewall policy and removes the need for custom UDRs, covering VNet-to-VNet, branch-to-VNet and internet traffic.","rationale":["Correct: A secured virtual hub is a Virtual WAN hub with security and routing policies from Azure Firewall Manager. It provides automated routing, so no user-defined routes are needed to send traffic to the firewall.","Incorrect: A firewall in a customer-managed hub virtual network works, but each spoke then needs a route table with user-defined routes. That contradicts the requirement to avoid UDR maintenance.","Incorrect: Firewalls in every spoke fragment policy and cost, and branch traffic is still not routed through them automatically. A central firewall in the hub gives one policy point.","Incorrect: A Virtual Network Manager connectivity configuration builds peering topology between virtual networks. It does not provide a firewall or branch traffic inspection for Virtual WAN."],"ref":"https://learn.microsoft.com/azure/firewall-manager/secured-virtual-hub"},{"id":"2.3.3-02","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has one Virtual WAN hub with Azure Firewall and two site-to-site branch connections. Traffic from one branch to the other branch must be inspected by the firewall.\n\nWhat should you configure?","choices":["A private traffic routing policy by using routing intent","An internet traffic routing policy only","Threat intelligence in Alert and deny mode in the firewall policy","A network security group on the virtual hub"],"answer":[0],"explanation":"Routing intent has an internet policy and a private policy. Private traffic includes VNet, branch and inter-hub flows, so a private policy is needed to inspect branch-to-branch traffic.","rationale":["Correct: Branch-to-branch inspection requires routing intent, even in a single hub. A private traffic routing policy sends VNet and branch traffic to the firewall as the next hop.","Incorrect: An internet traffic policy sends only internet-bound traffic to the security solution. Branch-to-branch traffic is private traffic, so it would still bypass the firewall.","Incorrect: Threat intelligence filters known malicious addresses on traffic that reaches the firewall. It does not change routing, so branch-to-branch traffic still would not reach the firewall.","Incorrect: A virtual hub is Microsoft-managed, so you cannot attach an NSG to it. NSGs filter traffic on your own virtual network subnets or NICs, not Virtual WAN hub routing."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.3-03","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has a Standard Virtual WAN. The option to configure routing intent on hub1 is unavailable. Hub1 has a custom route table and a static route in defaultRouteTable whose next hop is a virtual network connection.\n\nWhat should you do first?","choices":["Remove the custom route table and the static route that uses a virtual network connection as next hop","Change the Virtual WAN type from Basic to Standard","Deploy a network virtual appliance in hub1","Delete and recreate defaultRouteTable"],"answer":[0],"explanation":"Routing intent can be enabled only on hubs that meet route prerequisites. Static routes with next hop Azure Firewall are allowed, but custom route tables and routes to connections are not.","rationale":["Correct: Routing intent needs a hub that has only noneRouteTable and defaultRouteTable and no static routes that point to a virtual network connection. Removing them meets the prerequisites.","Incorrect: Routing intent requires a Standard Virtual WAN, but the stem states that the Virtual WAN is already Standard. Changing the type is not the cause of the greyed-out option.","Incorrect: An NVA is one possible next hop for a routing policy, but the greyed-out option is caused by existing routes. Azure Firewall can also be the next hop, so no NVA is required.","Incorrect: defaultRouteTable is a built-in table and is part of the allowed set. The blocking items are the custom route table and the static route with a connection next hop."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.3-04","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Litware, Inc. needs private traffic in a Virtual WAN hub to go through Azure Firewall, and internet traffic to go through a software-as-a-service security solution that is deployed in the same hub.\n\nWhich tool should you use to configure the routing policies?","choices":["The Virtual WAN portal routing intent settings","The secured virtual hub settings of Azure Firewall Manager","An Azure Firewall policy with application rules","Custom route tables with user-defined routes"],"answer":[0],"explanation":"Routing intent can be configured in Azure Firewall Manager or the Virtual WAN portal, but only the Virtual WAN portal supports NVA and SaaS next hops.","rationale":["Correct: The Virtual WAN portal lets you choose different next hop resources per policy, including Azure Firewall, NVAs and SaaS solutions in the hub, so private and internet policies can differ.","Incorrect: Azure Firewall Manager supports routing policies only with Azure Firewall as the next hop, so it cannot point the internet policy to a SaaS solution. Use it when Azure Firewall secures both.","Incorrect: Firewall policy application rules filter traffic that already reaches the firewall. They do not choose a next hop for traffic, and they cannot send internet traffic to another solution.","Incorrect: Custom route tables are not allowed on a hub that uses routing intent, and routing intent exists to avoid them. Manual routes would also break the policy prerequisites."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.3-05","obj":"2.3.3","difficulty":"medium","type":"single","stem":"Relecloud has Virtual WAN hubs in West US and North Europe. Each hub has Azure Firewall. Traffic between virtual networks that are connected to different hubs must be inspected symmetrically by the firewalls.\n\nWhat should you do?","choices":["Enable routing intent on both hubs","Enable routing intent on the West US hub","Deploy one Azure Firewall in West US and remove the other","Create a route table with a static route on each virtual network connection"],"answer":[0],"explanation":"Inter-hub traffic inspection with hub firewalls requires routing intent on every participating hub, which keeps flows symmetric between the security appliances.","rationale":["Correct: Routing intent is the only Virtual WAN mechanism for inter-hub inspection, and it must be enabled on all hubs so traffic is routed symmetrically between the firewalls.","Incorrect: Enabling it on one hub leaves return traffic or the other direction uncontrolled, because inter-hub inspection needs routing intent on every hub to stay symmetric.","Incorrect: Removing a firewall defeats regional inspection and adds latency. The requirement is symmetric inspection across both hubs, which routing intent provides without removing a firewall.","Incorrect: Static routes on connections are not supported on hubs that use routing intent and would not provide symmetric inter-hub inspection. Routing intent manages these routes for you."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.3-06","obj":"2.3.3","difficulty":"easy","type":"yesno","stem":"Tailspin Toys secures a Virtual WAN hub by using Azure Firewall Manager and routing intent.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Routing intent offers an internet traffic policy and a private traffic policy.","Removing routing intent restores the previous defaultRouteTable configuration automatically.","Each spoke virtual network needs a user-defined route to send traffic to the firewall in the hub."],"answer":[0],"explanation":"Routing intent has internet and private policies, manages the routes for you, and does not roll back automatically when removed.","rationale":["Yes: Routing intent lets you declare policies for internet-bound traffic and for private traffic between virtual networks, branches and hubs.","No: The system does not save or restore earlier routes. Save gateways, connections and route tables before you enable routing intent so you can reapply them.","No: A secured virtual hub provides automated routing, so you do not configure user-defined routes on the spokes."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.3-07","obj":"2.3.3","difficulty":"hard","type":"order","stem":"Contoso, Ltd. has a Virtual WAN with spoke virtual networks already connected to a hub. The company must inspect private and internet traffic by using Azure Firewall in the hub.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create the Virtual WAN with a virtual hub in the target region.","Create a firewall policy that contains the required rules.","Associate the firewall policy with the hub in Azure Firewall Manager.","Set Internet traffic and Private traffic to Azure Firewall in the security configuration of the hub.","Create a route table with a 0.0.0.0/0 user-defined route on each spoke subnet.","Attach a network security group to the virtual hub."],"answer":[0,1,2,3],"explanation":"A secured hub is built in order: Virtual WAN and hub, firewall policy, association of the policy with the hub, and routing policies that send traffic to the firewall.","rationale":["Step 1: the Virtual WAN and its hub are the base resources that the policy is associated with and that the spokes connect to, so they come first.","Step 2: the policy holds the allow rules, threat intelligence and other settings. Without rules the firewall denies all traffic, so create it before associating it.","Step 3: associating the policy with the hub secures the hub with Azure Firewall and applies the rules to it. The hub must exist before it can be associated.","Step 4: the routing policies send private and internet traffic to the firewall. They are set after the hub is secured, which enables the traffic flow.","Incorrect: UDRs on spokes are the manual approach for a customer-managed hub. A secured hub provides automated routing, so these routes are not needed.","Incorrect: A virtual hub is Microsoft-managed and does not accept an NSG. NSGs belong on subnets or NICs of your own virtual networks."],"ref":"https://learn.microsoft.com/azure/firewall-manager/secure-cloud-network"},{"id":"2.3.3-08","obj":"2.3.3","difficulty":"hard","type":"multi","stem":"Woodgrove Bank wants to enable routing intent on a Virtual WAN hub that currently has several custom route tables and a static route that points to a spoke connection.\n\nWhich two conditions should the hub meet before routing intent can be configured? Each correct answer presents part of the solution.","choices":["No custom route tables exist besides noneRouteTable and defaultRouteTable","No static route uses a virtual network connection as next hop","The Virtual WAN type is Basic","All virtual network connections are deleted","A VPN gateway is deployed in the hub"],"answer":[0,1],"explanation":"Routing intent requires a clean routing baseline: only the built-in route tables and no static routes that point to virtual network connections, on a Standard Virtual WAN.","rationale":["Correct: Routing intent can be configured only on hubs where the only route tables are noneRouteTable and defaultRouteTable. Custom route tables must be removed first.","Correct: Static routes whose next hop is a virtual network connection are not allowed. Static routes with next hop Azure Firewall can remain in defaultRouteTable.","Incorrect: Routing intent is available on Standard Virtual WAN, not Basic. A Basic type would block the feature instead of enabling it.","Incorrect: Connections stay in place. Routing intent manages their route association and propagation, so deleting them is not required and would disconnect the spokes.","Incorrect: A VPN gateway is not a prerequisite. Routing intent works for hubs with or without gateways, because it steers traffic to the security next hop."],"ref":"https://learn.microsoft.com/azure/virtual-wan/how-to-routing-policies"},{"id":"2.3.4-01","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. configures a point-to-site VPN for remote employees. Users must sign in with Microsoft Entra ID so that Conditional Access and multifactor authentication apply.\n\nWhich tunnel type and client should you use?","choices":["OpenVPN with the Azure VPN Client","IKEv2 with the native Windows VPN client","SSTP with the native Windows VPN client","IKEv2 and SSTP with a RADIUS server"],"answer":[0],"explanation":"Microsoft Entra ID authentication for P2S requires OpenVPN and the Azure VPN Client. Other tunnel types rely on certificates or RADIUS.","rationale":["Correct: Microsoft Entra ID authentication for point-to-site is supported only with the OpenVPN tunnel type and requires the Azure VPN Client. This also enables Conditional Access and MFA.","Incorrect: IKEv2 supports Azure certificate or RADIUS authentication, not Microsoft Entra ID. Use it for native macOS, iOS or Windows clients with certificates.","Incorrect: SSTP supports certificate or RADIUS authentication and cannot use Microsoft Entra ID sign-in. It is used by Windows clients that need to cross restrictive firewalls.","Incorrect: RADIUS can integrate with other identity systems, but the combination of IKEv2 and SSTP does not offer Microsoft Entra ID authentication, so Conditional Access for Entra would not apply."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-about"},{"id":"2.3.4-02","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a site-to-site VPN connection to a branch office. The branch VPN device accepts only a specific IKE and IPsec algorithm combination that differs from the Azure defaults.\n\nWhat should you configure on the connection?","choices":["A custom IPsec/IKE policy","BGP on the connection","Active-active mode on the gateway","A second connection with a different shared key"],"answer":[0],"explanation":"Custom IPsec/IKE policies let you align the encryption, integrity, DH group and lifetime settings of a connection with the on-premises device. One policy applies per connection.","rationale":["Correct: A custom IPsec/IKE policy sets the exact algorithms for IKE and IPsec on a connection. Azure then proposes and accepts only that combination, which must match the on-premises device.","Incorrect: BGP exchanges routes dynamically between gateways. It does not change encryption or integrity algorithms, so the algorithm mismatch would remain.","Incorrect: Active-active mode gives the gateway two instances for availability. It does not change the cryptographic parameters negotiated with the branch device.","Incorrect: A shared key authenticates the peers. Another key does not alter the proposed algorithms, so the negotiation with the branch device would still fail."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/ipsec-ike-policy-howto"},{"id":"2.3.4-03","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Litware, Inc. has a VPN gateway that uses the Basic SKU. The company wants point-to-site users to authenticate against an existing RADIUS server.\n\nWhat should you do?","choices":["Deploy a VPN gateway that uses a SKU other than Basic","Select IKEv2 as the tunnel type on the Basic gateway","Add a secondary RADIUS server to the Basic gateway","Enable active-active mode on the Basic gateway"],"answer":[0],"explanation":"Gateway SKU limits authentication choices. The Basic SKU supports IKEv2 with certificates but not RADIUS or OpenVPN, so a higher SKU is required for those.","rationale":["Correct: The Basic SKU does not support RADIUS authentication. You need a gateway SKU that supports it, such as a VpnGw SKU, and then you specify the RADIUS server and secret.","Incorrect: The Basic SKU supports IKEv2 with certificate authentication, but not RADIUS authentication, so choosing IKEv2 does not add RADIUS support.","Incorrect: A secondary RADIUS server provides redundancy, but you first need a gateway SKU that supports RADIUS. The Basic SKU cannot be configured for it at all.","Incorrect: Active-active mode concerns gateway instances and public IP addresses. It does not add authentication types, so the Basic SKU still lacks RADIUS."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-radius-gateway"},{"id":"2.3.4-04","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Woodgrove Bank has two point-to-site VPN gateways. Finance users must connect only to gateway GW1, and Operations users only to gateway GW2. Users must sign in with Microsoft Entra ID credentials.\n\nWhat should you configure?","choices":["A custom audience app ID for each gateway, with the groups assigned to the matching app","The Microsoft-registered Azure VPN Client audience on both gateways","Different root certificates on each gateway","A different tunnel type on each gateway"],"answer":[0],"explanation":"To restrict P2S access by user or group with Entra ID, create a custom audience app per gateway, add the Azure VPN Client to it, and assign users and groups to each app.","rationale":["Correct: Granular access with Microsoft Entra ID uses one custom app per gateway. You assign groups to each app, set the app ID as the audience on its gateway, and users can authenticate only to the gateway they are assigned to.","Incorrect: The Microsoft-registered audience is shared and has no per-group assignment, so every authenticated user could connect to both gateways. Use it when no per-group split is needed.","Incorrect: Certificates would separate users by certificate, but the requirement is Entra ID sign-in. Use different roots when certificate authentication is acceptable.","Incorrect: Tunnel types decide the protocol, not who may authenticate. Entra ID supports only OpenVPN anyway, so both gateways would use the same type and no separation occurs."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-entra-users-access"},{"id":"2.3.4-05","obj":"2.3.4","difficulty":"hard","type":"multi","stem":"Tailspin Toys must configure a P2S VPN gateway so that employees authenticate by using Microsoft Entra ID with the Microsoft-registered Azure VPN Client application.\n\nWhich two settings should you configure on the gateway? Each correct answer presents part of the solution.","choices":["Set the tunnel type to OpenVPN (SSL)","Set the audience to the Microsoft-registered Azure VPN Client app ID","Upload the public key of a trusted root certificate","Enter the IP address and secret of a RADIUS server","Select SSTP as the tunnel type"],"answer":[0,1],"explanation":"An Entra-based P2S gateway needs OpenVPN as tunnel type plus tenant, audience and issuer values. Certificates, RADIUS and SSTP belong to other authentication choices.","rationale":["Correct: Microsoft Entra ID authentication works only with the OpenVPN tunnel type, so the gateway must use OpenVPN (SSL).","Correct: The gateway needs the tenant, the audience and the issuer. The audience for the Microsoft-registered app is its app ID, so no manual app registration is needed in the tenant.","Incorrect: A root certificate public key belongs to Azure certificate authentication. Use it when clients authenticate with client certificates instead of Entra ID.","Incorrect: A RADIUS server and shared secret belong to RADIUS authentication, which delegates sign-in to your NPS or RADIUS server. It is not part of Entra ID authentication.","Incorrect: SSTP supports certificate and RADIUS authentication and cannot be used with Microsoft Entra ID. OpenVPN is required for Entra sign-in."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-entra-gateway"},{"id":"2.3.4-06","obj":"2.3.4","difficulty":"easy","type":"yesno","stem":"Relecloud configures point-to-site VPN access to a virtual network by using a VPN gateway.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Microsoft Entra ID authentication requires the OpenVPN tunnel type and the Azure VPN Client.","The OpenVPN and SSTP tunnel types can be enabled together on the same gateway.","A gateway that uses the Basic SKU supports RADIUS authentication."],"answer":[0],"explanation":"Entra ID needs OpenVPN and the Azure VPN Client. OpenVPN and SSTP are mutually exclusive, and the Basic SKU lacks RADIUS and OpenVPN.","rationale":["Yes: Entra ID authentication is supported only for the OpenVPN protocol, and clients must use the Azure VPN Client.","No: OpenVPN and SSTP cannot be enabled together. Combine OpenVPN with IKEv2 instead if you need multiple tunnel types.","No: The Basic SKU supports IKEv2 with certificates but not RADIUS or OpenVPN. Use a higher SKU for RADIUS authentication."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-about"},{"id":"2.3.4-07","obj":"2.3.4","difficulty":"hard","type":"order","stem":"Contoso, Ltd. has a virtual network with a gateway subnet. Employees must connect by using point-to-site VPN with Microsoft Entra ID authentication from Windows computers.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a route-based VPN gateway in the gateway subnet.","Configure the address pool, the OpenVPN tunnel type, and Microsoft Entra ID authentication on the gateway.","Download the VPN client profile configuration package from the gateway.","Import the profile into the Azure VPN Client on the computers and connect.","Upload the public key of a trusted root certificate to the gateway.","Configure a RADIUS server IP address and secret on the gateway."],"answer":[0,1,2,3],"explanation":"Order follows dependencies: gateway, then point-to-site settings, then the client profile that reflects those settings, and finally the client import.","rationale":["Step 1: the gateway is the resource that hosts point-to-site settings, so it must exist first. It must be route-based and use a SKU that supports Entra ID.","Step 2: the tunnel type and authentication settings define what the generated client profile contains, so configure them before d
