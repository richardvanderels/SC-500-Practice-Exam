ement. Use identity-based pulls to avoid stored credentials.","Incorrect: pulling an image needs only AcrPull, and the stem says the identity already has it. AcrPush adds the ability to push images and does not resolve a subnet conflict.","Incorrect: private endpoint network policies control NSG and route table enforcement on a subnet, not whether a delegated subnet may contain a private endpoint. The delegated subnet still accepts only container groups."],"explanation":"A subnet that is delegated to Azure Container Instances can contain only container groups. The registry private endpoint must therefore be created in a different subnet of the virtual network, and the managed identity pull then works through the private endpoint.","ref":"https://learn.microsoft.com/azure/container-instances/using-azure-container-registry-mi"},{"id":"3.3.5-01","obj":"3.3.5","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has an HTTP-triggered function named Func1 in a function app that contains several functions. Callers must present a key that grants access to Func1 but not to the other functions, and the key must not allow calls to the runtime administrative endpoints.\n\nWhat should you do?","choices":["Set the authorization level to function and share a function key of Func1.","Set the authorization level to function and share a host key.","Set the authorization level to admin and share the master key.","Set the authorization level to function and share a system key."],"answer":[0],"rationale":["Correct: a function key is valid only for its own function and does not grant access to the /admin endpoints, which matches both constraints.","Incorrect: a host key works for every function in the app, so a caller could invoke the other functions. Use host keys when a client needs the whole app.","Incorrect: the master key is a special host key that also grants administrative access to the runtime REST APIs. Reserve it for administrators and never distribute it to callers.","Incorrect: system keys are created and managed by extensions for internal webhook endpoints, such as the Event Grid trigger, and you cannot set their values. They are not meant for client callers."],"explanation":"HTTP authorization levels map to key types: function requires a function or host key, and admin requires the master key. A function key is scoped to one function, a host key to every function in the app, and the master key also opens the /admin runtime endpoints.","ref":"https://learn.microsoft.com/azure/azure-functions/function-keys-how-to"},{"id":"3.3.5-02","obj":"3.3.5","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. hosts an HTTP-triggered function app that is called by a public single-page application. Users must sign in with Microsoft Entra ID, requests without a valid sign-in must be rejected by the platform before they reach the function code, and no shared secret may be embedded in the client.\n\nWhat should you configure?","choices":["App Service Authentication with Microsoft Entra ID and Require authentication","A function authorization level with a host key sent by the client","An access restriction rule that allows the corporate IP range","The functionsRuntimeAdminIsolationEnabled site property"],"answer":[0],"rationale":["Correct: the platform authenticates users with Microsoft Entra ID and rejects unauthenticated requests before the function code runs, with no secret in the client.","Incorrect: a host key is a shared secret that would have to be embedded in a public client, where anyone can read it. It also does not identify the signed-in user.","Incorrect: an IP restriction limits network sources but does not authenticate users, and users of a public SPA connect from arbitrary addresses. Use it to limit callers to known networks.","Incorrect: this property disables the /admin runtime endpoints. It does not authenticate users of the HTTP functions. Use it to harden the administrative surface of the app."],"explanation":"App Service Authentication, also called Easy Auth, runs in front of the function code and can require authentication with Microsoft Entra ID. Access keys are shared secrets and do not identify users, so they are unsuitable for public clients.","ref":"https://learn.microsoft.com/azure/azure-functions/security-concepts"},{"id":"3.3.5-03","obj":"3.3.5","difficulty":"medium","type":"dragdrop","stem":"Woodgrove Bank runs four function apps. You must configure a network or access control for each requirement.\n\nWhich control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once, more than once, or not at all.","choices":["functionsRuntimeAdminIsolationEnabled set to true","Access restriction rules","Private endpoint","Virtual network integration","Authorization level anonymous","Host key rotation"],"targets":["Func1: the /admin runtime endpoints must be unavailable, even to a caller that has the master key","Func2: inbound requests must be accepted only from the IP address of an API Management instance","Func3: clients must reach the app only on a private IP address in a virtual network","Func4: the app must read secrets through Key Vault references from a key vault that blocks public access"],"answer":[0,1,2,3],"rationale":["Setting functionsRuntimeAdminIsolationEnabled to true disables the /admin endpoints, so even the master key cannot call them.","Access restriction rules define allow and deny rules by IP address, so one allow rule for the API Management address limits inbound callers.","A private endpoint gives the app a private IP address in the virtual network for inbound traffic, which removes the public path.","Virtual network integration lets the app reach network-restricted resources, so Key Vault references can retrieve secrets from a vault that blocks public access."],"notes":["A site property that disables the administrative runtime endpoints. Use it to reduce the administrative attack surface, not to filter callers.","Allow and deny rules evaluated by priority for inbound traffic from IP ranges or service tags. Use them to limit who can reach the public endpoint.","A network interface with a private IP address that brings the app into your virtual network for inbound traffic. Use it to remove public exposure.","Gives the app outbound access to resources in a virtual network. Use it for Key Vault references to network-restricted vaults or virtual network triggers.","Requires no key at all, so anyone who can reach the endpoint can call it. Use it only for deliberately public functions with other controls in front.","Regenerates keys on a schedule. It limits the lifetime of shared secrets but does not restrict network paths or disable endpoints."],"explanation":"Functions security combines runtime hardening (disabling /admin endpoints), inbound network controls (access restrictions and private endpoints) and outbound controls (virtual network integration). Match the direction and layer named in the requirement.","ref":"https://learn.microsoft.com/azure/azure-functions/security-concepts"},{"id":"3.3.5-04","obj":"3.3.5","difficulty":"hard","type":"multi","stem":"Woodgrove Bank hosts an HTTP-triggered function app on the Elastic Premium plan. Requests must be inspected for common web attacks such as SQL injection and cross-site scripting, and clients must not be able to bypass the inspection by calling the default function app endpoint directly.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Place Azure Application Gateway with a WAF policy in front of the function app.","Restrict inbound access to the function app to the gateway, for example by using a private endpoint.","Enable App Service Authentication with Microsoft Entra ID on the function app.","Set the authorization level of each function to function.","Set functionsRuntimeAdminIsolationEnabled to true on the function app."],"answer":[0,1],"rationale":["Correct: the WAF policy on Application Gateway inspects request content for attacks such as SQL injection and cross-site scripting.","Correct: without a restriction on the function app endpoint, clients can call the app directly and skip the WAF. A private endpoint or gateway-only access rule closes that path.","Incorrect: authentication proves who the caller is but does not inspect request content for attacks. Use it to require sign-in, as a separate control.","Incorrect: function authorization requires an access key but does not inspect payloads, and callers that hold the key can still send malicious content. Use it as a coarse gate.","Incorrect: this property disables the /admin runtime endpoints and does not inspect or restrict HTTP function traffic. Use it to harden the administrative surface."],"explanation":"A web application firewall inspects HTTP content, and Application Gateway or Azure Front Door provide it. Because the function app also has its own endpoint, direct access must be blocked, for example with a private endpoint or access restrictions that allow only the gateway.","ref":"https://learn.microsoft.com/azure/azure-functions/security-concepts"},{"id":"3.3.6-01","obj":"3.3.6","difficulty":"easy","type":"single","stem":"Tailspin Toys has a Consumption logic app with a workflow that starts with the Request trigger. Callers must authenticate to the trigger endpoint by presenting Microsoft Entra ID access tokens instead of using the shared access signature in the callback URL.\n\nWhat should you configure?","choices":["An authorization policy that enables OAuth 2.0 with Microsoft Entra ID","Easy Auth on the logic app resource","Secure inputs and outputs on the trigger","An allowed inbound IP address range for the trigger"],"answer":[0],"rationale":["Correct: an authorization policy with issuer and audience claims makes the trigger accept OAuth access tokens from Microsoft Entra ID, which can replace the SAS key.","Incorrect: Easy Auth is the Azure Functions provision for Standard workflows that start with the Request trigger. The stem uses a Consumption logic app, which uses authorization policies instead.","Incorrect: secure inputs and outputs obfuscate data in run history. They do not authenticate callers. Use them to hide sensitive values in monitoring views.","Incorrect: an IP range limits where calls may come from but does not authenticate the caller or validate tokens. Use it as an additional access control next to authentication."],"explanation":"For a Consumption workflow with a request-based trigger, you add an authorization policy at the logic app resource level that enables OAuth 2.0 with Microsoft Entra ID. The claims of an inbound token, such as issuer and audience, are compared with the policy, and SAS can be disabled when only OAuth is wanted.","ref":"https://learn.microsoft.com/azure/logic-apps/set-up-security-permissions"},{"id":"3.3.6-02","obj":"3.3.6","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a logic app workflow that retrieves a password from Azure Key Vault and passes it to an HTTP action. Operators must be able to open the run history and see the inputs and outputs of the other actions, but the password must not be visible in the run history.\n\nWhat should you configure?","choices":["Secure outputs on the Key Vault action and secure inputs on the HTTP action","A run history access restriction that uses the range 0.0.0.0-0.0.0.0","An allowed inbound IP address range for the workflow trigger","Disabled shared access signature (SAS) authentication on the trigger"],"answer":[0],"rationale":["Correct: obfuscating the output of the Key Vault action and the input of the HTTP action hides the password in run history, while the other actions stay visible to operators.","Incorrect: the range 0.0.0.0-0.0.0.0 blocks access to inputs and outputs of every action, so operators could not see the other actions either. Use it for just-in-time data access.","Incorrect: an inbound IP range controls who can call the trigger and has no effect on what run history shows. Use it to limit callers to known networks.","Incorrect: disabling SAS changes how callers authenticate to a Request trigger and does not hide data in run history. Use it to enforce OAuth with Microsoft Entra ID."],"explanation":"Secure inputs and secure outputs obfuscate the content of an action in run history, so operators can still see the run but not the sensitive values. Restricting run history by IP range hides inputs and outputs for every action, which is too broad here.","ref":"https://learn.microsoft.com/azure/logic-apps/set-up-security-permissions"},{"id":"3.3.6-03","obj":"3.3.6","difficulty":"medium","type":"yesno","stem":"Litware, Inc. protects a Consumption logic app workflow that starts with the Request trigger. The workflow is called by other workflows and by an on-premises application.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The trigger can accept calls that use OAuth 2.0 with Microsoft Entra ID and calls that use SAS at the same time without errors.","You can disable SAS authentication so that callers must use OAuth 2.0 with Microsoft Entra ID.","If you select Only other Logic Apps, a parent workflow that uses the HTTP action can still call the nested workflow.","In the Azure portal, an inbound IP address restriction applies to both the triggers and the actions of the workflow."],"answer":[1,3],"rationale":["No: using both schemes at the same time makes Azure Logic Apps generate an error, because the service cannot decide which scheme to apply. Choose one scheme, or disable SAS.","Yes: for a Consumption workflow that starts with the Request trigger, you can disable SAS and restrict authorization to OAuth 2.0 with Microsoft Entra ID.","No: Only other Logic Apps works only when the parent uses the built-in Azure Logic Apps action. A call made with the HTTP action is blocked with a 401 Unauthorized error.","Yes: in the portal the IP restriction affects both triggers and actions. To set the filters separately, use the accessControl object in an Azure Resource Manager template."],"explanation":"A Consumption Request trigger can use one authorization scheme at a time, either SAS or OAuth with Microsoft Entra ID, and SAS can be disabled. The Only other Logic Apps option accepts calls made with the built-in Azure Logic Apps action, and the portal IP restriction applies to triggers and actions.","ref":"https://learn.microsoft.com/azure/logic-apps/set-up-security-permissions"},{"id":"3.3.6-04","obj":"3.3.6","difficulty":"hard","type":"single","stem":"Relecloud exposes workflows of a Standard logic app through Azure API Management. Only API Management may call the Request trigger endpoints. Callers must be authenticated with a managed identity, and no SAS key may be stored or passed in a query string.\n\nWhat should you do?","choices":["Enable Easy Auth with Microsoft Entra ID on the logic app and call it with the API Management managed identity.","Store the SAS key of each workflow in Key Vault and add it with the set-query-parameter policy in API Management.","Add an OAuth 2.0 authorization policy for Microsoft Entra ID tokens to the Standard logic app resource.","Restrict the inbound IP addresses of the logic app to the outbound address of the API Management instance."],"answer":[0],"rationale":["Correct: Easy Auth authenticates the caller with Microsoft Entra ID, and API Management presents a token for its managed identity, so no SAS key is stored or sent in a query string.","Incorrect: this is the SAS-based pattern that the stem forbids. It is a valid option when a managed identity cannot be used, with the keys protected in Key Vault.","Incorrect: authorization policies with OAuth claims are the mechanism for Consumption workflows. Standard workflows use Easy Auth for managed identity authentication.","Incorrect: an IP restriction controls access but does not authenticate the caller with a managed identity. Use it as an additional control next to Easy Auth, not instead of it."],"explanation":"For Standard workflows that start with the Request trigger, Easy Auth with Microsoft Entra ID can authenticate callers by managed identity. API Management then obtains a token with its managed identity, so no SAS key is needed, and an IP restriction can still be added as an extra access control.","ref":"https://learn.microsoft.com/azure/logic-apps/set-up-security-permissions"},{"id":"3.3.7-01","obj":"3.3.7","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has an Azure App Service web app that is reachable over both HTTP and HTTPS. Requests to the default domain that arrive over HTTP must be redirected to HTTPS.\n\nWhat should you do?","choices":["Turn on the HTTPS Only setting in the general settings of the app.","Set the minimum inbound TLS version of the app to 1.3.","Bind a TLS/SSL certificate to a custom domain of the app.","Require incoming client certificates for the app."],"answer":[0],"rationale":["Correct: HTTPS Only redirects all HTTP traffic to HTTPS, so every client connection to the app is encrypted. The redirect is not enabled by default.","Incorrect: the minimum TLS version rejects older TLS versions on HTTPS connections and does not redirect HTTP requests. Use it to retire weak protocol versions.","Incorrect: a certificate on a custom domain makes HTTPS possible for that name, but HTTP requests are still served unless you redirect them. Use it when you add a custom domain.","Incorrect: client certificates make the app verify the identity of the caller (mutual TLS) and do not redirect HTTP requests. Use them when you must authenticate clients, for example in business-to-business scenarios."],"explanation":"The HTTPS Only setting redirects HTTP requests to HTTPS and is not turned on by default. The minimum TLS version controls which protocol versions are accepted, and certificates enable HTTPS on custom domains, but neither redirects HTTP traffic.","ref":"https://learn.microsoft.com/azure/app-service/overview-security"},{"id":"3.3.7-02","obj":"3.3.7","difficulty":"easy","type":"single","stem":"Contoso, Ltd. hosts an API in Azure App Service that is called by native mobile apps and other API clients. All requests must be authenticated with Microsoft Entra ID, no authentication code may be added to the API, and unauthenticated requests must receive HTTP 401 instead of a redirect to a sign-in page.\n\nWhich App Service Authentication settings should you configure?","choices":["Require authentication, and return HTTP 401 Unauthorized for unauthenticated requests","Allow unauthenticated requests, and validate the Entra token in the API code","Require authentication, and redirect unauthenticated requests with HTTP 302 Found","Require authentication, and return HTTP 404 Not found for unauthenticated requests"],"answer":[0],"rationale":["Correct: Require authentication blocks unauthenticated traffic without code changes, and the HTTP 401 response is the recommended choice for APIs and native clients.","Incorrect: allowing unauthenticated requests defers the decision to the application, which means writing authentication code that the stem forbids. Use it when the app must serve anonymous pages.","Incorrect: the HTTP 302 redirect sends browser clients to the sign-in page, which is recommended for websites. API clients and native apps cannot complete such a redirect.","Incorrect: HTTP 404 hides the existence of the app but misreports the failure and gives API clients no signal to authenticate. Use it only when you deliberately conceal the resource."],"explanation":"With Require authentication, App Service rejects unauthenticated traffic before it reaches your code. For unauthenticated requests you choose the response: HTTP 302 redirect suits websites, and HTTP 401 Unauthorized suits APIs.","ref":"https://learn.microsoft.com/azure/app-service/overview-authentication-authorization"},{"id":"3.3.7-03","obj":"3.3.7","difficulty":"medium","type":"dropdown","stem":"Woodgrove Bank hosts the web app App1 in the resource group RG1. App1 must accept traffic from its own Azure Front Door profile, which has the ID in $afd.FrontDoorId, and must reject every other source.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```\nAdd-AzWebAppAccessRestrictionRule -ResourceGroupName \"RG1\" -WebAppName \"App1\" `\n  -Name \"FrontDoorOnly\" -Priority 100 -Action [[1]] `\n  -ServiceTag [[2]] `\n  -HttpHeader @{'[[3]]' = $afd.FrontDoorId}\n```","targets":[{"label":"Box 1","options":["Allow","Deny"],"why":["Correct: the rule must allow the Front Door traffic. When at least one rule exists, the unmatched rule implicitly denies everything else.","Incorrect: a Deny rule would block Front Door itself. Use Deny to block specific addresses while the unmatched rule action is set to Allow."]},{"label":"Box 2","options":["AzureFrontDoor.Backend","AzureFrontDoor.Frontend","AppService"],"why":["Correct: AzureFrontDoor.Backend contains the address ranges from which Front Door sends traffic to your origin.","Incorrect: AzureFrontDoor.Frontend describes the addresses of the Front Door edge that clients connect to, not the addresses it uses to call your origin.","Incorrect: the AppService tag lists inbound addresses of the App Service platform. It does not identify Front Door traffic."]},{"label":"Box 3","options":["x-azure-fdid","x-forwarded-for","x-fd-healthprobe"],"why":["Correct: Front Door sends its profile ID in the X-Azure-FDID header, so filtering on it limits access to your own profile instead of any Front Door profile.","Incorrect: X-Forwarded-For carries the originating client IP address and cannot hold a Front Door profile ID. Use it to filter on the original client address behind a proxy.","Incorrect: X-FD-HealthProbe identifies Front Door health probe requests with the value 1. Use it to treat health probes differently."]}],"answer":[0,0,0],"explanation":"To limit an app to one Front Door profile, add an Allow rule for the AzureFrontDoor.Backend service tag, which holds the addresses Front Door uses to reach origins, and filter on the X-Azure-FDID header that carries the unique profile ID. Once a rule exists, unmatched traffic is denied by default.","ref":"https://learn.microsoft.com/azure/app-service/app-service-ip-restrictions"},{"id":"3.3.7-04","obj":"3.3.7","difficulty":"hard","type":"single","stem":"Litware, Inc. hosts App1 in Azure App Service. App1 has a private endpoint in the subnet PESubnet of VNet1, and the access restriction rules of App1 allow the Azure Front Door service tag. A test shows that a virtual machine in VNet1 can still reach App1 directly through the private endpoint.\n\nWhat should you do to restrict which sources can reach App1 through the private endpoint?","choices":["Add network security group rules to the subnet that contains the private endpoint.","Add a deny rule for VNet1 to the access restrictions of the main site.","Set the unmatched rule action of the main site to Deny.","Add a service endpoint rule for the subnet of the virtual machine."],"answer":[0],"rationale":["Correct: restrictions for private endpoints are configured with network security groups, so NSG rules on PESubnet control which sources can reach App1 privately.","Incorrect: access restriction rules are evaluated only for the default endpoint, not for traffic through a private endpoint. Use them to filter public inbound traffic by IP, service tag or header.","Incorrect: the unmatched rule action is part of the same access restriction evaluation and does not apply to private endpoint traffic. Use it to define the default for public traffic.","Incorrect: service endpoint rules are not supported on apps that have a private endpoint, and they would allow a subnet rather than restrict one. Use them for apps without private endpoints."],"explanation":"Access restrictions apply to traffic that enters through the default (public) endpoint. Traffic through a private endpoint goes directly to the site, so you control it with network security groups on the subnet of the private endpoint.","ref":"https://learn.microsoft.com/azure/app-service/overview-access-restrictions"},{"id":"3.3.8-01","obj":"3.3.8","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has just created a WAF policy with a managed rule set for an Application Gateway WAF v2. The security team must observe which requests match rules against production traffic and tune false positives without blocking any request.\n\nWhich WAF mode should you configure?","choices":["Detection mode, with WAF logging enabled","Prevention mode, with WAF logging enabled","Prevention mode with the Bot Manager rule set","Prevention mode with a custom rate-limit rule"],"answer":[0],"rationale":["Correct: Detection mode only logs requests that match rules, so you can review the WAF logs and tune exclusions without affecting production traffic.","Incorrect: Prevention mode blocks requests that exceed the anomaly threshold, so false positives would block legitimate users. Switch to it after tuning.","Incorrect: Prevention mode blocks requests that match the Bot Manager rules, such as bad bots. It does not support an observe-only phase. Use it when you are ready to enforce bot protection.","Incorrect: a rate-limit custom rule in Prevention mode blocks clients that exceed the threshold. That is enforcement, not observation. Use it to limit abusive request rates."],"explanation":"Detection mode logs requests that match rules and does not block them, so it is used while tuning. After exclusions and overrides are in place, the policy is switched to Prevention mode so that matching requests are blocked.","ref":"https://learn.microsoft.com/azure/web-application-firewall/secure-web-application-firewall"},{"id":"3.3.8-02","obj":"3.3.8","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has an Application Gateway WAF v2 that protects three sites. A global WAF policy is associated with the gateway. For the path /payments of one site, all managed rules must stay enabled with no exclusions, while the rest of that site and the other sites keep the global policy.\n\nWhich WAF policy association should you use?","choices":["A per-URI policy associated with the path-based rule for /payments","A per-site policy associated with the listener of that site","A second global policy associated with the application gateway","A custom rule with the Allow action for the path /payments"],"answer":[0],"rationale":["Correct: a per-URI policy overrides the per-site and global policies for the /payments path only, so you can keep all rules enabled and drop exclusions there.","Incorrect: a per-site policy applies to the whole listener, so the rest of the site would also move to the stricter policy. Use it when one site needs different settings from the others.","Incorrect: a policy associated with the gateway is the global policy, and it would change protection for all three sites. Use it to define the baseline for every site.","Incorrect: an Allow custom rule skips all later rule evaluation for matching requests, which removes protection instead of strengthening it. Use Allow only for trusted traffic."],"explanation":"A WAF policy can be associated with the gateway (global), a listener (per-site) or a path-based rule (per-URI), and the most specific association wins. A per-URI policy therefore changes the behavior for one path while everything else keeps the broader policy.","ref":"https://learn.microsoft.com/azure/web-application-firewall/ag/policy-overview"},{"id":"3.3.8-03","obj":"3.3.8","difficulty":"medium","type":"dropdown","stem":"Tailspin Toys uses Azure Front Door with a WAF policy named waf1. A custom rate-limit rule must block any client IP address that sends more than 1,000 requests in one minute. A match condition for the path /promo is added after the rule is created.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```\naz network front-door waf-policy rule create \\\n  --name rateLimitRule --policy-name waf1 --resource-group RG1 \\\n  --rule-type [[1]] \\\n  --rate-limit-duration 1 --rate-limit-threshold [[2]] \\\n  --action [[3]] --priority 1 --defer\n```","targets":[{"label":"Box 1","options":["RateLimitRule","MatchRule"],"why":["Correct: RateLimitRule is the custom rule type that counts requests per client over a duration and acts when the threshold is exceeded.","Incorrect: MatchRule is the custom rule type that evaluates match conditions on single requests, such as IP lists or geo filters. It has no duration or threshold."]},{"label":"Box 2","options":["1000","60","1"],"why":["Correct: the threshold is the number of requests allowed in the duration, so 1000 with a duration of 1 minute matches the requirement.","Incorrect: 60 would allow 60 requests per minute, which is far lower than the requirement. The duration is in minutes, not seconds, so 60 is not a time value either.","Incorrect: 1 would block a client after a single request in the minute. The 1 value belongs to the duration parameter, which is already set."]},{"label":"Box 3","options":["Block","Allow","Log"],"why":["Correct: Block stops requests from a client that exceeds the threshold until the next period starts.","Incorrect: Allow lets the requests through, which defeats the purpose of the rate limit. Use Allow for trusted sources that must bypass other rules.","Incorrect: Log records the match and lets the request continue. Use it to observe rate-limit hits before you enforce them."]}],"answer":[0,0,0],"explanation":"A rate-limit custom rule has the rule type RateLimitRule, a duration of one or five minutes, a threshold of requests per client, and an action. The rule must also contain a match condition, which is why the --defer argument postpones submission until the condition is added.","ref":"https://learn.microsoft.com/azure/web-application-firewall/afds/waf-front-door-rate-limit-configure"},{"id":"3.3.8-04","obj":"3.3.8","difficulty":"hard","type":"multi","stem":"Relecloud operates a retail site behind Azure Front Door Premium with a WAF policy in Prevention mode. The site receives credential stuffing attempts from known bad bots that must be identified by signature, while search engine crawlers must still be able to index the site. The company has no customers in one country and must block all traffic from that country.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Enable the Bot Manager managed rule set and set the action for bad bots to Block.","Create a custom rule with a geo-location match condition for the country and the Block action.","Create a rate-limit custom rule that allows 100 requests per minute for each client IP address.","Add a per-rule exclusion for the default rule set rules that match the bot traffic.","Create a custom rule with the Allow action for requests whose User-Agent header names a search engine."],"answer":[0,1],"rationale":["Correct: the Bot Manager rule set identifies known bad bots by signature and lets you block them while good bots such as search engine crawlers stay allowed.","Correct: a custom rule with a geo-location condition and the Block action blocks the country, and it is evaluated before the managed rules.","Incorrect: a rate-limit rule throttles heavy clients but does not identify bots by signature or select a country. Use it to limit abusive request volumes.","Incorrect: exclusions remove request attributes from inspection to cut false positives, so they would weaken protection against the traffic you want to stop. Use them to tune legitimate requests.","Incorrect: an Allow rule skips all other rules for matching requests, and the User-Agent header can be forged, so attackers could bypass the WAF. Use the Bot Manager rule set to allow verified good bots."],"explanation":"The Bot Manager managed rule set classifies traffic into good, bad and unknown bots, so bad bots can be blocked while good crawlers are allowed. Country-based blocking is a custom rule with a geo-location match condition, and custom rules run before managed rules.","ref":"https://learn.microsoft.com/azure/web-application-firewall/afds/afds-overview"},{"id":"3.3.9-01","obj":"3.3.9","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. publishes an API through Azure API Management. Clients present JSON Web Tokens that are issued by a third-party OpenID Connect identity provider, not by Microsoft Entra ID. Requests without a valid token must be rejected at the gateway before they reach the back end.\n\nWhich policy should you add to the inbound section?","choices":["validate-jwt","validate-azure-ad-token","validate-client-certificate","ip-filter"],"answer":[0],"rationale":["Correct: validate-jwt validates a token from a third-party identity provider at the gateway and rejects requests with a missing or invalid token.","Incorrect: validate-azure-ad-token is designed for tokens issued by Microsoft Entra ID. The stem uses a third-party provider. Use it when Entra ID is the issuer.","Incorrect: validate-client-certificate checks the certificate that a client presents during mutual TLS, not a bearer token. Use it when clients authenticate with certificates.","Incorrect: ip-filter allows or denies calls by caller IP address and does not inspect tokens. Use it to limit calls to known address ranges."],"explanation":"The validate-jwt policy enforces the existence and validity of a JWT from any supported identity provider, checking items such as signature, issuer, audience and claims. For tokens issued by Microsoft Entra ID, the validate-azure-ad-token policy is the dedicated alternative.","ref":"https://learn.microsoft.com/azure/api-management/validate-jwt-policy"},{"id":"3.3.9-02","obj":"3.3.9","difficulty":"medium","type":"single","stem":"Contoso, Ltd. publishes an Azure Functions back end through Azure API Management. The function app requires a Microsoft Entra ID access token, and no secret, key or certificate may be stored in the API Management instance. The instance has a system-assigned managed identity that has been granted access to the function app.\n\nWhich policy should you add to the inbound section?","choices":["authentication-managed-identity with the resource of the function app","authentication-basic with a service account","authentication-certificate with a client certificate","validate-azure-ad-token with the audience of the function app"],"answer":[0],"rationale":["Correct: the policy requests a token for the function app resource by using the managed identity and adds it as a Bearer token to the back-end call, with no stored credential.","Incorrect: authentication-basic sends a stored user name and password to the back end, and the function app needs an Entra token. Use it for back ends that accept basic authentication.","Incorrect: authentication-certificate presents a client certificate that you must upload and manage, which the stem excludes. Use it for back ends that require mutual TLS.","Incorrect: validate-azure-ad-token checks tokens on incoming requests from callers. It does not obtain a token for the call to the back end. Use it to authorize API callers."],"explanation":"The authentication-managed-identity policy obtains a Microsoft Entra access token for a resource by using the managed identity of the API Management instance and sets it in the Authorization header of the back-end request. No credential is stored in the instance.","ref":"https://learn.microsoft.com/azure/api-management/authentication-managed-identity-policy"},{"id":"3.3.9-03","obj":"3.3.9","difficulty":"hard","type":"dropdown","stem":"Woodgrove Bank publishes an API through Azure API Management in the Standard tier. Callers are authenticated employees whose requests all leave through one corporate NAT address. You must limit each user to 10 calls per minute, and the user is identified by the subject claim of the JWT in the Authorization header.\n\nHow should you complete the policy? To answer, select the appropriate options in the answer area.\n\n```\n<inbound>\n    <base />\n    <[[1]] calls=\"10\" renewal-period=\"[[2]]\"\n        counter-key=\"@([[3]])\" />\n<\/inbound>\n```","targets":[{"label":"Box 1","options":["rate-limit-by-key","rate-limit","quota-by-key"],"why":["Correct: rate-limit-by-key limits the call rate for a key that you define with the counter-key expression.","Incorrect: rate-limit limits calls per subscription and has no counter-key attribute, so it cannot count per JWT subject. Use it for simple per-subscription throttling.","Incorrect: quota-by-key enforces call volume or bandwidth quotas over renewal periods, typically long ones. Use it for monthly volume quotas rather than a per-minute call rate."]},{"label":"Box 2","options":["60","1","600"],"why":["Correct: the renewal period is in seconds, so 10 calls with a period of 60 means 10 calls per minute.","Incorrect: a period of 1 second would allow 10 calls per second, which is far above the limit. The value is not in minutes.","Incorrect: a period of 600 seconds would allow 10 calls per 10 minutes, which is stricter than required."]},{"label":"Box 3","options":["context.Request.Headers.GetValueOrDefault(\"Authorization\",\"\").AsJwt()?.Subject","context.Request.IpAddress","context.Subscription.Id"],"why":["Correct: this expression reads the Authorization header, parses the JWT and uses its subject as the key, so each user gets an own counter.","Incorrect: the caller IP address is the same for all employees behind the corporate NAT, so they would share one counter. Use it for anonymous APIs.","Incorrect: the subscription ID identifies the API Management subscription, which many users share. Use it to limit calls per subscription, not per user."]}],"answer":[0,0,0],"explanation":"rate-limit-by-key throttles by a key that you compute with a policy expression, so you can count calls per JWT subject instead of per address. The renewal period is expressed in seconds, so 60 gives a per-minute limit. The policy is not available in the Consumption tier.","ref":"https://learn.microsoft.com/azure/api-management/api-management-sample-flexible-throttling"},{"id":"3.3.9-04","obj":"3.3.9","difficulty":"hard","type":"dragdrop","stem":"Litware, Inc. protects the back end of an API in Azure API Management by using gateway policies.\n\nWhich policy should you use for each requirement? To answer, drag the appropriate policies to the correct requirements. Each policy may be used once, more than once, or not at all.","choices":["validate-content","validate-parameters","validate-status-code","ip-filter","validate-jwt","rate-limit-by-key"],"targets":["API1: requests whose JSON body does not match the schema of the operation must be rejected","API2: requests whose query, path or header parameters do not match the operation schema must be rejected","API3: back-end responses that use a status code that the operation does not define must be rejected","API4: calls must be accepted from the address range of a partner network and rejected from other addresses"],"answer":[0,1,2,3],"rationale":["validate-content checks the request body against the schema, so malformed JSON is rejected before it reaches the back end.","validate-parameters checks header, query and path parameters against the schema of the operation.","validate-status-code checks the status code of back-end responses against the codes that the operation defines.","ip-filter allows or denies calls from specific IP addresses or ranges at the API or operation level."],"notes":["Validates the body of requests or responses against a schema. Use it to stop malformed or oversized payloads at the gateway.","Validates header, query and path parameters of requests against the API definition. Use it when the parameters, not the body, must be checked.","Checks the status code of back-end responses against the definition. Use it to stop unexpected responses from reaching the client.","Filters callers by IP address or range. Use it to limit calls to known networks, not to validate content.","Validates a bearer token on the request. Use it to require authentication, not to check schemas or addresses.","Throttles calls per key that you compute. Use it to limit call rates, not to validate content or filter addresses."],"explanation":"API Management policies protect back ends at the gateway: content and parameter validation check requests, status code validation checks responses, and ip-filter limits callers by address. Identify whether the requirement concerns the body, the parameters, the response or the caller address.","ref":"https://learn.microsoft.com/azure/api-management/secure-api-management"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. uses Microsoft Defender for Cloud with the Defender CSPM plan. The security team wants a view that shows how an attacker could move from an internet-exposed virtual machine, through an attached identity, to a database that holds sensitive data, and that suggests the recommendations that break that chain.\n\nWhich Defender for Cloud capability should the team use?","choices":["Secure score","Asset inventory","Attack path analysis","Workflow automation"],"answer":[2],"explanation":"Attack path analysis uses the cloud security graph to find exploitable routes from an external entry point to critical assets and lists the recommendations that break each route. It is a Defender CSPM capability.","rationale":["Incorrect: secure score is a single percentage that summarizes how many recommendations are remediated. It does not show attacker routes between resources. Use it to track posture progress over time.","Incorrect: asset inventory lists resources and their security state with filters, but it does not compute lateral movement chains. Use it when you need a searchable list of assets, software or secrets findings.","Correct: attack path analysis builds multistep chains (entry point, lateral movement, critical target) from the cloud security graph and links the recommendations that remove the path, which is exactly the view requested.","Incorrect: workflow automation runs Logic Apps in response to alerts or recommendations. It reacts to findings but does not discover attack chains. Use it to notify teams or open tickets automatically."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-attack-path"},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has enabled the Defender CSPM plan on a subscription and an AWS connector. A security analyst must build an ad hoc query that finds virtual machines that are exposed to the internet and have a high-severity vulnerability, and must save the query for reuse.\n\nWhich capability should the analyst use?","choices":["Cloud security explorer","Regulatory compliance dashboard","Attack path analysis","Recommendations page"],"answer":[0],"explanation":"Cloud security explorer runs graph-based queries on the cloud security graph. You build the query yourself from insights such as internet exposure and vulnerabilities, and you can save it. Attack path analysis reports predefined chains instead.","rationale":["Correct: cloud security explorer is the query builder for the cloud security graph, so the analyst can combine internet exposure and vulnerability insights across Azure and AWS and save the query.","Incorrect: the regulatory compliance dashboard reports pass or fail status per control of a standard. It cannot join exposure and vulnerability context into a custom query. Use it for audit and compliance reporting.","Incorrect: attack path analysis displays chains that Defender for Cloud calculates for you. You cannot author your own query there. Use it to see which exploitable chains deserve remediation first.","Incorrect: the Recommendations page lists recommendations with filters, but it does not query relationships such as exposure combined with a vulnerability on the same VM. Use it to work through remediation items."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-attack-path#what-is-cloud-security-explorer"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Litware, Inc. runs workloads in Azure and AWS and uses only Foundational CSPM. The security team must add attack path analysis and cloud security explorer across both clouds. The team does not need workload threat protection for servers, storage or containers.\n\nWhich Defender for Cloud plan should you enable?","choices":["Defender for Servers Plan 1","Defender for Containers","Defender for Storage","Defender CSPM"],"answer":[3],"explanation":"Attack path analysis and cloud security explorer are capabilities of the paid Defender CSPM plan. Foundational CSPM is free and does not include them. The workload protection plans protect specific resource types and do not add the security graph features.","rationale":["Incorrect: Defender for Servers Plan 1 adds Defender for Endpoint features for machines. It is a workload protection plan and does not provide attack path analysis. Use it when you need endpoint protection on servers.","Incorrect: Defender for Containers protects Kubernetes clusters and images with runtime detection and image assessment. The stem excludes workload protection, and the plan does not unlock the graph features.","Incorrect: Defender for Storage detects threats and scans for malware in storage accounts. It does not add attack path analysis. Use it when storage accounts need malware scanning or activity monitoring.","Correct: Defender CSPM is the plan that provides the cloud security graph, attack path analysis and cloud security explorer for Azure and AWS, and it needs no workload protection plan."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-cloud-security-posture-management"},{"id":"4.1.1-04","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. enabled the Defender CSPM plan on a subscription. The user who enabled it has the Contributor role on the subscription. Several days later, attack path analysis shows no paths that involve vulnerable virtual machines, although many VMs have known vulnerabilities.\n\nWhat should you do to fix the problem?","choices":["Assign the Security Reader role to the security analysts on the subscription","Have a subscription Owner turn on agentless scanning in the Defender CSPM plan settings","Enable the Defender for Resource Manager plan on the subscription","Redeploy the Azure Policy add-on to the virtual machines on the subscription"],"answer":[1],"explanation":"Agentless scanning needs permissions that only a subscription Owner has. When a lower-privileged user enables Defender CSPM, the agentless scanner stays off, so attack paths and the explorer have no vulnerability data. An Owner must enable the setting.","rationale":["Incorrect: Security Reader lets analysts view findings but does not enable the scanner that produces the data. Use it to give read-only access to posture and alerts.","Correct: agentless scanning for machines supplies the vulnerability data to the graph, and only a subscription Owner can enable it in the plan settings, so an Owner must turn it on.","Incorrect: Defender for Resource Manager monitors control-plane operations in Azure Resource Manager. It does not scan VM disks for vulnerabilities. Use it to detect suspicious management operations.","Incorrect: the Azure Policy add-on is for Kubernetes posture assessment on clusters, not for VM vulnerability data. Use it to deploy Kubernetes policy checks to clusters."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/tutorial-enable-cspm-plan"},{"id":"4.1.1-05","obj":"4.1.1","difficulty":"hard","type":"multi","stem":"Woodgrove Bank has the Defender CSPM plan enabled on an Azure subscription. The security team must find storage accounts that contain sensitive data and are reachable from internet-exposed virtual machines, and the team must be able to review the results as query output.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Enable sensitive data discovery in the Defender CSPM plan settings","Run a cloud security explorer query that combines internet-exposed VMs with data resources that hold sensitive data","Enable on-upload malware scanning in Defender for Storage","Create a custom recommendation that uses a KQL query on storage accounts","Enable Foundational CSPM on the subscription"],"answer":[0,1],"explanation":"Sensitive data discovery in Defender CSPM finds data resources that hold sensitive data and adds that context to the cloud security graph. Cloud security explorer then lets you query that graph for exposed compute with access to those data stores.","rationale":["Correct: sensitive data discovery is the Defender CSPM component that identifies resources with sensitive data by using Microsoft Purview sensitive information types, so the graph knows which stores are sensitive.","Correct: cloud security explorer queries the graph for relationships such as internet-exposed VMs that have access to sensitive data stores, and it returns the matching resources as results.","Incorrect: on-upload malware scanning looks for malicious files in uploaded blobs. It does not classify data sensitivity. Use it when untrusted content is uploaded to storage accounts.","Incorrect: a KQL custom recommendation can flag a configuration such as public network access, but it does not discover sensitive data or evaluate exposure from VMs. Use it to enforce your own configuration checks.","Incorrect: Foundational CSPM is the free tier. It does not include sensitive data discovery or cloud security explorer, and the subscription already has the paid Defender CSPM plan."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-data-security-posture"},{"id":"4.1.1-06","obj":"4.1.1","difficulty":"hard","type":"dragdrop","stem":"Relecloud uses Defender CSPM on Azure and AWS. You must match each requirement with the Defender for Cloud capability that meets it.\n\nWhich capability should you use for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once, more than once, or not at all.","choices":["Attack path analysis","Cloud security explorer","Agentless scanning for machines","Sensitive data discovery","Secure score"],"targets":["Requirement 1: automatically list exploitable routes from internet entry points to critical assets, ranked by risk","Requirement 2: build your own graph queries about assets and the relationships between them","Requirement 3: collect software inventory and vulnerability findings from VMs without installing agents"],"answer":[0,1,2],"rationale":["Attack path analysis calculates the chains for you and ranks them by risk, so no query authoring is needed.","Cloud security explorer is the query builder over the cloud security graph, which fits custom questions about relationships.","Agentless scanning for machines snapshots disks to find software and vulnerabilities, so no agent is deployed on the VMs."],"notes":["Finds exploitable routes from external entry points to critical targets and recommends fixes. Use it to prioritize remediation by real exposure.","Lets you run graph-based queries over assets, exposure, permissions and vulnerabilities. Use it to hunt for specific risk patterns and save queries.","Reads machine disk snapshots for software inventory, vulnerabilities and secrets with no agent. Use it for broad coverage without touching workloads.","Discovers data resources that hold sensitive data by using Purview classifications. Use it when data sensitivity must influence risk, not for software findings.","One percentage that summarizes remediated recommendations. Use it to track posture trend, not to find routes or run queries."],"explanation":"The cloud security graph feeds three Defender CSPM experiences: attack paths (calculated for you), the explorer (queries you author) and agentless scanning (data collection that supplies vulnerabilities and inventory to the graph).","ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-attack-path"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Adatum Corporation enables Microsoft Defender for Cloud on a new Azure subscription and makes no other configuration changes. An auditor opens the Regulatory compliance dashboard.\n\nWhich standard should the auditor expect to see assessed by default?","choices":["Payment Card Industry Data Security Standard","Microsoft cloud security benchmark","ISO/IEC 27001 certification standard","NIST SP 800-53 security controls"],"answer":[1],"explanation":"The Microsoft cloud security benchmark (MCSB) is assigned automatically when Defender for Cloud is enabled. Industry and regulatory standards such as PCI DSS, ISO 27001 and NIST SP 800-53 must be added explicitly.","rationale":["Incorrect: PCI DSS is a built-in regulatory standard, but you must add it to the dashboard yourself. Add it when the workload handles payment card data.","Correct: MCSB is the default initiative that Defender for Cloud assigns to every registered subscription, so it is the only standard assessed without further action.","Incorrect: ISO 27001 is available in the standards list but is not assigned by default. Add it when the organization must report against that certification.","Incorrect: NIST SP 800-53 is a selectable regulatory standard and is not assigned automatically. Add it when a US federal or contractual requirement applies."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-regulatory-compliance-standards"},{"id":"4.1.2-02","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Northwind Traders onboards an AWS account to Defender for Cloud by using the native connector and enables Defender CSPM. The compliance officer wants to know which AWS-specific standard is assigned in addition to the Microsoft cloud security benchmark.\n\nWhich standard should the compliance officer expect to find?","choices":["GCP Default","CIS Microsoft Azure Foundations Benchmark","AWS Foundational Security Best Practices","NIST SP 800-172"],"answer":[2],"explanation":"Every onboarded AWS account gets the Microsoft cloud security benchmark and the AWS Foundational Security Best Practices standard by default. GCP Default is the GCP counterpart, and the CIS Azure benchmark applies to Azure only.","rationale":["Incorrect: GCP Default is the default standard for GCP projects, not for AWS accounts. It applies when you onboard a GCP project or organization.","Incorrect: the CIS Microsoft Azure Foundations Benchmark is available for Azure scopes only. Use it for Azure subscriptions that must follow CIS guidance.","Correct: AWS Foundational Security Best Practices is the AWS-specific standard that is assigned automatically to each onboarded AWS account, next to MCSB.","Incorrect: NIST SP 800-172 can be added to AWS accounts, but it is optional and is not assigned at onboarding. Add it when you need to report against that publication."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/faq-regulatory-compliance"},{"id":"4.1.2-03","obj":"4.1.2","difficulty":"medium","type":"dropdown","stem":"Fabrikam, Inc. has the Defender CSPM plan enabled and must create a custom recommendation that marks Azure storage accounts that allow HTTP traffic as non-compliant.\n\nHow should you complete the KQL query? To answer, select the appropriate options in the answer area.\n\n```kql\nRawEntityMetadata\n| where Environment == [[1]] and Identifiers.Type =~ 'Microsoft.Storage/storageAccounts'\n| extend condition = (Record.properties.supportsHttpsTrafficOnly != true)\n| extend HealthStatus = iff(condition, [[2]], [[3]])\n| project Id, Name, Environment, Identifiers, AdditionalData, Record, HealthStatus\n```","choices":[],"targets":[{"label":"Box 1","options":["'Azure'","'AWS'","'GCP'"],"why":["Correct: Microsoft.Storage/storageAccounts is an Azure resource type, so the query must filter on the Azure environment.","Incorrect: 'AWS' selects resources from connected AWS accounts, which do not have Azure storage account types. Use it for AWS resource types such as S3 buckets.","Incorrect: 'GCP' selects resources from connected GCP projects. Azure storage accounts are not in that scope, so the query would return nothing."]},{"label":"Box 2","options":["'UNHEALTHY'","'HEALTHY'"],"why":["Correct: when the condition is true the account allows HTTP, so HealthStatus must be UNHEALTHY to appear as a non-compliant finding.","Incorrect: HEALTHY marks a resource as compliant. Using it for the true branch would hide the accounts that allow HTTP."]},{"label":"Box 3","options":["'HEALTHY'","'UNHEALTHY'"],"why":["Correct: accounts that require HTTPS meet the standard, so the false branch returns HEALTHY and they stay compliant.","Incorrect: UNHEALTHY in the false branch would flag every account, including the compliant ones, and make the recommendation useless."]}],"answer":[0,0,0],"explanation":"A KQL custom recommendation must return all in-scope resources with a HealthStatus of UNHEALTHY or HEALTHY. The condition expresses the failing state, and the Environment filter selects Azure, AWS or GCP resources.","rationale":[],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/create-custom-recommendations"},{"id":"4.1.2-04","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. must write recommendations in KQL that check storage buckets in connected AWS accounts and assign them to a custom security standard. The subscription has Foundational CSPM and Defender for Containers enabled.\n\nWhich plan should you enable to create the KQL-based custom recommendations?","choices":["Defender for Servers Plan 2","Defender CSPM","Defender for Storage","Defender for Resource Manager"],"answer":[1],"explanation":"KQL-based custom recommendations require the Defender CSPM plan. Recommendations that are based on Azure Policy are available to all customers, but the KQL query editor for multicloud resources needs the paid CSPM plan.","rationale":["Incorrect: Defender for Servers Plan 2 protects machines with vulnerability management and endpoint features. It does not unlock the KQL custom recommendation editor.","Correct: Defender CSPM enables KQL-based custom recommendations for Azure, AWS and GCP resources, which matches the AWS bucket requirement.","Incorrect: Defender for Storage detects threats and malware in Azure storage accounts. It does not cover AWS buckets and does not enable custom recommendations.","Incorrect: Defender for Resource Manager monitors Azure Resource Manager operations for suspicious activity. It does not provide custom recommendation authoring."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/create-custom-recommendations"},{"id":"4.1.2-05","obj":"4.1.2","difficulty":"hard","type":"yesno","stem":"Woodgrove Bank has assigned several standards to an Azure subscription and reviews the Regulatory compliance dashboard before an audit.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["A control that is grayed out has no Defender for Cloud assessments associated with it.","A standard that is assigned to a subscription without relevant resources still appears on the dashboard with a score of 0 percent.","Compliance data for standards that you add to the dashboard is surfaced automatically in Microsoft Purview Compliance Manager."],"answer":[0,2],"explanation":"Grayed-out controls cannot be assessed automatically, for example process-related controls. A standard with no relevant resources is hidden from the dashboard. Defender for Cloud compliance data integrates with Purview Compliance Manager for standards you add.","rationale":["Yes: controls without associated assessments are grayed out because Defender for Cloud cannot verify them. Some are procedural, some are the platform responsibility, and some have no policy yet.","No: when a subscription has no resources that are relevant to a standard, the standard is not shown on the dashboard at all, even though it is assigned. It does not show 0 percent.","Yes: when you add a standard, including those for AWS and GCP, the resource-level compliance data is surfaced in Compliance Manager for the same standard, so you can manage compliance centrally."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/regulatory-compliance-dashboard"},{"id":"4.1.2-06","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys must show auditors that a procedural control in an assigned standard is met, for example a quarterly access review that Defender for Cloud cannot test. The proof must be recorded against that control in the Defender for Cloud Regulatory compliance dashboard.\n\nWhat should you do?","choices":["Create a KQL custom recommendation that returns HEALTHY for the control","Create an Azure Policy exemption for the control on the subscription","Attest the manual assessment and link the evidence in Your Actions","Download the audit report for the standard and send it to the auditors"],"answer":[2],"explanation":"Controls that have manual assessments can be attested in the dashboard, and evidence can be linked to demonstrate compliance. KQL custom recommendations evaluate resource configuration, and exemptions remove scope instead of documenting compliance.","rationale":["Incorrect: a KQL recommendation inspects resource properties, so it cannot evaluate a quarterly review process, and forcing HEALTHY would be misleading. Use KQL for configuration checks on resources.","Incorrect: an exemption excludes a resource from an assessment, which removes the item instead of proving that it is met. Use it when a recommendation does not apply to a resource.","Correct: manual assessments under Your Actions can be manually attested with linked evidence, which records the proof against the control in the dashboard.","Incorrect: the audit report is an export of the current state. It does not record new attestation or evidence. Download it after the attestation to give auditors a summary."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/regulatory-compliance-dashboard"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Adatum Corporation administrator opens Environment settings for an Azure subscription and turns the Servers plan switch to On. The administrator does not select Change plans.\n\nWhich Defender for Servers plan should you expect to be enabled?","choices":["Defender for Servers Plan 1","Defender CSPM","Defender for Endpoint standalone licensing","Defender for Servers Plan 2"],"answer":[3],"explanation":"Toggling Servers to On enables Defender for Servers Plan 2 by default. To use Plan 1 you must select Change plans and confirm Plan 1 before saving.","rationale":["Incorrect: Plan 1 is available only when you choose Change plans. Select it when you need endpoint protection and vulnerability scanning with the Defender for Endpoint sensor at lower cost.","Incorrect: Defender CSPM is a separate posture plan with its own toggle. Turning on Servers does not enable it. Enable it for attack path analysis and cloud security explorer.","Incorrect: Defender for Endpoint licensing is not a Defender for Cloud plan toggle. The Servers plan integrates the Defender for Endpoint agent but is enabled through its own plan switch.","Correct: the default result of the Servers toggle is Plan 2, which includes the broader feature set such as agentless scanning and file integrity monitoring."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/tutorial-enable-servers-plan"},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Tailspin Toys enables the Defender for Storage plan on a subscription and keeps the on-upload malware scanning setting at its default. The finance team asks for the maximum amount of uploaded data that is scanned each month per storage account before scanning stops.\n\nWhat monthly cap should you plan for?","choices":["1,000 GB","10,000 GB","5,000 GB","100,000 GB"],"answer":[1],"explanation":"The default monthly cap for on-upload malware scanning is 10,000 GB per storage account. After the threshold is exceeded, scanning stops for the remaining blobs. You can change the cap or set it to -1 for unlimited scanning.","rationale":["Incorrect: 1,000 GB is not the default. You can set a lower cap per storage account when a small data volume is expected and you want to limit cost.","Correct: Defender for Storage uses 10,000 GB of uploaded blobs per month per storage account as the default cap, which keeps malware scanning cost predictable.","Incorrect: 5,000 GB is not the documented default. Set it explicitly if you want to cap scanning at half of the default value.","Incorrect: 100,000 GB is not the default. A higher or unlimited cap (-1) must be configured by you when very large upload volumes must be scanned."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/tutorial-enable-storage-plan"},{"id":"4.1.3-03","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Litware, Inc. has an Azure subscription where the Defender for Servers plan is turned off. The security team must enable Defender for Servers Plan 1 for the machines that carry the tag SecurityTier=High and must not enable the plan for the other machines.\n\nWhat should you do?","choices":["Assign the built-in tag-based Azure Policy for the P1 subplan and create a remediation task","Turn on the Servers plan for the subscription and select Plan 1 in Environment settings","Enable Defender for Servers Plan 2 on each tagged machine in its resource settings","Enable the Defender for Endpoint integration setting for the subscription in plan settings"],"answer":[0],"explanation":"Plan 1 can be enabled at the resource level, for example by script or by the granular pricing Azure Policy that targets a tag. Turning the plan on for the subscription would cover every machine, and Plan 2 cannot be enabled at the resource level.","rationale":["Correct: the built-in granular pricing policy enables Plan 1 for tagged Azure VMs, scale sets and Arc servers, and a remediation task applies it to existing machines without enabling the plan for the whole subscription.","Incorrect: enabling the plan at the subscription level covers every machine in the subscription, which violates the requirement. Use it when all machines need protection.","Incorrect: Plan 2 cannot be enabled at the resource level, only disabled there, and the requirement asks for Plan 1. Plan 2 is selected for a whole subscription.","Incorrect: the Defender for Endpoint integration setting applies to a plan that is already enabled. It does not enable Defender for Servers on selected machines."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/plan-defender-for-servers-select-plan"},{"id":"4.1.3-04","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Relecloud has 30 Azure subscriptions in one management group and creates new storage accounts every week. The security team must ensure that Defender for Storage protects all existing and future storage accounts in the management group with the same configuration.\n\nWhat should you do?","choices":["Enable Defender for Storage on each storage account in the Azure portal","Turn on the Defender for Storage plan in Environment settings of one subscription","Assign the built-in Azure Policy for Defender for Storage at the management group scope","Deploy a Bicep template for Defender for Storage once to the hub subscription"],"answer":[2],"explanation":"Azure Policy at the management group scope keeps the plan and its settings consistent for existing and future resources and subscriptions in scope. Per-account portal changes and one-time deployments to one subscription do not cover new resources elsewhere.","rationale":["Incorrect: enabling the plan account by account does not cover storage accounts created later and does not scale to 30 subscriptions. Use it for a one-off exception.","Incorrect: Environment settings of one subscription covers only that subscription. The other 29 subscriptions stay unprotected. Use it when a single subscription is in scope.","Correct: a policy assignment at the management group scope enforces Defender for Storage on all current and new storage accounts in every subscription below it, which is the recommended method at scale.","Incorrect: a template deployed once to one subscription configures that subscription only and does not apply to new accounts or other subscriptions. Use IaC when you manage each subscription in a pipeline."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/tutorial-enable-storage-plan#deployment-methods"},{"id":"4.1.3-05","obj":"4.1.3","difficulty":"hard","type":"dropdown","stem":"Woodgrove Bank must enable Defender for Servers Plan 2 on the current Azure subscription by using the Azure CLI. The security team requires agentless malware scanning of the virtual machines.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```azurecli\naz security pricing create --name [[1]] --tier [[2]] --subplan [[3]]\n```","choices":[],"targets":[{"label":"Box 1","options":["VirtualMachines","StorageAccounts","CloudPosture","Containers"],"why":["Correct: VirtualMachines is the pricing name of the Defender for Servers plan.","Incorrect: StorageAccounts is the pricing name of Defender for Storage. Use it when you configure storage account protection.","Incorrect: CloudPosture is the pricing name of Defender CSPM. Use it for attack path analysis and the cloud security explorer.","Incorrect: Containers is the pricing name of Defender for Containers. Use it for Kubernetes clusters and images."]},{"label":"Box 2","options":["Standard","Free"],"why":["Correct: the Standard tier turns the paid plan on for the scope.","Incorrect: the Free tier turns the plan off, so no Plan 2 features would apply."]},{"label":"Box 3","options":["P2","P1","DefenderForStorageV2"],"why":["Correct: P2 selects Defender for Servers Plan 2, which includes agentless malware scanning.","Incorrect: P1 selects Plan 1, which does not include agentless malware scanning. Use it for endpoint protection at lower cost.","Incorrect: DefenderForStorageV2 is a sub plan of the StorageAccounts plan. It is not valid for the VirtualMachines plan."]}],"answer":[0,0,0],"explanation":"az security pricing create sets the plan by name, the tier (Standard turns the plan on) and the sub plan. VirtualMachines with P2 is Defender for Servers Plan 2, while StorageAccounts uses DefenderForStorageV2.","rationale":[],"ref":"https://learn.microsoft.com/cli/azure/security/pricing?view=azure-cli-latest"},{"id":"4.1.3-06","obj":"4.1.3","difficulty":"hard","type":"dragdrop","stem":"Fabrikam, Inc. enables the Defender for Containers plan on an Azure subscription that contains AKS clusters and an Azure container registry. You must select the plan component for each requirement.\n\nWhich component should you enable for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once, more than once, or not at all.","choices":["Defender sensor","Registry access","Azure Policy","Kubernetes API access","Agentless scanning for machines"],"targets":["Requirement 1: collect runtime security telemetry from cluster nodes for threat detection","Requirement 2: assess vulnerabilities in container images stored in connected registries without agents","Requirement 3: deploy the Kubernetes add-on that supports security posture assessments and recommendations"],"answer":[0,1,2],"rationale":["The Defender sensor runs on the nodes and sends runtime telemetry that detections use.","Registry access enables agentless vulnerability assessment of images in connected registries.","The Azure Policy component installs the Azure Policy for Kubernetes add-on that checks cluster configuration."],"notes":["Deploys a sensor to cluster nodes for runtime telemetry. Use it for threat detection on running workloads.","Lets Defender for Cloud pull images from connected registries for agentless vulnerability assessment. Use it for image scanning.","Deploys the Azure Policy for Kubernetes add-on for posture assessments. Use it for hardening recommendations on clusters.","Lets Defender for Cloud call the Kubernetes API for inventory and configuration analysis. Use it for cluster metadata, not for telemetry or image scans.","Scans the Kubernetes node VMs for vulnerabilities and secrets without agents. Use it for node-level findings, not images or telemetry."],"explanation":"Defender for Containers is a bundle of components. The sensor provides runtime detection, registry access provides image vulnerability assessment, and the Azure Policy component provides posture checks.","ref":"https://learn.microsoft.com/azure/defender-for-cloud/defender-for-containers-enable-plan"},{"id":"4.1.4-01","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Northwind Traders has 20 Windows servers in an on-premises datacenter. The servers must be monitored by Microsoft Defender for Cloud, and the company has no AWS or GCP resources.\n\nWhich Azure service should you use to connect the servers?","choices":["Azure Lighthouse delegation","Azure Arc-enabled servers","Azure Migrate discovery appliance","Azure Site Recovery replication"],"answer":[1],"explanation":"Non-Azure machines are connected to Defender for Cloud by onboarding them with Azure Arc, which is the recommended method. The multicloud connectors for AWS and GCP deploy Arc for you, but on-premises servers need Arc directly.","rationale":["Incorrect: Azure Lighthouse delegates management of customer tenants. It does not connect machines. Use it when a service provider manages resources in other tenants.","Correct: Azure Arc-enabled servers projects the on-premises machines into Azure so Defender for Cloud can assess and protect them as it does Azure VMs.","Incorrect: Azure Migrate assesses and moves servers to Azure. It does not onboard machines for protection in place. Use it for datacenter migration projects.","Incorrect: Azure Site Recovery replicates machines for disaster recovery. It does not connect them to Defender for Cloud. Use it for failover planning."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/quickstart-onboard-machines"},{"id":"4.1.4-02","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. uses AWS Organizations with one management account and 40 member accounts. All accounts must be monitored by Defender for Cloud, and new member accounts must be onboarded automatically with the least administrative effort.\n\nWhich connector configuration should you create?","choices":["One AWS connector that uses the Management account option","40 connectors that use the Single account option","One connector for a delegated administrator account","One GCP organization connector"],"answer":[0],"explanation":"A connector for the AWS management account creates connectors for discovered member accounts and for newly created accounts. Delegated administrator accounts are not supported for management account onboarding.","rationale":["Correct: the Management account option auto-provisions connectors for existing and new member accounts, so only one connector is configured manually.","Incorrect: 40 single-account connectors work but need manual work for every account, and new accounts need new connectors. Use single account connectors for a standalone account.","Incorrect: management account onboarding supports only the AWS management account. Delegated administrator accounts are not supported for this purpose.","Incorrect: a GCP organization connector monitors Google Cloud, not AWS. Use it when the resources run in a GCP organization."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/quickstart-onboard-aws"},{"id":"4.1.4-03","obj":"4.1.4","difficulty":"medium","type":"single","stem":"Litware, Inc. must connect a GCP project to Defender for Cloud. The security policy forbids storing long-lived credentials or service account keys for the integration.\n\nWhich mechanism should you use?","choices":["A service account key file that is stored in Azure Key Vault","A Microsoft Entra application registration with a client secret","Workload identity federation that the generated gcloud script configures","A GCP user account with a password for Defender for Cloud"],"answer":[2],"explanation":"The GCP connector uses federated authentication. The generated script creates a workload identity pool, a workload identity provider, service accounts and project-level policy bindings, so no long-lived credentials are stored.","rationale":["Incorrect: a service account key file is a long-lived credential, even when it is stored in Key Vault, so it violates the policy. Keys are used by integrations that do not support federation.","Incorrect: a client secret is also a long-lived credential, and it would authenticate to Azure, not to GCP. Secrets are used by apps that call Entra-protected APIs.","Correct: workload identity federation with service account impersonation lets Defender for Cloud access GCP APIs without storing long-lived credentials.","Incorrect: a shared user account with a password is a long-lived credential and an interactive identity. It is not how the connector authenticates."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/quickstart-onboard-gcp"},{"id":"4.1.4-04","obj":"4.1.4","difficulty":"medium","type":"single","stem":"Relecloud connects an AWS account and enables Defender for Servers on it. The security engineer finds that the EC2 instances are not onboarded through Azure Arc by autoprovisioning. The instances do not have the AWS SSM Agent.\n\nWhat should you do first?","choices":["Install the Log Analytics agent on the instances and connect it to a workspace","Install the Azure Monitor agent on the instances and create a data collection rule","Join the EC2 instances to Microsoft Entra Domain Services and enable Kerberos","Install the AWS SSM Agent and attach the AmazonSSMManagedInstanceCore policy"],"answer":[3],"explanation":"Defender for Servers on AWS uses Azure Arc autoprovisioning, and autoprovisioning needs the AWS SSM Agent with the AmazonSSMManagedInstanceCore policy on the instances. Without it, Arc onboarding cannot proceed.","rationale":["Incorrect: the Log Analytics agent was retired in August 2024, and Defender for Servers features now use Defender for Endpoint integration or agentless scanning.","Incorrect: Azure Monitor agent is not what blocks onboarding, and it cannot be pushed to non-Azure EC2 instances until they are Arc-enabled. It is used for data collection after onboarding.","Incorrect: domain join has no role in Arc onboarding. Arc agent installation depends on SSM for automated deployment, not on a directory.","Correct: the SSM Agent with the managed instance policy is a prerequisite for Arc autoprovisioning on EC2, so installing it lets the connector onboard the instances."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/quickstart-onboard-aws#native-connector-plan-requirements"},{"id":"4.1.4-05","obj":"4.1.4","difficulty":"hard","type":"order","stem":"Woodgrove Bank must connect a single AWS account to Microsoft Defender for Cloud by using the portal and the CloudFormation deployment method. The connector must enable the Defender CSPM plan.\n\nWhich five actions should you perform in sequence? To answer, move the appropriate
