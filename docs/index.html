rrect: The collector receives the forwarded events, so the agent on WEC1 reads them and sends them to the workspace through the Windows Forwarded Events connector.","Incorrect: A Linux log forwarder receives syslog and CEF. It does not receive Windows Event Forwarding subscriptions.","Incorrect: Domain controllers do not hold the forwarded workstation events unless they are the collector. Installing there collects only their own security log."]},{"id":"4.2.6-04","obj":"4.2.6","difficulty":"hard","type":"single","stem":"Contoso, Ltd. uses Windows Event Forwarding and the Windows Forwarded Events connector for its member servers. Built-in Microsoft Sentinel analytics rules for Windows security events do not trigger on the forwarded events. The security team must keep Windows Event Forwarding.\n\nWhat should you do?","explanation":"Events collected through Windows Event Forwarding are written to the WindowsEvent table, not SecurityEvent, and many built-in rules query SecurityEvent. Adapt the rules to WindowsEvent or ASIM parsers, or use the Security Events via AMA connector.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-windows-based","choices":["Adapt the rule queries to use the WindowsEvent table or supported ASIM parsers","Move the WindowsEvent table to the Basic table plan","Switch the connector to Security Events via the legacy agent","Select the Common event set on the Windows Forwarded Events connector"],"answer":[0],"rationale":["Correct: The forwarded events are stored in WindowsEvent, so the rules must query that table or use ASIM parsers that normalize it. This keeps Windows Event Forwarding in place.","Incorrect: WindowsEvent does not support the Basic plan, and Basic tables lack analytics rule support anyway. A cheaper plan would not make the rules match.","Incorrect: The legacy agent connector collects local security events from machines, not events forwarded to a collector, and it is being replaced by AMA. It would not fix the table mismatch.","Incorrect: Event sets such as Common apply to the Windows Security Events connector. They do not exist on the Forwarded Events connector and would not change the target table."]},{"id":"4.2.6-05","obj":"4.2.6","difficulty":"hard","type":"dropdown","stem":"Tailspin Toys must collect only successful logons and failed logons from the Windows Security log into the SecurityEvent table by using a custom XPath query in a data collection rule. The engineer then tests the XPath expression on a server.\n\nHow should you complete the XPath query and the test command? To answer, select the appropriate options in the answer area.\n\n```\nSecurity!*[System[(EventID=[[1]]) or (EventID=[[2]])]]\n\nGet-WinEvent -LogName 'Security' -[[3]] $XPath\n```","explanation":"DCR XPath filters use the Event ID values of the events you want, such as 4624 and 4625, and you can validate an XPath string with Get-WinEvent -FilterXPath before deploying the rule.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-windows-based","targets":[{"label":"Box 1","options":["4624","4634","4688"],"why":["Correct: 4624 is the event ID for a successful logon, which the requirement asks for.","Incorrect: 4634 is a logoff (sign-out) event. It is useful for audit trails but is not a logon.","Incorrect: 4688 is a process creation event, which is unrelated to logons."]},{"label":"Box 2","options":["4625","4647","4720"],"why":["Correct: 4625 is the event ID for a failed logon, which the requirement asks for.","Incorrect: 4647 is a user-initiated logoff event, not a failed logon.","Incorrect: 4720 records the creation of a user account, which is an account management event."]},{"label":"Box 3","options":["FilterXPath","FilterXml","FilterHashtable"],"why":["Correct: FilterXPath accepts an XPath 1.0 query string, which is how you test a DCR XPath expression before using it.","Incorrect: FilterXml expects a structured query XML document, not a bare XPath string, so the expression would be rejected.","Incorrect: FilterHashtable takes a hashtable of keys such as ProviderName and Id, so it cannot consume an XPath string."]}],"answer":[0,0,0]},{"id":"4.2.6-06","obj":"4.2.6","difficulty":"medium","type":"multi","stem":"Relecloud has 300 Azure Arc-enabled Windows servers. The Windows Security Events solution is already installed in the Microsoft Sentinel workspace. The security events must flow into the SecurityEvent table.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","explanation":"Non-Azure servers need Azure Arc before an AMA-based connector. The connector's data collection rule then targets the servers and installs the Azure Monitor Agent, and events go to SecurityEvent.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-windows-based","choices":["Deploy a Windows Event Collector server and create subscriptions on the servers","Create a data collection rule from the Windows Security Events via AMA connector and select the servers","Install the Log Analytics (Microsoft Monitoring) agent on the servers","Enable the Windows Forwarded Events data connector","Confirm that the Azure Arc Connected Machine agent is installed and enabled on the servers"],"answer":[1,4],"rationale":["Incorrect: A collector server and subscriptions implement Windows Event Forwarding, which writes to WindowsEvent. It is a different design from the AMA connector.","Correct: The DCR created from the connector defines which events to collect and which servers it applies to. The Azure Monitor Agent is installed on the selected machines when it is created.","Incorrect: The Microsoft Monitoring Agent is the legacy collection method. Running it together with AMA for the same events causes duplicate ingestion.","Incorrect: The Windows Forwarded Events connector reads from a Windows Event Collector and writes to WindowsEvent. It does not collect security events directly from the servers into SecurityEvent.","Correct: Azure Arc must be installed and enabled before enabling the AMA-based connector on machines that are not Azure VMs, so the DCR and agent can be deployed to them."]},{"id":"4.2.7-01","obj":"4.2.7","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. must create a custom log table in the Log Analytics workspace of Microsoft Sentinel to store logs from an inventory application. The table is named App1.\n\nWhich table name should you use?","explanation":"Custom log tables end with the _CL suffix. Other suffixes mark different table types, such as _CF for custom fields, _SRCH for search job results, and _RST for restored data.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/create-custom-table","choices":["App1_CF","App1_SRCH","App1_CL","App1_RST"],"answer":[2],"rationale":["Incorrect: A _CF suffix marks a custom field that you add to an existing table, not a custom table. Use it when you extend the schema of a built-in table.","Incorrect: _SRCH is the suffix of a table that holds search job results. It is created by the search job, not by you for ingestion.","Correct: The _CL suffix identifies a custom log table. The portal adds it automatically when you create a DCR-based custom table.","Incorrect: _RST is the suffix of a table that holds restored data from long-term retention. It is a temporary view created by a restore operation."]},{"id":"4.2.7-02","obj":"4.2.7","difficulty":"easy","type":"single","stem":"Litware, Inc. has an in-house application that can send JSON events over HTTPS. The events must be stored in a custom table in the Microsoft Sentinel workspace, and the solution must use a supported, current ingestion method that can transform data before storage.\n\nWhat should you use?","explanation":"The Logs ingestion API accepts JSON over REST, uses a DCR to define the target table and an optional transformation, and can send data to custom tables you create.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/logs-ingestion-api-overview","choices":["The HTTP Data Collector API","The Syslog via AMA connector","The Logs ingestion API with a data collection rule","The Windows Security Events via AMA connector"],"answer":[2],"rationale":["Incorrect: The HTTP Data Collector API is deprecated and works with classic custom log tables, which cannot be used with DCRs or transformations.","Incorrect: Syslog via AMA collects syslog messages through an agent into the Syslog table. It does not accept JSON over HTTPS from an application.","Correct: The Logs ingestion API is the current method for custom-format data, and the DCR describes the stream, the transformation, and the destination table.","Incorrect: Windows Security Events via AMA collects Windows Security log events through an agent into SecurityEvent. It does not receive application JSON."]},{"id":"4.2.7-03","obj":"4.2.7","difficulty":"medium","type":"order","stem":"Contoso, Ltd. has an Azure Arc-enabled Linux server that writes application logs to text files under /var/log/app1/. The logs must be ingested into a custom table named App1_CL in a Microsoft Sentinel workspace by using the Custom Logs via AMA connector. The server hosts the application and no log forwarder is used.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","explanation":"The destination _CL table with TimeGenerated and RawData must exist first. The DCR then points at the table and the log files and installs the agent, and the last step is to verify that data arrives.","ref":"https://learn.microsoft.com/azure/sentinel/connect-custom-logs-ama","choices":["Run the forwarder installation script on the server to open port 514.","Query the App1_CL table in the workspace to verify that rows arrive.","Create the table by running `az monitor log-analytics workspace table create` with the columns TimeGenerated and RawData.","Create the table by using the New custom log (DCR based) wizard in the Azure portal.","Create a data collection rule from the Custom Logs via AMA connector with the file pattern and select the server.","Create a data collection endpoint in a different region from the workspace."],"answer":[2,4,1],"rationale":["Incorrect: The forwarder script configures a syslog daemon for appliances that send over the network. Here the application is on the server and the logs are files, so it does not apply.","Step 3: Verification comes last, after the table, DCR, and agent exist and the file has new content to collect.","Step 1: The table must exist before the DCR can send data to it. The CLI creates a table with TimeGenerated and RawData, which the connector requires for text logs.","Incorrect: The DCR-based custom log wizard is meant for Logs ingestion API data. It cannot create a table for agent text logs, so use the CLI or a template instead.","Step 2: The DCR carries the file pattern, the transformation, and the destination table, and creating it installs the Azure Monitor Agent on the selected server.","Incorrect: A data collection endpoint is not required for AMA text collection, and it must be in the same region as the workspace if used. A different region would break the scenario."]},{"id":"4.2.7-04","obj":"4.2.7","difficulty":"medium","type":"dropdown","stem":"Adatum Corporation must create a custom table for text logs that are collected directly from an application host by Azure Monitor Agent. Sentinel analytics rules must run on the table.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```\naz monitor log-analytics workspace table create --resource-group rg1 --workspace-name ws1 --name [[1]] --plan [[2]] --columns TimeGenerated=datetime [[3]]=string\n```","explanation":"Custom text log tables end with _CL and contain TimeGenerated plus RawData, or Message when a log forwarder is used. Choose the Analytics plan when analytics rules must run on the data.","ref":"https://learn.microsoft.com/azure/sentinel/connect-custom-logs-ama","targets":[{"label":"Box 1","options":["AppLog_CL","AppLog","AppLog_CF"],"why":["Correct: The _CL suffix is required for a custom log table, and the portal and CLI flows expect it.","Incorrect: A name without the _CL suffix does not identify a custom log table, and the connector expects the _CL naming for custom tables.","Incorrect: _CF marks a custom field on an existing table, not a custom table."]},{"label":"Box 2","options":["Analytics","Basic","Auxiliary"],"why":["Correct: The Analytics plan supports the full feature set, including analytics rules and alerts, which the requirement needs.","Incorrect: The Basic plan has discounted ingestion for troubleshooting, with limited query features and no alert support. It does not meet the analytics rule requirement.","Incorrect: The Auxiliary plan is low cost for low-touch data and stops alerts from working on the table. Use it for verbose or compliance data."]},{"label":"Box 3","options":["RawData","Message","Body"],"why":["Correct: RawData holds the entire log message when the logs come directly from the host that runs the application.","Incorrect: Message is the column name used when logs arrive through a log forwarder, which is not the case here.","Incorrect: Body is a column used by other pipelines such as OpenTelemetry logs. The text log connector expects RawData or Message."]}],"answer":[0,0,0]},{"id":"4.2.7-05","obj":"4.2.7","difficulty":"hard","type":"single","stem":"Woodgrove Bank has an application that uses a Microsoft Entra app registration to send data to a DCR-based custom table through the Logs ingestion API. The application receives an authorization error when it posts data.\n\nWhich role should you assign to the app registration on the data collection rule?","explanation":"The application that calls the Logs ingestion API must be granted the Monitoring Metrics Publisher role on the data collection rule.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/logs-ingestion-api-overview","choices":["Monitoring Contributor","Microsoft Sentinel Contributor","Monitoring Metrics Publisher","Log Analytics Contributor"],"answer":[2],"rationale":["Incorrect: Monitoring Contributor lets a user create and edit monitoring settings such as DCRs and alerts, but it is not the role that authorizes sending data through the API.","Incorrect: Microsoft Sentinel Contributor manages Sentinel resources such as rules and solutions. It does not authorize data submission to a DCR.","Correct: Monitoring Metrics Publisher on the DCR is the documented role that allows the application to send data to the DCR endpoint.","Incorrect: Log Analytics Contributor manages workspaces and tables and can read keys, but ingestion through the API is authorized on the DCR with a different role."]},{"id":"4.2.7-06","obj":"4.2.7","difficulty":"hard","type":"yesno","stem":"Tailspin Toys uses the Logs ingestion API to send application events to a custom table in a Log Analytics workspace that has Microsoft Sentinel enabled. The portal wizard created the table and the data collection rule, and a data collection endpoint is used.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","explanation":"The DCR can reshape data with a transformation. The DCE must be in the same region as the workspace or DCR. For Analytics tables in a Sentinel-enabled workspace, filtering transformations are exempt from the filtering charge.","ref":"https://learn.microsoft.com/azure/sentinel/data-transformation","choices":["A transformation in the DCR can convert incoming data so that it matches the schema of the target table.","The data collection endpoint must be in the same region as the workspace.","The incoming data must exactly match the structure of the target table, because a DCR cannot change it.","A transformation that drops rows from an Analytics table in this workspace incurs the Azure Monitor filtering ingestion charge."],"answer":[0,1],"rationale":["Yes: The DCR defines the stream structure and can include a transformation that converts the source data to the table schema, filters rows, or masks fields.","Yes: The DCE must be in the same region as the Log Analytics workspace or the DCR, so a DCE in another region cannot be used.","No: The data does not need to match the table because the DCR transformation converts it. The stream declaration describes the incoming structure.","No: When Microsoft Sentinel is enabled on the workspace, transformations on Analytics tables are not subject to the filtering ingestion charge. The exception applies to Basic tables."]},{"id":"4.2.8-01","obj":"4.2.8","difficulty":"easy","type":"single","stem":"Contoso, Ltd. wants every new Microsoft Sentinel incident that has High severity to be assigned automatically to the user Analyst2. No external systems are involved, and the team does not want to write code.\n\nWhat should you create?","explanation":"Automation rules run when an incident is created or updated, check conditions such as severity, and apply actions such as Assign owner, Change status, and Add tags without code.","ref":"https://learn.microsoft.com/azure/sentinel/automate-incident-handling-with-automation-rules","choices":["A playbook that has an entity trigger","A scheduled analytics rule","An automation rule that assigns an owner when an incident is created","A workbook that lists High severity incidents"],"answer":[2],"rationale":["Incorrect: A playbook with an entity trigger runs on an entity and needs a Logic Apps workflow. It is more complex than needed and is not triggered by incident creation.","Incorrect: A scheduled analytics rule creates alerts and incidents from a query. It detects threats but does not assign incidents after they exist.","Correct: An automation rule with the incident-created trigger, a High severity condition, and the Assign owner action meets the requirement without code.","Incorrect: A workbook visualizes data and does not change incidents. It would show High severity incidents but would not assign them."]},{"id":"4.2.8-02","obj":"4.2.8","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants a response that runs when a Microsoft Sentinel incident is created. The response must block a compromised Microsoft Entra user and open a ticket in an external IT service management system.\n\nWhat should you create to implement the response workflow?","explanation":"Playbooks are Azure Logic Apps workflows that Sentinel can run on incidents, alerts, and entities. They can call Entra ID and external systems, and an automation rule can start them automatically.","ref":"https://learn.microsoft.com/azure/sentinel/automation/automate-responses-with-playbooks","choices":["A playbook based on Azure Logic Apps","An incident task list","A hunting query","A watchlist of compromised users"],"answer":[0],"rationale":["Correct: A playbook implements complex multi-step actions, including calls to Microsoft Entra ID and external systems, and an automation rule can run it when an incident is created.","Incorrect: Incident tasks are a checklist for analysts to follow manually during triage and remediation. They do not call external systems or block users.","Incorrect: A hunting query searches data proactively and returns rows. It does not take response actions.","Incorrect: A watchlist stores reference data that queries and rules can use for enrichment. It holds data but does not perform actions."]},{"id":"4.2.8-03","obj":"4.2.8","difficulty":"medium","type":"single","stem":"Litware, Inc. has two Microsoft Sentinel automation rules that use the incident-created trigger. Rule A lowers the severity of incidents from Medium to Low for a specific analytics rule. Rule B runs a playbook only for incidents with Medium or higher severity. Rule A has order 1 and Rule B has order 2, and Rule B no longer runs for those incidents.\n\nWhat should you do so that Rule B runs without changing its conditions?","explanation":"Automation rules run in order, and each rule evaluates the incident as it is after earlier rules acted on it. Running Rule B before Rule A lets Rule B see the original Medium severity.","ref":"https://learn.microsoft.com/azure/sentinel/automate-incident-handling-with-automation-rules","choices":["Change the trigger of Rule B to When incident is updated","Set an expiration date on Rule A","Change the order of Rule B to 1 and the order of Rule A to 2","Convert Rule B to use the alert-created trigger"],"answer":[2],"rationale":["Incorrect: Update-trigger rules have their own queue and run after the create-trigger rules. The severity is already lowered by then, so Rule B would still not match.","Incorrect: An expiration date disables Rule A after a date. It does not affect the order of evaluation and would remove the severity change for incidents after expiry.","Correct: Rule B evaluates the incident after Rule A changed severity to Low. Giving Rule B a lower order number makes it run first, while the incident is still Medium.","Incorrect: Alert-trigger rules only support the Run playbook action and evaluate alerts, not incident severity, so this would change the design rather than fix the order."]},{"id":"4.2.8-04","obj":"4.2.8","difficulty":"medium","type":"single","stem":"Tailspin Toys runs a planned penetration test for two weeks. Microsoft Sentinel analytics rules must keep creating incidents from the test activity so that the data is retained, but the incidents must be closed automatically with a closing reason. After the test, the closing must stop without manual cleanup.\n\nWhat should you create?","explanation":"An automation rule can close incidents with a reason and a comment, and an expiration date disables the rule after that date. This suits time-limited noise such as a penetration test.","ref":"https://learn.microsoft.com/azure/sentinel/automate-incident-handling-with-automation-rules","choices":["An automation rule that closes the incidents and has an expiration date","A playbook that an analyst runs manually each day","A suppression setting that stops the analytics rule after it creates an alert","An incident task that reminds the analyst to close each incident"],"answer":[0],"rationale":["Correct: The rule uses the Change status action with a closing reason and an expiration date, so it handles the incidents during the test and then disables itself.","Incorrect: A manual daily run depends on a person and does not close incidents automatically. Manual runs fit one-off response actions on a single incident.","Incorrect: Suppression stops the query for a period after an alert, which also stops detections and hides real activity. The stem requires incidents to keep being created.","Incorrect: Incident tasks are checklists for analysts. They remind people but do not close incidents on their own."]},{"id":"4.2.8-05","obj":"4.2.8","difficulty":"hard","type":"multi","stem":"Litware, Inc. has Playbook1 in the resource group RG-Playbooks. Playbook1 starts with the incident trigger. User1 has the Microsoft Sentinel Responder role on the workspace and must create an automation rule that runs Playbook1 when incidents are created. Playbook1 does not appear in the Run playbook action list.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","explanation":"Sentinel needs the Automation Contributor role on the playbook resource group to run playbooks from automation rules, and attaching a playbook to an automation rule needs Microsoft Sentinel Contributor.","ref":"https://learn.microsoft.com/azure/sentinel/automation/run-playbooks","choices":["Assign User1 the Microsoft Sentinel Playbook Operator role on RG-Playbooks","Grant Microsoft Sentinel permissions on RG-Playbooks by using Manage playbook permissions","Recreate Playbook1 by using the alert trigger","Assign User1 the Microsoft Sentinel Contributor role on the workspace resource group","Assign User1 the Logic App Operator role on RG-Playbooks"],"answer":[1,3],"rationale":["Incorrect: Playbook Operator lets a user run a playbook manually. It does not let automation rules run playbooks and does not allow attaching a playbook to a rule.","Correct: Manage playbook permissions gives the Sentinel service account the Automation Contributor role on RG-Playbooks, which makes the playbook available to automation rules. An Owner or User Access Administrator performs this step.","Incorrect: Incident-trigger automation rules can run only incident-trigger playbooks, so an alert-trigger playbook would not appear. The existing trigger is already the right one.","Correct: Attaching a playbook to an automation rule requires Microsoft Sentinel Contributor. Responder can manage incidents but cannot create or edit automation rules that run playbooks.","Incorrect: Logic App Operator reads, enables, and disables logic apps. It does not provide the Sentinel permissions that the automation rule needs."]},{"id":"4.2.8-06","obj":"4.2.8","difficulty":"hard","type":"dragdrop","stem":"Adatum Corporation plans three automated responses in Microsoft Sentinel and must choose the mechanism for each.\n\nWhich mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once, more than once, or not at all.","explanation":"Automation rules handle simple actions and orchestrate playbooks automatically, while playbooks implement complex workflows and can also be run manually on incidents, alerts, or entities.","ref":"https://learn.microsoft.com/azure/sentinel/automate-incident-handling-with-automation-rules","choices":["Automation rule that adds a tag","Automation rule that runs an incident-trigger playbook","Playbook with an entity trigger that is run manually","Automation rule with the alert trigger that changes severity"],"targets":["Requirement 1: tag incidents from one analytics rule with PCI, with no code","Requirement 2: open a ticket in an external system for every new incident","Requirement 3: let an analyst enrich a selected IP address entity on demand"],"answer":[0,1,2],"rationale":["The Add tags action of an automation rule applies a tag based on conditions such as the analytics rule name, without any code.","Contacting an external system needs a playbook, and an incident-created automation rule can run the incident-trigger playbook automatically for every new incident.","A playbook with an entity trigger receives the selected entity, and an analyst runs it manually from the incident, which needs the Playbook Operator role."],"notes":["Automation rule action that applies tags to incidents. Use it for classification without code; it runs when its trigger and conditions match.","An automation rule that calls a playbook that starts with the incident trigger. Use it for automatic, complex responses such as ticketing; the playbook resource group needs Sentinel permissions.","A Logic Apps playbook that takes an entity as input and is started by an analyst. Use it for on-demand enrichment of an IP, account, or host.","Not valid because automation rules that use the alert trigger support only the Run playbook action. Use an incident trigger to change severity."]},{"id":"4.2.9-01","obj":"4.2.9","difficulty":"easy","type":"single","stem":"Tailspin Toys has a Microsoft Sentinel workspace with the default retention settings. The SigninLogs table must stay available for interactive queries for 365 days. All other tables keep the default retention.\n\nWhat should you configure?","explanation":"Retention can be set per table. Setting the analytics retention of one Analytics table to 365 days keeps it interactive for a year without changing other tables. Analytics retention can reach two years.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/data-retention-configure","choices":["The workspace default retention set to 365 days","The analytics retention of the SigninLogs table set to 365 days","The SigninLogs table switched to the Basic table plan","A daily cap on the workspace"],"answer":[1],"rationale":["Incorrect: The workspace default applies to every table that inherits it, which would raise cost for tables that do not need a year. Use it when most tables share the same need.","Correct: Table-level analytics retention affects only SigninLogs, which keeps the data in the interactive state for 365 days while other tables keep their defaults.","Incorrect: The Basic plan offers discounted ingestion but only 30 days of query availability, so it shortens interactive access instead of extending it.","Incorrect: A daily cap stops ingestion above a volume limit. It protects the budget and has no effect on how long data is retained."]},{"id":"4.2.9-02","obj":"4.2.9","difficulty":"easy","type":"single","stem":"Contoso, Ltd. stores verbose firewall logs in a custom table. The logs are required for audits and compliance, are rarely queried, and must stay queryable for the entire seven-year retention period at the lowest ingestion cost. No analytics rules use the table.\n\nWhich table plan should you configure?","explanation":"The Auxiliary plan offers low-cost ingestion for low-touch data such as verbose logs and compliance data, and the data remains queryable throughout its total retention period.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/logs-table-plans","choices":["Analytics plan","Basic plan","Auxiliary plan","A data export rule to Azure Storage"],"answer":[2],"rationale":["Incorrect: The Analytics plan gives the full feature set, including analytics rules and alerts, at the highest ingestion price. Use it for data that detections rely on.","Incorrect: The Basic plan is for troubleshooting and incident response and is queryable for only 30 days. Older data needs a search job, so it is not queryable for the full period.","Correct: Auxiliary tables are low cost for compliance and verbose data, and they stay queryable for the total retention period, up to 12 years.","Incorrect: A data export rule copies new data to a storage account for archiving, but the data would no longer be queryable in the workspace. It is an alternative archive path, not a table plan."]},{"id":"4.2.9-03","obj":"4.2.9","difficulty":"medium","type":"single","stem":"Litware, Inc. must keep the SecurityEvent table of its Microsoft Sentinel workspace available for interactive queries for 90 days, and retain the data for a total of seven years (2,555 days) at the lowest cost for older data.\n\nWhich retention settings should you configure on the table?","explanation":"Analytics retention covers the interactive period and can be at most two years, while total retention extends the same table to a longer period in low-cost long-term retention, up to 12 years.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/data-retention-configure","choices":["Analytics retention of 2,555 days and total retention of 90 days","Analytics retention of 2,555 days and total retention of 2,555 days","Workspace default retention of 90 days and a Basic table plan","Analytics retention of 90 days and total retention of 2,555 days"],"answer":[3],"rationale":["Incorrect: Total retention cannot be shorter than analytics retention, and analytics retention cannot exceed two years. These values are invalid.","Incorrect: Analytics retention of 2,555 days exceeds the two-year (730 days) maximum, and keeping all data interactive costs more than needed.","Incorrect: The Basic plan makes data queryable for only 30 days, and a workspace default of 90 days does not extend retention to seven years.","Correct: Ninety days of analytics retention with a total of 2,555 days keeps data interactive for 90 days and holds the remainder in long-term retention for the rest of the seven years."]},{"id":"4.2.9-04","obj":"4.2.9","difficulty":"medium","type":"dropdown","stem":"Fabrikam, Inc. must keep the SecurityEvent table interactive for 90 days and keep the data for a total of 730 days.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```\naz monitor log-analytics workspace table update --resource-group rg1 --workspace-name ws1 --name SecurityEvent --[[1]] 90 --[[2]] 730\n```","explanation":"On a table, --retention-time sets the analytics (interactive) retention and --total-retention-time sets the total period. The difference between the two values is held in low-cost long-term retention.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/data-retention-configure","targets":[{"label":"Box 1","options":["retention-time","total-retention-time"],"why":["Correct: --retention-time sets the analytics (interactive) retention of the table, which is 90 days here.","Incorrect: --total-retention-time sets the overall period, including long-term retention. Using it for 90 days would shorten the total period, and the value 730 would then be given to the wrong setting."]},{"label":"Box 2","options":["total-retention-time","retention-time"],"why":["Correct: --total-retention-time sets the total retention in days, so 730 keeps the remaining 640 days in long-term retention.","Incorrect: --retention-time is already used for the interactive period in Box 1. Setting it to 730 would make all data interactive, which costs more than required."]}],"answer":[0,0]},{"id":"4.2.9-05","obj":"4.2.9","difficulty":"hard","type":"single","stem":"Woodgrove Bank has a Sentinel workspace in which SecurityEvent has analytics retention of 90 days and total retention of 730 days. During an investigation, an analyst must explore all rows from a one-week window 14 months ago by using full KQL, including joins and summarize, and no specific search term is known.\n\nWhat should you do?","explanation":"Restore makes a specific time range from long-term retention available in the hot cache for high-performance queries that support full KQL. Search jobs retrieve data by specific criteria.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/restore","choices":["Run a search job for a keyword and query the _SRCH table","Switch SecurityEvent to the Auxiliary table plan","Create an export rule to Azure Storage for SecurityEvent","Restore the one-week range into a _RST table and query that table"],"answer":[3],"rationale":["Incorrect: A search job fetches records that match criteria into a _SRCH table. It fits when you know what to look for, but here no search term is known and the full week is needed.","Incorrect: Auxiliary tables stay queryable but are low cost because queries across tables are unoptimized, and alerts stop working on them. Switching a plan is not a targeted way to get full KQL on one week of data.","Incorrect: Export rules send newly ingested data to storage going forward. They do not make existing long-term data queryable in the workspace.","Correct: Restore creates a _RST table for the chosen range, and you run full KQL against it. Dismiss the restore afterward to stop billing."]},{"id":"4.2.9-06","obj":"4.2.9","difficulty":"hard","type":"multi","stem":"Relecloud has a high-volume firewall table in its Microsoft Sentinel workspace. The data is low-touch, no analytics rules use it, and it must remain queryable for a total of five years without running search jobs. The company wants to reduce cost and does not want to change other tables.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","explanation":"The Auxiliary plan gives low-cost ingestion and keeps data queryable for the total retention period. Setting total retention on the table to 1,825 days covers five years without touching other tables.","ref":"https://learn.microsoft.com/azure/azure-monitor/logs/data-retention-configure","choices":["Switch the table to the Basic table plan","Increase the default retention of the workspace to 1,825 days","Set a daily cap of 5 GB on the workspace","Switch the table to the Auxiliary plan","Set the total retention of the table to 1,825 days"],"answer":[3,4],"rationale":["Incorrect: The Basic plan is queryable for only 30 days, and older data needs search jobs. That breaks the requirement to query for five years without search jobs.","Incorrect: The workspace default applies to all tables that inherit it, so it changes other tables and raises cost across the workspace.","Incorrect: A daily cap stops collection of billable data when reached, which risks losing events. It is a budget safeguard, not a retention or plan setting.","Correct: Auxiliary tables are priced for low-touch data and stay queryable through their total retention, which reduces cost and meets the query requirement.","Correct: A table-level total retention of 1,825 days keeps the data for five years. For Auxiliary tables only total retention is set, because analytics retention is read-only."]},{"id":"4.2.10-01","obj":"4.2.10","difficulty":"easy","type":"single","stem":"Woodgrove Bank has a security analyst who works in the Microsoft Defender portal. The analyst must use the same audit log search experience that Microsoft Purview offers, filtering by user, activity, and date range, without leaving the Defender portal.\n\nWhich Defender portal page should you use?","explanation":"The Audit page in the Defender portal opens the unified audit log search, which is identical to audit log search in the Microsoft Purview portal. You choose activities, dates, and users, and you can export the results.","ref":"https://learn.microsoft.com/defender-office-365/audit-log-search-defender-portal","choices":["Advanced hunting","Audit","Incidents and alerts","Threat analytics"],"answer":[1],"rationale":["Incorrect: Advanced hunting runs KQL against Defender XDR tables. It can query audit data such as CloudAppEvents, but it is not the unified audit log search experience that the stem asks for.","Correct: The Audit page provides the unified audit log search with filters for activities, dates, and users, the same experience as in the Purview portal.","Incorrect: Incidents and alerts lists correlated security incidents and alerts. It does not search the unified audit log of user and admin activities.","Incorrect: Threat analytics presents Microsoft research on threats and your exposure to them. It is not a log search tool."]},{"id":"4.2.10-02","obj":"4.2.10","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has an analyst named User1 who must search the audit log in the Microsoft Defender portal. User1 must not be able to change other settings, and you must follow the principle of least privilege.\n\nWhich role should you assign to User1?","explanation":"Searching the audit log requires the Audit Logs or View-Only Audit Logs role. View-Only Audit Logs is the narrower role that allows searching without administrative rights, whereas Global Administrator and Compliance Administrator grant much more.","ref":"https://learn.microsoft.com/purview/audit-search","choices":["Compliance Administrator","Global Administrator","View-Only Audit Logs","Security Reader"],"answer":[2],"rationale":["Incorrect: Compliance Administrator includes the needed permissions but also covers many compliance features. It is broader than required for a user who only searches audit data.","Incorrect: Global Administrator is highly privileged and should be limited to emergencies. It grants far more than audit search needs.","Correct: The View-Only Audit Logs role allows searching the audit log without more administrative rights, which is the least-privilege fit.","Incorrect: Security Reader provides read access to many security features but is not listed as granting access to audit log search. It would not meet the requirement."]},{"id":"4.2.10-03","obj":"4.2.10","difficulty":"medium","type":"single","stem":"Adatum Corporation has an analyst who runs audit searches in the Microsoft Defender portal and gets no results for recent activity. An administrator must verify that audit log search is turned on by checking the UnifiedAuditLogIngestionEnabled property of the Get-AdminAuditLogConfig cmdlet.\n\nWhich environment should you use to run the command?","explanation":"Run Get-AdminAuditLogConfig in Exchange Online PowerShell. The cmdlet also exists in Security and Compliance PowerShell, but there the UnifiedAuditLogIngestionEnabled property is always False.","ref":"https://learn.microsoft.com/purview/audit-search","choices":["Security and Compliance PowerShell","Microsoft Graph PowerShell","Exchange Online PowerShell","Azure Cloud Shell with the Az module"],"answer":[2],"rationale":["Incorrect: The property returns False in this environment even when audit log search is on, so it would give a misleading result. The cmdlet exists there for other settings.","Incorrect: Microsoft Graph PowerShell uses Graph cmdlets and does not provide Get-AdminAuditLogConfig. Use it for Graph-based administration tasks.","Correct: In Exchange Online PowerShell the property reports whether unified audit log ingestion is enabled, and a value of True means audit search is turned on.","Incorrect: The Az module manages Azure resources and does not include Exchange Online audit configuration cmdlets."]},{"id":"4.2.10-04","obj":"4.2.10","difficulty":"medium","type":"single","stem":"Contoso, Ltd. uses Microsoft Defender XDR and has connected Microsoft 365 to Microsoft Defender for Cloud Apps. An analyst must write KQL in advanced hunting that correlates audit events for SharePoint, OneDrive, and Exchange with other hunting data.\n\nWhich table should the analyst query?","explanation":"The CloudAppEvents advanced hunting table contains audit logs across locations such as SharePoint, OneDrive, Exchange, and devices. Access requires Microsoft 365 to be connected to Defender for Cloud Apps.","ref":"https://learn.microsoft.com/defender-xdr/dlp-investigate-alerts-defender","choices":["CloudAppEvents","OfficeActivity","AuditLogs","AzureActivity"],"answer":[0],"rationale":["Correct: CloudAppEvents holds the Microsoft Purview audit data for Microsoft 365 workloads in advanced hunting, and it can be joined with other Defender XDR tables.","Incorrect: OfficeActivity is the table that the Sentinel Microsoft 365 connector fills in a Log Analytics workspace. It is not a Defender XDR advanced hunting table in this scenario.","Incorrect: AuditLogs holds Microsoft Entra directory audit events, such as user and group management. It does not hold SharePoint, OneDrive, and Exchange activity.","Incorrect: AzureActivity holds Azure subscription activity log events. It does not contain Microsoft 365 audit data."]},{"id":"4.2.10-05","obj":"4.2.10","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has an analyst who started an unfiltered audit log search from the Audit page that covers 180 days and is still running. The analyst starts a second search without any filter, and the second search is rejected. The analyst must keep using the Audit page and must not lose the first search.\n\nWhat should you do?","explanation":"Each audit user can run up to 10 search jobs at once, but only one of them can be unfiltered. Adding a filter to the second search keeps it within the limit while the first job continues.","ref":"https://learn.microsoft.com/purview/audit-search","choices":["Close the browser window to stop the first search job","Add a filter such as activities or users to the second search","Assign the analyst the Audit Logs role in addition to View-Only Audit Logs","Delete saved searches that are older than 30 days"],"answer":[1],"rationale":["Incorrect: Search jobs started in the portal keep running after the browser closes, so closing the window does not stop the first job and does not free the unfiltered slot.","Correct: A filtered second search does not count against the single unfiltered job limit, so it can run alongside the first one.","Incorrect: Both roles allow searching, and the rejection is a concurrency limit, not a permission problem. More roles would not raise the limit on unfiltered jobs.","Incorrect: Completed search jobs are kept for 30 days for review, but they do not occupy a running slot. Deleting them does not change the unfiltered job limit."]},{"id":"4.2.10-06","obj":"4.2.10","difficulty":"hard","type":"dragdrop","stem":"Litware, Inc. needs three ways to query Microsoft Purview Audit data. You must choose the right tool for each requirement.\n\nWhich tool should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all.","explanation":"Pick the interface by how the audit data is consumed: the Audit page for interactive filtered searches, advanced hunting for KQL correlation, and Search-UnifiedAuditLog for PowerShell automation.","ref":"https://learn.microsoft.com/defender-xdr/microsoft-xdr-auditing","choices":["Audit page in the Defender portal","Advanced hunting with the CloudAppEvents table","Search-UnifiedAuditLog cmdlet in Exchange Online PowerShell","Audit Search Graph API"],"targets":["Requirement 1: analysts filter by user, activity, and date range and export the results to Excel","Requirement 2: an analyst joins audit events with device events and email events by using KQL","Requirement 3: a scheduled script that runs in Exchange Online PowerShell retrieves audit records"],"answer":[0,1,2],"rationale":["The Audit page provides the portal search with filters and an export to Excel, which suits analysts who do not write code.","Advanced hunting can join the audit data in CloudAppEvents with tables such as DeviceEvents and EmailEvents by using KQL.","Search-UnifiedAuditLog is the Exchange Online PowerShell cmdlet that underlies the search tool and can be used in scripts."],"notes":["Unified audit log search in the Defender portal, identical to the Purview portal search. Use it for interactive searches with filters and Excel export.","KQL hunting over Defender XDR tables, where CloudAppEvents holds audit logs for Microsoft 365 workloads. Use it to correlate audit data with other signals.","The cmdlet in Exchange Online PowerShell for searching audit events in scripts. Use it for automation that runs in PowerShell.","Microsoft Graph API for programmatic access to audit search. It is a valid method but does not fit a requirement that names an Exchange Online PowerShell script."]},{"id":"4.3.1-01","obj":"4.3.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a Microsoft Security Copilot workspace named Workspace1 whose Customer Data storage location is the United States. A new regulation requires that the prompts and responses of the European subsidiary are stored in the European Union.\n\nWhich action should you perform?","choices":["Create a new workspace and select the European Union as its Customer Data storage location.","Change the Customer Data storage location of Workspace1 on the Owner settings page of the portal.","Change the prompt evaluation location of the capacity that Workspace1 uses to Europe (EU).","Turn off the data sharing options in the Owner settings that apply to Workspace1 in the portal."],"answer":[0],"explanation":"The Customer Data storage location is chosen when a workspace is created and cannot be changed afterwards. To store data in another geography you create a new workspace and pick that geography.","rationale":["Correct: the storage location is set at workspace creation and is fixed for the life of the workspace, so a new workspace in the EU geography is the way to keep the subsidiary's data there.","Incorrect: the Owner settings page shows the storage location but does not let you edit it once the workspace exists. Use Owner settings for capacity association, data sharing, audit logging and file upload.","Incorrect: the prompt evaluation location controls where GPU resources process prompts, not where Customer Data is stored at rest. Change it when you need to move prompt processing, for example away from a busy region.","Incorrect: data sharing options control whether Microsoft may capture and review data to improve the product. They do not relocate storage. Turn them off to limit sharing, not to meet a residency requirement."],"ref":"https://learn.microsoft.com/copilot/security/privacy-data-security"},{"id":"4.3.1-02","obj":"4.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Microsoft 365 E5 tenant in which Security Copilot was auto provisioned. The tenant now contains three Security Copilot workspaces. An administrator must identify which workspace powers the embedded Security Copilot experiences in Microsoft Defender, Microsoft Entra and Microsoft Purview.\n\nWhich workspace should the administrator identify?","choices":["The default workspace, which is the earliest-created workspace in the tenant.","The workspace that is linked to the capacity with the largest number of SCUs.","The workspace that a Copilot owner created most recently in the tenant.","The workspace whose storage location matches the geography of the signed-in user."],"answer":[0],"explanation":"Auto provisioning creates a default workspace and links it to the default capacity. If workspaces already exist, the earliest-created one becomes the default, and the embedded experiences across Defender, Entra, Purview and Intune use it.","rationale":["Correct: embedded experiences in Defender, Entra, Purview and Intune use the default workspace, and when a tenant already has workspaces the earliest-created one is the default.","Incorrect: the number of SCUs on a capacity decides how much work the workspace can run, not which workspace the embedded experiences use. Compare SCUs when you size capacity, not when you look for the default.","Incorrect: creation time matters, but the newest workspace is not the default. The earliest-created workspace is. A newer workspace is used from the standalone portal when a user selects it.","Incorrect: the storage location is a property of each workspace and does not route embedded experiences by user geography. It matters for data residency, not for choosing the default workspace."],"ref":"https://learn.microsoft.com/copilot/security/auto-provisioning-security-copilot"},{"id":"4.3.1-03","obj":"4.3.1","difficulty":"medium","type":"single","stem":"Litware, Inc. provisioned 2 SCUs for Security Copilot. During incident response spikes the provisioned units run out within the hour and requests fail. Finance requires that extra units are paid for only when they are consumed and that total spending has an upper limit.\n\nWhat should you configure?","choices":["Overage units with a maximum limit on the capacity.","Overage units set to unlimited on the capacity.","A larger number of provisioned SCUs sized for the peak hour.","A second capacity that is attached to a new workspace."],"answer":[0],"explanation":"Overage units are billed on demand as they are consumed and can be capped with a maximum, which absorbs spikes without paying for idle units. Provisioned SCUs are billed for every full hour whether used or not.","rationale":["Correct: overage SCUs are billed only when consumed, and a maximum limit keeps the cost predictable while still absorbing the spikes that exhaust the provisioned units.","Incorrect: unlimited overage also bills only on consumption, but it has no spending ceiling, which breaks the upper-limit requirement. Use it when uninterrupted access matters more than a cap.","Incorrect: provisioned SCUs are billed per full hour even when idle, so sizing them for the peak pays for unused units the rest of the day. Use it for steady, predictable usage.","Incorrect: a second capacity attached to a new workspace splits the load across workspaces and does not add headroom to the existing one. Use it when separate workspaces need separate billing."],"ref":"https://learn.microsoft.com/copilot/security/security-compute-units-capacity"},{"id":"4.3.1-04","obj":"4.3.1","difficulty":"medium","type":"order","stem":"Relecloud is not licensed for Microsoft 365 E5 or E7 and must provision Security Copilot capacity from the Azure portal.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In the Azure portal, open Microsoft Security compute capacities and, under the Microsoft Security Copilot plan, select Create.","Select the subscription, resource group, capacity name, prompt evaluation location and number of SCUs.","Select Review + create, verify the information and select Create.","Select Finish setup in the Security Copilot portal.","Assign the Copilot contributor role to the analysts in the Azure portal.","Purchase Microsoft 365 E5 licenses for the users who will use Security Copilot."],"answer":[0,1,2,3],"explanation":"Provisioning through Azure starts with the capacity wizard, where you choose the subscription, resource group, evaluation location and SCUs. Only after the capacity exists can you finish the setup in the Security Copilot portal, where the workspace and roles are handled.","rationale":["Step 1: the Azure capacity wizard is reached from Microsoft Security compute capacities by creating a capacity under the Microsoft Security Copilot plan.","Step 2: the wizard needs the subscription, resource group, a capacity name, the prompt evaluation location and the number of SCUs before it can be reviewed.","Step 3: review and create deploys the capacity resource. Billing starts as soon as the capacity exists, whether or not it is attached to an environment.","Step 4: after the capacity is created, finish the setup in the Security Copilot portal, where the capacity is attached to a workspace.","Incorrect: Copilot owner and contributor roles are assigned on the Role assignment page of the Security Copilot portal, not with Azure RBAC. Assign them after setup is finished.","Incorrect: E5 licenses are a different path, because eligible E5 and E7 tenants are auto provisioned. Tenants without that license provision SCUs instead, so no license purchase is part of this procedure."],"ref":"https://learn.microsoft.com/copilot/security/manual-onboarding"},{"id":"4.3.1-05","obj":"4.3.1","difficulty":"hard","type":"yesno","stem":"Woodgrove Bank provisioned a Security Copilot capacity of 4 provisioned SCUs and no overage units. User1 has the Copilot owner role but has no Azure role assignment on the capacity resource.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["If analysts consume all 4 SCUs between 9:00 and 9:30, Security Copilot requests are stopped until the capacity refreshes at 10:00.","SCUs that are not used between 9:00 and 10:00 are added to the SCUs that are available between 10:00 and 11:00.","User1 can associate the workspace with a different capacity from the Owner settings page."],"answer":[0],"explanation":"Provisioned capacity refreshes on fixed clock-hour blocks, unused SCUs expire at the end of the hour and requests stop when the provisioned units run out unless overage is available. Changing the capacity association also needs Azure Owner or Contributor on the capacity resource.","rationale":["Yes: provisioned SCUs refresh each full billing hour, and when they run out requests stop unless another capacity type, such as overage units, is available.","No: unused provisioned SCUs expire at the end of the hour and do not roll over, so the 10:00 block starts again with the 4 provisioned SCUs.","No: changing or associating a capacity needs Azure Owner or Contributor access to the capacity resource in the Azure portal. The Copilot owner role alone is not enough."],"ref":"https://learn.microsoft.com/copilot/security/security-compute-units-capacity"},{"id":"4.3.1-06","obj":"4.3.1","difficulty":"hard","type":"single","stem":"Tailspin Toys is not licensed for Microsoft 365 E5 or E7. User1 must provision Security Compute Units and complete the initial Security Copilot setup. User1 currently has no role assignments.\n\nWhich roles should you assign to User1?","choices":["Azure Contributor on the resource group and Microsoft Entra Security Administrator.","Azure Reader on the subscription and Microsoft Entra Global Reader.","Azure Contributor on the resource group and Microsoft Entra Security Reader.","Azure Reader on the subscription and Microsoft Entra Security Administrator."],"answer":[0],"explanation":"Attaching SCU capacity to a Security Copilot workspace needs an Azure Contributor or Owner role on the subscription or resource group, plus Security Administrator or higher in the tenant being onboarded.","rationale":["Correct: Azure Contributor or Owner lets User1 create the capacity resource, and Security Administrator or higher in the tenant lets User1 complete onboarding.","Incorrect: Reader cannot create a capacity resource and Global Reader is a read-only role that cannot complete onboarding. Reader roles are fine for viewing usage, not provisioning.","Incorrect: Contributor covers the Azure side, but Security Reader is read-only and is below the Security Administrator level that onboarding requires in the tenant.","Incorrect: Security Administrator covers the tenant side, but Reader on the subscription cannot create or change the capacity resource. Contributor or Owner is required for that."],"ref":"https://learn.microsoft.com/copilot/security/manual-onboarding"},{"id":"4.3.1-07","obj":"4.3.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. uses a Security Copilot workspace whose Customer Data storage location is Australia. The capacity uses Australia (ANZ) as the prompt evaluation location. During peak hours analysts report failed prompts because GPU capacity in the selected evaluation location is busy. Data at rest must stay in the workspace storage location.\n\nWhat should you configure?","choices":["Prompt evaluation anywhere in the world on the capacity.","A new workspace with the United States as its storage location.","Unlimited overage units on the capacity that the workspace uses.","Data sharing so that Microsoft can capture prompts for performance."],"answer":[0],"explanation":"Prompt evaluation location is separate from data storage location. Allowing evaluation anywhere in the world lets the service use free GPU capacity when the selected geography is busy, while stored data remains in the workspace geography.","rationale":["Correct: the evaluate-anywhere option mitigates a busy GPU region by letting the system pick the location with capacity, and it does not move the stored Customer Data.","Incorrect: a workspace in the United States would store data outside Australia and does nothing for GPU load in ANZ. Use a new workspace when storage must move to another geography.","Incorrect: overage SCUs add compute units when provisioned units run out. The failures here come from busy GPUs in the evaluation location, not from exhausted SCUs.","Incorrect: data sharing lets Microsoft capture data to improve the product and can store data outside the workspace geography. It does not relieve GPU load and conflicts with the residency requirement."],"ref":"https://learn.microsoft.com/copilot/security/privacy-data-security"},{"id":"4.3.2-01","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. analysts must create sessions and run promptbooks in Security Copilot. They must not change owner settings, view the usage dashboard or publish custom plugins for the tenant.\n\nWhich role should you assign to the analysts?","choices":["Copilot contributor","Copilot owner","Microsoft Entra Security Administrator","Microsoft Entra Billing Administrator"],"answer":[0],"explanation":"Copilot contributor can create sessions, run promptbooks and share promptbooks, but cannot manage owner settings, view the usage dashboard or publish tenant plugins. Copilot owner and the Entra roles that inherit it grant those management rights.","rationale":["Correct: the contributor role gives access to the platform for sessions and promptbooks and excludes owner-level settings, the usage dashboard and tenant plugin publishing.","Incorrect: the owner role adds owner settings, the usage dashboard, capacity management and tenant plugin control, which the stem excludes. Use it for the few administrators who manage Security Copilot.","Incorrect: Security Administrator automatically inherits Copilot owner, so analysts would receive owner rights. It is also a privileged Entra role that should not be assigned just for Copilot access.","Incorrect: Billing Administrator is one of the Entra roles that inherit Copilot owner access, so it grants the owner-level rights the analysts must not have. It fits people who manage billing and capacity."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.2-02","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Adatum Corporation wants User1 to manage Security Copilot owner settings and to count as one of the Security Copilot owners without a separate Security Copilot role assignment. User1 must receive the access by holding a Microsoft Entra role.\n\nWhich Microsoft Entra role should you assign to User1?","choices":["Security Administrator","Security Reader","Reports Reader","Application Administrator"],"answer":[0],"explanation":"A fixed set of Microsoft Entra, Intune and Purview roles automatically inherit Copilot owner access. Security Administrator is in that set, while read-only and unrelated roles are not.","rationale":["Correct: Security Administrator is one of the Microsoft Entra roles that automatically inherit Copilot owner access, so User1 becomes an owner without a Security Copilot role assignment.","Incorrect: Security Reader is a read-only security role that is not in the list of Entra roles inheriting Copilot owner access. Use it for read access to security data, not to manage Copilot.","Incorrect: Reports Reader reads usage and activity reports and is not among the roles that inherit Copilot owner. It would not make User1 an owner or give access to owner settings.","Incorrect: Application Administrator manages app registrations and enterprise applications and is not in the inherited owner list. It fits app management tasks rather than Security Copilot administration."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.2-03","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Adatum Corporation assigned User1 the Copilot contributor role. User1 has no Microsoft Entra roles. When User1 asks Security Copilot for Microsoft Sentinel incidents, the Microsoft Sentinel plugin returns no data. User1 must be able to read incidents and must not receive write access.\n\nWhich role should you assign to User1?","choices":["Microsoft Sentinel Reader on the Sentinel workspace","Microsoft Sentinel Contributor on the Sentinel workspace","Copilot owner in Security Copilot","A custom Defender XDR role that includes Security Copilot permission"],"answer":[0],"explanation":"Security Copilot uses on-behalf-of authentication, so plugins only return data the signed-in user is allowed to read. For Sentinel that access comes from Azure RBAC, and Microsoft Sentinel Reader gives read access to incidents.","rationale":["Correct: Copilot roles control platform access, while data access comes from the service role. Microsoft Sentinel Reader on the workspace lets the plugin read incidents without write rights.","Incorrect: Microsoft Sentinel Contributor would also expose incidents but adds write access, which the stem forbids. Use it for analysts who must change incidents and create analytics rules.","Incorrect: Copilot owner adds platform administration but no Sentinel data access, because Security Copilot roles do not grant access to security data by themselves. The plugin would still return nothing.","Incorrect: a Defender XDR role with Security Copilot permission governs access to Defender portal data and the embedded Copilot there. It does not grant Azure RBAC read access to a Sentinel workspace."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.2-04","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Northwind Traders has a Security Copilot workspace in which the Everyone group is assigned the Copilot contributor role. The company wants only the members of SecOps-Group, a Microsoft Entra security group, to use the platform. The company does not want to assign privileged Microsoft Entra roles for this purpose.\n\nWhat should you do?","choices":["Remove the Everyone group from Copilot contributor and add SecOps-Group on the Role assignment page.","Assign the Security Administrator role to SecOps-Group in Microsoft Entra ID.","Add SecOps-Group to Copilot owner and keep the Everyone group as Copilot contributor.","Remove the Everyone group and assign Azure Contributor on the capacity resource group to SecOps-Group."],"answer":[0],"explanation":"Security Copilot roles are managed on the Role assignment page and can be given to groups. Removing the broad Everyone assignment and adding a security group follows least privilege without using a privileged Entra role.","rationale":["Correct: Everyone is the broad default contributor assignment. Replacing it with SecOps-Group on the Role assignment page limits platform access to that group and needs no privileged Entra role.","Incorrect: Security Administrator is privileged and inherits Copilot owner, so it grants more than platform use. It also leaves the Everyone group in place, so other users keep access.","Incorrect: owner gives administrative rights to SecOps-Group, which exceeds the need to use the platform, and keeping Everyone as contributor does not restrict access. Owner suits only the administrators.","Incorrect: Azure Contributor on the resource group lets users manage the capacity resource but is not a Security Copilot role, so it does not grant platform access to the group."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.2-05","obj":"4.3.2","difficulty":"hard","type":"multi","stem":"Contoso, Ltd. wants the members of Analysts-Group, a Microsoft Entra security group, to use the standalone Security Copilot portal and to retrieve Microsoft Sentinel incidents through the Microsoft Sentinel plugin. The group must not receive privileged Microsoft Entra roles and must not manage Security Copilot settings.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Add Analysts-Group to the Copilot contributor role on the Role assignment page.","Assign Microsoft Sentinel Reader on the Sentinel workspace to Analysts-Group.","Assign the Microsoft Entra Security Administrator role to Analysts-Group.","Add Analysts-Group to the Copilot owner role on the Role assignment page.","Assign Azure Contributor on the capacity resource group to Analysts-Group."],"answer":[0,1],"explanation":"Two layers are needed: a Security Copilot role for platform access and a service role for the data. Contributor plus Microsoft Sentinel Reader gives the group platform use and read access to incidents without privileged or management rights.","rationale":["Correct: Copilot contributor gives the group access to the standalone portal and sessions without owner-level settings.","Correct: Microsoft Sentinel Reader is the Azure RBAC role that lets the Sentinel plugin read incidents on behalf of the user, with read-only access.","Incorrect: Security Administrator is privileged and inherits Copilot owner, so it breaks both restrictions. Use a security group in a Copilot role instead of a privileged role for Copilot access.","Incorrect: Copilot owner lets the group manage settings, capacity association, data sharing and plugins, which the stem forbids. Reserve owner for the administrators.","Incorrect: Azure Contributor on the capacity resource group manages the SCU capacity resource. It grants neither Security Copilot platform access nor read access to Sentinel incidents."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.2-06","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Tailspin Toys enabled Microsoft Intune as a data source in Security Copilot. User1 is assigned a custom Intune role-based access control (RBAC) role that is limited by scope tags. User1 has no Microsoft Entra roles and no Security Copilot role assignments.\n\nWhich access should User1 receive in Copilot in Intune?","choices":["Copilot contributor access, limited to the Intune data that the custom role and scope tags allow","Copilot owner access, limited to the Intune data that the custom role and scope tags allow","No access until a Copilot owner adds User1 on the Role assignment page","Copilot contributor access to all Intune data because Copilot does not evaluate Intune RBAC"],"answer":[0],"explanation":"When Intune is enabled as a data source, the Intune Administrator role inherits Copilot owner and other built-in and custom Intune RBAC roles inherit Copilot contributor. Copilot still honors Intune RBAC roles and scope tags for data access.","rationale":["Correct: custom Intune RBAC roles inherit Copilot contributor, and Copilot honors the Intune role and scope tags, so User1 only sees the data the role allows.","Incorrect: owner is inherited only by the Intune Administrator Entra role among the Intune roles. A custom Intune role with scope tags does not inherit owner access.","Incorrect: with Intune enabled as a data source, Intune roles inherit contributor automatically, so no separate assignment is needed. Manual assignment is for users with no inherited access.","Incorrect: Copilot honors Intune RBAC and scope tags, and a user without permission gets an error. Contributor gives platform access, not broader data access than the Intune role allows."],"ref":"https://learn.microsoft.com/intune/copilot/faq"},{"id":"4.3.2-07","obj":"4.3.2","difficulty":"medium","type":"dragdrop","stem":"Woodgrove Bank has three users who use Security Copilot and must receive access with the least privilege that meets each requirement.\n\nWhich role should you assign to each user? To answer, drag the appropriate roles to the correct users. Each role may be used once, more than once, or not at all.","choices":["Copilot owner","Copilot contributor","Microsoft Sentinel Reader (Azure RBAC)","Microsoft Entra Security Administrator"],"targets":["User1: must view the Security Copilot usage dashboard and update data sharing options","User2: must create sessions and run promptbooks in the standalone portal","User3: already has Copilot contributor and must read Microsoft Sentinel incidents through the plugin"],"answer":[0,1,2],"explanation":"Viewing the usage dashboard and changing data sharing options are owner capabilities. Sessions and promptbooks need only contributor. Data from a plugin needs the service role, here Azure RBAC on Sentinel, on top of platform access.","rationale":["Owner is the only Security Copilot role that can view the usage dashboard and update data sharing and feedback options, so User1 needs it.","Contributor can create sessions and run promptbooks, which is all User2 needs, and it excludes owner settings.","User3 already has platform access, and the Sentinel plugin reads data as the user, so the Azure RBAC Microsoft Sentinel Reader role supplies the missing data access."],"notes":["Security Copilot role for administrators. Can manage settings, plugins, capacity association and the usage dashboard. Use it for the few people who administer the platform.","Security Copilot role for analysts. Can create sessions and run promptbooks, with no owner settings. Use it for everyday users.","Azure RBAC role that gives read access to Sentinel incidents and data. Use it when a plugin must read Sentinel data for a user who already has platform access.","Privileged Entra role that inherits Copilot owner access. Use it for security administration, not as a way to grant Copilot access to analysts."],"ref":"https://learn.microsoft.com/copilot/security/authentication"},{"id":"4.3.3-01","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Tailspin Toys wants to prevent contributors from using the preinstalled Microsoft Defender XDR plugin and the Natural Language to KQL plugin in Security Copilot, including in the embedded experiences. Owners must keep using both plugins.\n\nWhat should you do?","choices":["In Plugin settings, restrict the availability of the preinstalled plugins to Owners.","Ask each contributor to turn off the plugin toggles in the Sources dialog.","Remove the Copilot contributor role from the Defender administrators.","Delete both plugins from the Custom section of Manage plugins."],"answer":[0],"explanation":"Owners can change the availability of preinstalled plugins for the tenant to everyone or to Owners. The restriction applies immediately to the standalone and embedded experiences, and new preinstalled plugins then default to Owners until configured.","rationale":["Correct: the Plugin settings page lets owners restrict preinstalled plugins to Owners, and the restriction also applies to embedded experiences such as Copilot in Defender.","Incorrect: the toggles in Sources are a personal choice for each user, so they cannot enforce a tenant-wide restriction. Use them when a user wants to personalize which sources a session uses.","Incorrect: removing the contributor role takes away platform access altogether, including the plugins the Defender administrators should keep using elsewhere. Use it when users no longer need Security Copilot.","Incorrect: the Custom section holds plugins that were uploaded, and preinstalled plugins do not appear there, so there is nothing to delete. Delete a custom plugin when it should be retired."],"ref":"https://learn.microsoft.com/copilot/security/manage-plugins"},{"id":"4.3.3-02","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. wants contributors to add and manage custom plugins for their own sessions. Only Copilot owners may publish custom plugins that are available to everyone in the organization.\n\nWhich configuration should you apply in Plugin settings?","choices":["Set the user scope permission to Owners and Contributors and the organization scope permission to Owners.","Set the user scope permission to Owners and the organization scope permission to Owners and Contributors.","Set the user scope permission to Owners and Contributors and the organization scope permission to Owners and Contributors.","Set the user scope permission to Owners and the organization scope permission to Owners."],"answer":[0],"explanation":"Plugin settings has one permission for plugins that a person adds for themselves and a second one for plugins published for the organization. The second permission is available only after the first allows Owners and Contributors.","rationale":["Correct: contributors can then add and manage their own custom plugins, while publishing for the whole organization stays with owners.","Incorrect: the organization scope permission is only enabled when the user scope allows Owners and Contributors, and this combination would not let contributors add personal plugins as required.","Incorrect: this lets contributors publish plugins for everyone in the organization, which the stem reserves for owners. Use it when a trusted contributor group maintains shared plugins.","Incorrect: this keeps all custom plugin management with owners, so contributors cannot add plugins for their own sessions. Use it when plugin changes must be centrally controlled."],"ref":"https://learn.microsoft.com/copilot/security/manage-plugins"},{"id":"4.3.3-03","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Analysts at Litware, Inc. use the preinstalled Microsoft Sentinel plugin in the standalone Security Copilot portal. Each analyst team works with a different Sentinel workspace and wants prompts to use that workspace by default. The solution must not require uploading custom plugins.\n\nWhat should each analyst do?","choices":["Open the personalization settings of the Microsoft Sentinel plugin and specify the default workspace.","Ask a Copilot owner to set the default Sentinel workspace for the tenant in Plugin settings.","Create a separate Security Copilot workspace for each Sentinel workspace.","Turn off the Microsoft Sentinel plugin and use the Natural Language to KQL plugin instead."],"answer":[0],"explanation":"Plugins that show a gear or Set up button are configured per user. The Microsoft Sentinel plugin supports personalization, where a user designates the workspace to use as the default.","rationale":["Correct: the Microsoft Sentinel plugin has a per-user setting for the default workspace, reachable by the gear icon in Sources, so each analyst chooses the team workspace.","Incorrect: Plugin settings controls who can add custom plugins and who can use preinstalled plugins. It does not hold a tenant default Sentinel workspace, because setup is per user.","Incorrect: Security Copilot workspaces define storage location, capacity and access, and they are not tied to Sentinel workspaces. Create one when you need separate data storage or access.","Incorrect: turning off the Sentinel plugin removes incident access, and the Natural Language to KQL plugin generates queries but is also set up per user. It does not set a default workspace for the Sentinel plugin."],"ref":"https://learn.microsoft.com/copilot/security/use-plugins"},{"id":"4.3.3-04","obj":"4.3.3","difficulty":"medium","type":"yesno","stem":"Fabrikam, Inc. has a Security Copilot tenant. A Copilot owner uploads a custom Security Copilot plugin and makes it available to anyone in the organization. The Plugin settings allow only owners to add and manage custom plugins for the organization.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Contributors can turn the plugin on or off and use it in their sessions.","Contributors can edit the plugin file in the Custom section.","The plugin is shown with a private tag to all users."],"answer":[0],"explanation":"A plugin that an owner makes available to the organization can be used and toggled by every Security Copilot user, but only owners can modify it. The private tag is added only when a plugin is made available to just the person who added it.","rationale":["Yes: plugins that owners publish to the organization can be accessed, turned on or off and used by all Security Copilot users.","No: custom plugins created by owners are not editable by contributors. Only owners can modify a plugin that they published for the organization.","No: a private tag is added when a plugin is made available to just the person who uploaded it. A plugin available to the organization is visible to all users without it."],"ref":"https://learn.microsoft.com/copilot/security/manage-plugins"},{"id":"4.3.3-05","obj":"4.3.3","difficulty":"hard","type":"dropdown","stem":"Woodgrove Bank has these requirements for Security Copilot plugins:\n\n- Contributors can add and manage custom plugins for their own sessions.\n- Only Copilot owners can publish custom plugins for everyone in the organization.\n- The preinstalled Natural Language to KQL plugin is available to Copilot owners and not to contributors.\n\nHow should you configure the Plugin settings? To answer, select the appropriate options in the answer area.\n\nWho can add and manage their own custom plugins: [[1]]\nWho can add and manage custom plugins for everyone in the organization: [[2]]\nAvailability of the preinstalled Natural Language to KQL plugin: [[3]]","choices":["Owners and Contributors","Owners","Everyone"],"answer":[1,0,0],"explanation":"The two custom plugin permissions are independent scopes, user and organization, and preinstalled plugins have a separate availability setting. Rest
