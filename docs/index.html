ricting a preinstalled plugin to Owners affects the standalone and embedded experiences immediately.","rationale":[],"ref":"https://learn.microsoft.com/copilot/security/manage-plugins","targets":[{"label":"Box 1","options":["Owners","Owners and Contributors"],"why":["Incorrect: Owners keeps personal custom plugin management with owners, so contributors could not add plugins for their own sessions. Use it when all plugin changes are centrally controlled.","Correct: Owners and Contributors lets contributors add and manage custom plugins for themselves, and it enables the organization scope permission that is set in the next box."]},{"label":"Box 2","options":["Owners","Owners and Contributors"],"why":["Correct: Owners keeps publishing for the whole organization with owners, so contributors can add personal plugins but cannot make them available to everyone.","Incorrect: Owners and Contributors lets contributors publish plugins to everyone in the organization, which the requirement reserves for owners. Use it when a trusted group maintains shared plugins."]},{"label":"Box 3","options":["Owners","Everyone"],"why":["Correct: restricting the preinstalled plugin to Owners makes it unavailable to contributors in the standalone and embedded experiences, as required.","Incorrect: Everyone keeps the plugin available to contributors, which the requirement forbids. Use it for preinstalled plugins that all analysts should be able to use."]}]},{"id":"4.3.3-06","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Adatum Corporation restricted the preinstalled Microsoft Defender XDR plugin to Owners in Security Copilot. User1, a contributor, sets up a Microsoft-built agent that requires the Microsoft Defender XDR plugin. Other contributors must still not be able to use that plugin in their own sessions.\n\nWhich action should you take?","choices":["Keep the plugin restricted, because setting up the agent activates its required plugins for that agent without changing the tenant restriction.","Make the plugin available to everyone before User1 sets up the agent.","Assign User1 the Copilot owner role so that the agent can use the restricted plugin.","Upload a custom copy of the plugin that is available to User1 only."],"answer":[0],"explanation":"When you set up a Security Copilot agent, the plugins that the agent requires are enabled automatically and only for that agent. Doing so does not change the status of plugins that you made available or restricted for the organization.","rationale":["Correct: required plugins are activated solely for the agent and do not alter the plugin availability that owners configured, so other contributors stay restricted.","Incorrect: making the plugin available to everyone would let all contributors use it in their sessions, which breaks the stem. Do this only if the organization decides to lift the restriction.","Incorrect: owner would give User1 broad administrative rights and is not needed, because the agent enables its required plugin itself. Grant owner only to people who manage Security Copilot.","Incorrect: a custom copy is an unnecessary extra plugin that would need its own vetting and is not required for the agent. Upload custom plugins to add capabilities that are not preinstalled."],"ref":"https://learn.microsoft.com/copilot/security/manage-plugins"},{"id":"4.3.4-01","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. sets up a Microsoft-built agent in Security Copilot. The company wants the agent to run with a dedicated identity that is created for AI agents and scoped to the permissions granted during setup, instead of running with an analyst's credentials.\n\nWhich identity option should you select?","choices":["Create an agent identity that uses Microsoft Entra Agent ID","Connect with an existing user account of an analyst","Use a managed identity that is assigned to the capacity resource","Use a service principal that has a client secret"],"answer":[0],"explanation":"During agent setup you choose between creating an agent identity, which uses Microsoft Entra Agent ID and is available for Microsoft-built agents, and connecting an existing user account that lends its credentials and permissions to the agent.","rationale":["Correct: creating an agent identity makes a dedicated Microsoft Entra Agent ID for the agent, keeping access scoped and easier to manage than a borrowed user identity.","Incorrect: connecting an existing user account makes the agent inherit that person's access and permissions while it runs. Use it for agents where an agent identity is not offered.","Incorrect: a managed identity on the capacity resource is not one of the identity options in agent setup, and it would not represent the agent in Security Copilot. Managed identities suit Azure resources.","Incorrect: a service principal with a secret is not offered in agent setup either, and a stored secret adds credentials to manage. Use app registrations for apps that call APIs, not for these agents."],"ref":"https://learn.microsoft.com/copilot/security/agents-overview"},{"id":"4.3.4-02","obj":"4.3.4","difficulty":"easy","type":"single","stem":"Litware, Inc. wants to browse and deploy partner-built agents that run in Security Copilot. The agents are purchased and deployed through an Azure billing subscription.\n\nWhich location should you use?","choices":["Microsoft Security Store","The Custom section of Manage plugins in Security Copilot","The Agent Store in Microsoft Copilot","Microsoft Security compute capacities in the Azure portal"],"answer":[0],"explanation":"Security Store lists Microsoft and partner security agents. You select Get solution, choose the Azure billing subscription, resource group and name, place the order and then configure the agent in Security Copilot.","rationale":["Correct: Microsoft Security Store is where you explore security agents, select Get solution and deploy through an Azure billing subscription, after which you configure the agent in Security Copilot.","Incorrect: the Custom section is where you upload your own plugin or agent YAML. Use it for agents that you build, not to discover and purchase partner-built agents.","Incorrect: the Agent Store in Microsoft Copilot lists agents for Microsoft 365 Copilot experiences. It is not the catalog for Security Copilot agents that deploy through Azure billing.","Incorrect: Microsoft Security compute capacities is where you create SCU capacity. It does not list agents. Use it when you need to provision or resize capacity."],"ref":"https://learn.microsoft.com/security/store/customers/get-agents-in-security-store"},{"id":"4.3.4-03","obj":"4.3.4","difficulty":"medium","type":"single","stem":"Relecloud has a partner-built agent from Security Store that reads Microsoft Sentinel and Microsoft Entra data. User1 has the Copilot contributor role and no Microsoft Entra roles. In Security Copilot the Set up button for the agent is disabled and a banner says that consent is required.\n\nWhich user should approve the agent permissions so that User1 can finish the setup?","choices":["A Microsoft Entra Global Administrator","A Security Copilot owner","A Microsoft Entra Security Administrator","An Azure subscription Owner"],"answer":[0],"explanation":"A partner-built agent that accesses Microsoft product data needs a Global Administrator in the tenant to approve the permissions. Afterwards owners and contributors finish the setup, including identity and trigger.","rationale":["Correct: a Global Administrator must approve the Microsoft product permissions that the partner agent needs. User1 copies the link, and after approval can complete the setup.","Incorrect: a Copilot owner can set up and edit agents but cannot grant tenant consent for Microsoft product permissions. Owners finish setup after the approval is given.","Incorrect: Security Administrator manages security settings, for example agent settings in Defender, but the consent for a partner agent is an approval by a Global Administrator.","Incorrect: an Azure subscription Owner controls billing and Azure resources, which matter when purchasing the agent in Security Store. It does not grant consent to Microsoft Entra or Sentinel data."],"ref":"https://learn.microsoft.com/copilot/security/agents-manage"},{"id":"4.3.4-04","obj":"4.3.4","difficulty":"medium","type":"order","stem":"Fabrikam, Inc. must deploy an agent from Microsoft Security Store and then configure it in Security Copilot.\n\nWhich five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Open the Security Store portal, select Explore agents and select the agent.","Select Get solution.","Select the Azure billing subscription, resource group and name, and select Next to review the deployment resources.","Review the order and deployment details and select Place order.","Select Open Microsoft Security Copilot and configure the agent.","Upload the agent YAML file as a custom plugin in Manage plugins.","Create a Logic Apps connector for the Security Copilot API."],"answer":[0,1,2,3,4],"explanation":"The Security Store flow moves from selecting the agent to Get solution, then billing and deployment details, then Place order. Only after deployment completes can you open Security Copilot and configure the agent instance that was created.","rationale":["Step 1: you must find and open the agent in Security Store before any purchase flow is available.","Step 2: Get solution starts the purchase and deployment flow for the selected agent.","Step 3: the flow asks for the Azure billing subscription, resource group and name, and then shows the deployment resource information.","Step 4: Place order starts the purchase and deployment, which creates the billing resources and the agent instance in Copilot.","Step 5: after the deployment completes, open Security Copilot to configure the deployed agent, including identity and trigger.","Incorrect: uploading YAML as a custom plugin is the route for an agent that you build yourself. Agents from Security Store are deployed by the store order.","Incorrect: Logic Apps connectors call the Security Copilot API from external workflows. They are not part of deploying an agent from Security Store."],"ref":"https://learn.microsoft.com/security/store/customers/get-agents-in-security-store"},{"id":"4.3.4-05","obj":"4.3.4","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. set up the Phishing Triage Agent in Microsoft Defender with the identity option Connect an existing user account. The account, ServiceAcct1, holds its Defender role through Microsoft Entra Privileged Identity Management (PIM) eligible assignment. The agent stops triaging alerts after a few hours, and the account must not use long-lived standing privileges.\n\nWhat should you do?","choices":["Change the agent identity to a new agent identity that uses Microsoft Entra Agent ID and assign it the required role.","Issue a Temporary Access Pass for ServiceAcct1 and sign the agent in again.","Assign the Copilot owner role to ServiceAcct1 in Security Copilot.","Increase the provisioned SCUs of the capacity that the workspace uses."],"answer":[0],"explanation":"A user account that is used as the agent identity must authenticate for long-term background operation, which is not compatible with PIM or Temporary Access Pass. A dedicated agent identity that uses Microsoft Entra Agent ID avoids this and can be assigned only the permissions the agent needs.","rationale":["Correct: the identity can be changed after setup, and an agent identity based on Entra Agent ID is scoped to the agent and is not dependent on PIM activation or interactive sign-in.","Incorrect: a Temporary Access Pass is a short-lived credential, and a user identity for an agent is not compatible with it because it cannot support long-term background operation.","Incorrect: Copilot owner changes Security Copilot platform rights, not the Defender permissions that the agent needs, and it does not address the PIM activation expiring.","Incorrect: more SCUs add capacity when the agent runs out of compute. The agent stops because its identity cannot keep authenticating, so extra capacity would not help."],"ref":"https://learn.microsoft.com/defender-xdr/phishing-triage-agent"},{"id":"4.3.4-06","obj":"4.3.4","difficulty":"hard","type":"multi","stem":"Woodgrove Bank wants the Phishing Triage Agent in Microsoft Defender to triage phishing emails that users report from Outlook. Security Copilot capacity is already provisioned and Microsoft Defender for Office 365 Plan 2 is deployed.\n\nWhich three actions should you perform? Each correct answer presents part of the solution.","choices":["Activate unified role-based access control for the Defender for Office 365 workload.","Enable Monitor reported messages in Outlook in the user reported settings.","Disable the Auto-Resolve alert tuning rule for emails that are reported by users as malware or phish.","Enable the Microsoft Sentinel data lake for the tenant.","Assign the Security Administrator role to the agent identity."],"answer":[0,1,2],"explanation":"The Phishing Triage Agent works on alerts of the type Email reported by user as malware or phish. It requires unified RBAC for Defender for Office 365, user reporting from Outlook that creates the alert, and no tuning rule that auto-resolves those alerts.","rationale":["Correct: the agent identity and the people who monitor it use unified RBAC permissions, so the Defender for Office 365 workload must be activated in the unified RBAC settings.","Correct: user reported messages from Outlook generate the alerts that the agent triages, so Monitor reported messages in Outlook must be enabled.","Correct: the agent does not triage alerts that alert tuning has already resolved, so the built-in auto-resolve rule and any similar custom rules must be disabled.","Incorrect: the Sentinel data lake is used by some Security Store agents that run notebook jobs, but it is not a prerequisite for the Phishing Triage Agent.","Incorrect: the agent identity needs only the specific Defender permissions in a role, such as Alerts (manage). Security Administrator is a broad privileged role and violates least privilege."],"ref":"https://learn.microsoft.com/defender-xdr/phishing-triage-agent"}],"cases":{}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => `<div class="why">${inline(s)}</div>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
    if (confirm("End the exam now? Unanswered questions count as incorrect.")) finish();
  });
  if (!keep) window.scrollTo(0, 0);
}

function navPractice(it) {
  const last = S.i + 1 === S.items.length;
  return `${S.i > 0 ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    ${it.checked ? `<button id="next" type="button">${last ? (S.review ? "Done" : "Results") : "Next"}</button>`
      : `<button id="check" type="button" ${complete(it.q, it.picked) ? "" : "disabled"}>Check</button><button class="ghost" id="next" type="button">Skip</button>`}
    <button class="ghost" id="quit" type="button">${S.review ? "Close review" : "Stop"}</button>`;
}

function navExam(it, sec) {
  const series = sec.kind === "series" || it.q.series, last = S.i + 1 === sec.end;
  const prevOk = S.i > sec.start && !series && !S.items[S.i - 1].locked;
  return `${prevOk ? `<button class="ghost" id="prev" type="button">Previous</button>` : ""}
    <button id="next" type="button">${!last ? "Next" : series ? (S.sec + 1 < S.secs.length ? "Next section" : "Finish exam") : "Review"}</button>
    ${series ? "" : `<button class="ghost" id="mark" type="button" aria-pressed="${it.mark}">Mark for review</button><button class="ghost" id="review" type="button">Review screen</button>`}
    <button class="ghost" id="quit" type="button">End exam</button>`;
}

function review() {
  const sec = S.secs[S.sec], idx = [];
  for (let i = sec.start; i < sec.end; i++) if (!S.items[i].q.series) idx.push(i);
  const open = idx.filter(i => !answered(S.items[i])).length, marked = idx.filter(i => S.items[i].mark).length;
  const lastSec = S.sec + 1 === S.secs.length;
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Review screen${S.secs.length > 1 ? ` -- section ${S.sec + 1} of ${S.secs.length}` : ""}</span>${clockChip()}</div>
    <p>${idx.length - open} answered, ${open} unanswered, ${marked} marked for review. Select a question to return to it.</p>
    <div class="rv">${idx.map(i => { const x = S.items[i]; return `<button class="ghost" type="button" data-go="${i}">Question ${i + 1}<br><span class="muted">${answered(x) ? "Answered" : "Unanswered"}${x.mark ? ", marked" : ""}</span></button>`; }).join("")}</div>
    <div class="actions">
      <button id="endsec" type="button">${lastSec ? "Submit exam" : "Finish section"}</button>
      <button class="ghost" id="back" type="button">Return to question ${S.i + 1}</button>
    </div></div>`;
  $$("[data-go]").forEach(b => b.onclick = () => { S.i = +b.dataset.go; S.tab = 0; show(); });
  document.getElementById("back").onclick = () => show();
  document.getElementById("endsec").onclick = () => {
    const msg = (open ? `${open} question(s) are unanswered. ` : "") + (lastSec ? "Submit the exam?" : "After you finish this section, you cannot return to it. Continue?");
    if (confirm(msg)) endSection();
  };
  window.scrollTo(0, 0);
}

function endSection() {
  const sec = S.secs[S.sec];
  for (let i = sec.start; i < sec.end; i++) S.items[i].locked = true;
  if (++S.sec >= S.secs.length) return finish();
  S.sim ? intro() : (S.i = S.secs[S.sec].start, show());
}

function finish() {
  clearInterval(tick); S.done = true;
  S.items.forEach(it => {
    it.score = grade(it.q, it.picked); it.checked = true;
    if (answered(it)) history[it.q.id] = it.score === 1;
  });
  store.set(KEY + ".history", history);
  result();
}

function feedback(it) {
  const q = it.q, s = it.score;
  return `<p class="verdict ${s === 1 ? "ok" : "bad"}">${s === 1 ? "Correct!" : s > 0 ? `Partially correct (${Math.round(100 * s)}%).` : "Incorrect."}</p>
    <div>${md(q.explanation)}</div>
    <p class="muted">Source: <a href="${esc(q.ref)}" target="_blank" rel="noopener">${esc(q.ref.replace("https://", ""))}</a></p>`;
}

function result() {
  clearInterval(tick);
  const xs = S.mode === "practice" ? S.items.filter(x => x.checked) : S.items;
  const pts = xs.reduce((s, x) => s + x.score, 0), pct = xs.length ? Math.round(100 * pts / xs.length) : 0;
  const per = Object.entries(DOMAINS).map(([k, d]) => {
    const ds = xs.filter(x => dom(x.q) === k); if (!ds.length) return "";
    const g = ds.reduce((s, x) => s + x.score, 0);
    return `<tr><td>${esc(d.title)}</td><td>${+g.toFixed(1)}/${ds.length}</td><td>${Math.round(100 * g / ds.length)}%</td></tr>`;
  }).join("");
  const wrong = xs.filter(x => x.score < 1), mins = Math.round((Date.now() - S.t0) / 60000);
  $app.innerHTML = `
  <div class="card">
    <h2>Results</h2>
    <div class="big">${pct}%</div>
    <p>${+pts.toFixed(1)} of ${xs.length} points${S.sim ? `, ${mins} minutes used` : ""}. Multi-part questions earn partial credit.
      ${pct >= 70 ? "Around passing level." : "Below passing level."} <span class="muted">The real exam reports a scaled score where 700 of 1000 passes; that is not exactly 70% correct.</span></p>
    <table><tr><th>Domain</th><th>Points</th><th>%</th></tr>${per}</table>
    <div class="actions">
      ${wrong.length ? `<button id="rwrong" type="button">Review ${wrong.length} mistakes</button>` : ""}
      <button class="ghost" id="rall" type="button">Review all</button>
      <button class="ghost" id="home" type="button">New session</button>
    </div>
  </div>`;
  const rev = list => { S = { mode: "practice", review: true, items: list, secs: [{ kind: "std", start: 0, end: list.length }], sec: 0, i: 0, tab: 0, sel: null }; show(); };
  document.getElementById("home").onclick = home;
  document.getElementById("rall").onclick = () => rev(xs);
  const rw = document.getElementById("rwrong"); if (rw) rw.onclick = () => rev(wrong);
}

home();
</script>
</body>
</html>
