ownloading anything.","Step 3: the profile package is generated for the configured gateway, so it must be downloaded after the settings are saved.","Step 4: the Azure VPN Client uses the profile settings to build the connection. This is the last step because it needs the downloaded package.","Incorrect: a root certificate is used by Azure certificate authentication and has no role in Entra ID sign-in. Use it when clients authenticate with certificates.","Incorrect: RADIUS authentication points to an external server for sign-in. It is a different authentication type than Microsoft Entra ID."],"ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-entra-gateway"},{"id":"2.3.4-08","obj":"2.3.4","difficulty":"hard","type":"dropdown","stem":"Fabrikam, Inc. configures the point-to-site settings of VPN gateway VNet1GW. Employees must sign in with Microsoft Entra ID credentials and multifactor authentication from the Azure VPN Client.\n\nHow should you complete the settings? To answer, select the appropriate options in the answer area.\n\n```text\nAddress pool:         172.16.201.0/24\nTunnel type:          [[1]]\nAuthentication type:  [[2]]\nTenant:               https://login.microsoftonline.com/[[3]]\n```","targets":[{"label":"Box 1","options":["OpenVPN (SSL)","IKEv2","SSTP (SSL)"],"why":["Correct: OpenVPN is the only tunnel type that supports Microsoft Entra ID authentication and the Azure VPN Client.","Incorrect: IKEv2 supports certificate and RADIUS authentication. Use it for native macOS, iOS and Windows clients that do not use Entra ID.","Incorrect: SSTP supports certificate and RADIUS authentication, but not Microsoft Entra ID sign-in."]},{"label":"Box 2","options":["Microsoft Entra ID","Azure certificate","RADIUS authentication"],"why":["Correct: Microsoft Entra ID authentication provides Entra sign-in with Conditional Access and MFA, which the requirement asks for.","Incorrect: Azure certificate authentication uses a trusted root certificate and client certificates, so there is no Entra sign-in or MFA from Entra.","Incorrect: RADIUS authentication delegates sign-in to a RADIUS server. Text-based MFA that requires entering a code in the VPN client is not supported through it."]},{"label":"Box 3","options":["the Microsoft Entra tenant ID","the Azure subscription ID","the VPN gateway name"],"why":["Correct: the tenant URL for Azure public cloud is https://login.microsoftonline.com/ followed by the tenant ID of the directory used for authentication.","Incorrect: the subscription ID identifies an Azure billing and resource container, not the directory that issues tokens, so authentication would fail.","Incorrect: the gateway name identifies an Azure resource, not a directory, so the issuer endpoint would not resolve to your tenant."]}],"answer":[0,0,0],"explanation":"Entra ID sign-in for P2S needs OpenVPN, the Microsoft Entra ID authentication type and a tenant URL that ends with the tenant ID.","ref":"https://learn.microsoft.com/azure/vpn-gateway/point-to-site-entra-gateway"},{"id":"2.3.5-01","obj":"2.3.5","difficulty":"easy","type":"single","stem":"Litware, Inc. wants to replace its VPN quickly with Microsoft Entra Private Access. Users must reach many internal resources through wide IP ranges and wildcard FQDNs, and per-application segmentation will come later.\n\nWhich Private Access configuration should you use first?","choices":["Quick Access","A per-app enterprise application for each resource","The Internet Access traffic forwarding profile","The Microsoft 365 traffic forwarding profile"],"answer":[0],"explanation":"Quick Access is the VPN-replacement starting point of Private Access, and per-app access is the least-privilege next step once you know which segments users need.","rationale":["Correct: Quick Access is a single enterprise application that holds broad FQDNs, IP addresses and ranges. It is designed as a migration-friendly VPN replacement before you segment by application.","Incorrect: Per-app enterprise applications give precise segmentation, but they require you to define each app segment up front. The stem asks for a quick start with wide ranges, so per-app comes later.","Incorrect: The Internet Access profile forwards traffic to internet destinations through the service. It does not publish private resources that sit behind connectors.","Incorrect: The Microsoft 365 profile forwards Microsoft 365 traffic. It does not publish private IP ranges or internal FQDNs of your own network."],"ref":"https://learn.microsoft.com/entra/global-secure-access/how-to-configure-quick-access"},{"id":"2.3.5-02","obj":"2.3.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has internal web apps in its datacenter. No inbound firewall ports may be opened. You must provide the component that brokers connections from Microsoft Entra Private Access to those apps.\n\nWhat should you install on a Windows server in the datacenter?","choices":["A Microsoft Entra private network connector","The Global Secure Access client","Microsoft Entra Connect Sync","The Private Access Sensor"],"answer":[0],"explanation":"Connectors run on Windows servers inside the network and initiate outbound connections only. Clients on user devices are a separate component.","rationale":["Correct: The private network connector is an agent that makes outbound connections to the service and reaches the internal apps, so no inbound ports are needed.","Incorrect: The Global Secure Access client runs on user devices and sends private traffic to the service. It does not broker connections from the service to datacenter resources.","Incorrect: Microsoft Entra Connect Sync synchronizes identities between Active Directory and Microsoft Entra ID. It does not publish or proxy applications.","Incorrect: The Private Access Sensor is installed on domain controllers for Active Directory scenarios. It does not publish general web apps, which need a connector."],"ref":"https://learn.microsoft.com/entra/global-secure-access/concept-connectors"},{"id":"2.3.5-03","obj":"2.3.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank publishes all private resources through Quick Access, protected by a Conditional Access policy that requires multifactor authentication. A single HR app must additionally require a compliant device, and other resources must not be affected.\n\nWhat should you do?","choices":["Create a per-app enterprise application for the HR app segments and target it with its own Conditional Access policy","Add the compliant device requirement to the Quick Access Conditional Access policy","Create a second Quick Access application for the HR app","Create a second private network connector group for the HR app"],"answer":[0],"explanation":"Quick Access shares one policy across all segments. To apply a different Conditional Access policy to a subset, create a per-app Global Secure Access application.","rationale":["Correct: A per-app enterprise application can have its own users and Conditional Access policies. Its segments take precedence over Quick Access, so only the HR app gets the extra control.","Incorrect: A policy on Quick Access applies to every segment in it, so all resources would require a compliant device. Use it only when the whole set has the same requirement.","Incorrect: Quick Access is a single application per tenant, so a second one is not available. The per-app model exists for different policies on subsets of resources.","Incorrect: A connector group controls which connectors serve an app. It does not change access policy, so the HR app would still be governed by the Quick Access policy."],"ref":"https://learn.microsoft.com/entra/global-secure-access/how-to-target-resource-private-access-apps"},{"id":"2.3.5-04","obj":"2.3.5","difficulty":"medium","type":"single","stem":"Relecloud has Quick Access segments that include 10.0.0.0/8. A per-app enterprise application named HR has an application segment for 10.5.0.0/24. A user connects to a server at 10.5.0.10.\n\nWhich configuration should you expect to govern this connection?","choices":["The HR enterprise application, including its assignments and Conditional Access policies","The Quick Access application, including its Conditional Access policy","The most restrictive result of the HR application and Quick Access combined","No configuration, because overlapping segments block the traffic"],"answer":[0],"explanation":"Per-app segments override overlapping Quick Access ranges. This lets you carve out resources for tighter control while the broad range stays in place.","rationale":["Correct: When an enterprise application segment overlaps Quick Access, the enterprise application takes precedence for that resource. The HR app assignments and policies therefore apply to 10.5.0.10.","Incorrect: Quick Access covers the broader range, but the more specific per-app segment wins for the overlapping resource, so its policy is not the one that applies here.","Incorrect: The two policies are not merged. One application takes precedence for the resource, so the result is not a combination of both.","Incorrect: Overlap is permitted and resolved by precedence of the enterprise application. Traffic is not blocked, and migrating segments out of Quick Access is a recommended step, not a requirement."],"ref":"https://learn.microsoft.com/entra/global-secure-access/tutorial-private-access-app-segmentation"},{"id":"2.3.5-05","obj":"2.3.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. installs a private network connector on a server in a perimeter-restricted datacenter. A security engineer asks which firewall changes are required.\n\nWhich change should you make?","choices":["Allow outbound TCP 80 and 443 to the required Microsoft URLs and open no inbound ports","Allow inbound TCP 443 from the internet to the connector server","Allow inbound TCP 3389 from the Microsoft service ranges to the connector server","Route outbound connector traffic through a proxy that performs TLS inspection"],"answer":[0],"explanation":"Connectors need outbound TCP 80 and 443 to documented URLs. They require no inbound ports, and the TLS traffic to the service must not be inspected or terminated.","rationale":["Correct: Connectors send only outbound requests. Port 443 carries service communication and port 80 is used for certificate revocation lists, so outbound access to the required URLs is enough.","Incorrect: Inbound access is not required because traffic flows both ways after the connector establishes an outbound session. Opening inbound 443 exposes the server without benefit.","Incorrect: RDP is an administration protocol and is not used by the service to reach the connector. Opening inbound ports is unnecessary for Private Access.","Incorrect: Inline inspection or termination of the outbound TLS traffic between connectors and the service breaks the two-way certificate authentication, so it must be avoided."],"ref":"https://learn.microsoft.com/entra/global-secure-access/how-to-configure-connectors"},{"id":"2.3.5-06","obj":"2.3.5","difficulty":"easy","type":"yesno","stem":"Tailspin Toys deploys Microsoft Entra Private Access with private network connectors.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["A connector group should contain at least two connectors for high availability.","Conditional Access policies can target the Quick Access application.","The firewall of the connector server must allow inbound TCP 443 from the internet."],"answer":[0,1],"explanation":"Use multiple connectors per group for availability, apply Conditional Access to Private Access apps, and keep inbound firewall ports closed.","rationale":["Yes: Connectors in a group act as one unit for load balancing and availability, and the guidance is to use at least two per group.","Yes: Conditional Access can be applied to both Quick Access and per-app Private Access applications, for example to require MFA.","No: Connectors make outbound connections only. No inbound ports are required, so the firewall change would add exposure with no benefit."],"ref":"https://learn.microsoft.com/entra/global-secure-access/concept-connectors"},{"id":"2.3.5-07","obj":"2.3.5","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. uses Quick Access as a VPN replacement and wants to move to least-privilege per-app access in phases.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Use Application Discovery to see which segments users reach through Quick Access","Create enterprise applications that contain those segments and assign the right users","Disable the Private Access traffic forwarding profile for all users","Remove all connectors from the connector group","Disable Quick Access before any per-app application exists"],"answer":[0,1],"explanation":"Migrate in phases: discover what is used, create per-app applications that take precedence, and retire Quick Access last.","rationale":["Correct: Application Discovery reports who accesses which FQDNs, IPs, ports and protocols through Quick Access, so you know which per-app applications to build first.","Correct: Per-app enterprise applications with assigned users and their own Conditional Access policies deliver least privilege. Because they take precedence, you can migrate segments in phases.","Incorrect: Disabling the traffic forwarding profile stops Private Access for all users and removes the traffic that discovery relies on. It is not a migration step.","Incorrect: Connectors are needed by both Quick Access and per-app applications to reach resources. Removing them breaks access instead of segmenting it.","Incorrect: Disabling Quick Access first removes access to segments that have no per-app application yet. Disable it only after every segment has moved."],"ref":"https://learn.microsoft.com/entra/global-secure-access/tutorial-private-access-app-segmentation"},{"id":"2.3.5-08","obj":"2.3.5","difficulty":"hard","type":"dragdrop","stem":"Contoso, Ltd. is deploying Microsoft Entra Private Access.\n\nWhich component should you use for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once, more than once, or not at all.","choices":["Private network connector","Global Secure Access client","Quick Access","Per-app access application"],"targets":["Requirement 1: broker outbound connections from a datacenter to internal servers without inbound firewall ports","Requirement 2: capture private traffic on employee laptops and send it to the service","Requirement 3: apply a stricter Conditional Access policy to one internal app than to the rest"],"answer":[0,1,3],"rationale":["The connector runs in the datacenter, initiates outbound sessions to the service and reaches the internal servers on its behalf.","The client runs on the device, acquires private traffic that matches published segments and forwards it to the service.","A per-app application has its own users and Conditional Access, so one app can be stricter. Quick Access shares one policy across all segments."],"notes":["Agent on Windows servers that makes outbound connections to the service and reaches private resources. Use it in every network that hosts private apps.","Software on user devices that forwards matching traffic to Global Secure Access. Use it on every device that needs private access.","One application that holds broad FQDNs and ranges for VPN replacement. Use it as a starting point, not for per-app policy.","An enterprise application with its own segments, assignments and Conditional Access. Use it for least privilege and per-app controls."],"explanation":"The connector reaches resources from inside the network, the client captures traffic on the device, and per-app applications carry app-specific policy.","ref":"https://learn.microsoft.com/entra/global-secure-access/concept-private-access"},{"id":"2.3.6-01","obj":"2.3.6","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has an Azure Storage account that holds sensitive files. Clients in a virtual network must reach the account by using a private IP address from that virtual network.\n\nWhat should you create?","choices":["A private endpoint","A service endpoint on the subnet","An Azure Firewall application rule","A NAT gateway on the subnet"],"answer":[0],"explanation":"A private endpoint gives a PaaS resource a private IP address in your virtual network, which is the key difference from service endpoints that keep using public addresses.","rationale":["Correct: A private endpoint places a network interface with a private IP address from your subnet in front of the storage subresource, so clients connect to a private address.","Incorrect: A service endpoint extends the virtual network identity to the service but traffic still targets the public IP address of the storage account. Use it when a private IP is not required.","Incorrect: An application rule filters outbound HTTP and HTTPS by FQDN. It does not give the storage account a private IP address in your network.","Incorrect: A NAT gateway provides outbound source address translation to the internet. It does not create private connectivity to a PaaS resource."],"ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-overview"},{"id":"2.3.6-02","obj":"2.3.6","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. must let a virtual network reach both the blob service and the file service of one storage account by using private IP addresses.\n\nWhat should you create?","choices":["Two private endpoints, one for the blob subresource and one for the file subresource","One private endpoint that targets the storage account for all services","One private endpoint with two IP configurations","One private endpoint for blob and a service endpoint for file"],"answer":[0],"explanation":"Azure Storage exposes each service, such as blob and file, as a separate private-link subresource, so you create one private endpoint per subresource.","rationale":["Correct: Each private endpoint targets one subresource of a service. To reach blob and file you need a separate private endpoint for each.","Incorrect: A private endpoint connects to a specific subresource, such as blob or file, not to the whole account. A single endpoint cannot cover both services.","Incorrect: A private endpoint targets one subresource, so adding IP configurations does not add a second service. IP configurations assign addresses for that one subresource.","Incorrect: Mixing a private endpoint with a service endpoint leaves the file traffic on the public address, so the requirement for private IP addresses is not met for file."],"ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-overview"},{"id":"2.3.6-03","obj":"2.3.6","difficulty":"medium","type":"single","stem":"Woodgrove Bank created a private endpoint for a storage account blob service. VMs in the virtual network still resolve mystorage.blob.core.windows.net to a public IP address. The virtual network uses Azure-provided DNS, and 300 VMs must work without local changes.\n\nWhat should you do?","choices":["Create the privatelink.blob.core.windows.net private DNS zone, link it to the virtual network, and add a DNS zone group to the endpoint","Add an entry to the hosts file on each VM","Create an A record in the public DNS zone of the company","Enable a service endpoint for Microsoft.Storage on the subnet"],"answer":[0],"explanation":"A private endpoint needs matching DNS. A privatelink private DNS zone linked to the virtual network, with a DNS zone group on the endpoint, keeps records correct automatically.","rationale":["Correct: A private DNS zone with the privatelink name, linked to the virtual network, overrides resolution for the VMs. The zone group keeps the A record in sync with the private endpoint.","Incorrect: A hosts file overrides DNS only on one machine and is recommended for testing. Editing 300 VMs is the local change the stem rules out.","Incorrect: Public DNS records are visible to the whole internet and would expose the private address publicly. The VMs need a private zone linked to their network.","Incorrect: A service endpoint changes routing to the public address and has no effect on DNS resolution. It does not move clients to the private endpoint."],"ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-dns-integration"},{"id":"2.3.6-04","obj":"2.3.6","difficulty":"medium","type":"single","stem":"Litware, Inc. has a subnet that hosts a private endpoint for Azure SQL Database. An NSG on the subnet denies inbound TCP 1433 from a test subnet, but test VMs still connect to the database through the private endpoint.\n\nWhat should you do?","choices":["Enable the network security group policy for private endpoints on the subnet","Associate the NSG with the private endpoint network interface","Create a service endpoint policy for Microsoft.Sql","Add an outbound deny rule on the subnet NSG for TCP 1433"],"answer":[0],"explanation":"Private endpoints bypass NSGs and UDRs unless the subnet setting for private endpoint network policies is enabled for network security groups, route tables, or both.","rationale":["Correct: Network policies for private endpoints are disabled by default, so NSG rules are bypassed. Enabling the NSG option, for example NetworkSecurityGroupEnabled, makes the subnet NSG apply to private endpoint traffic.","Incorrect: The private endpoint network interface is managed by the platform and does not take its own NSG. NSG support comes from enabling network policies on the subnet.","Incorrect: Service endpoint policies filter which resources service endpoint traffic can reach. They do not influence private endpoint traffic.","Incorrect: An outbound rule on the private endpoint subnet does not apply to the inbound flow from test VMs. The inbound NSG rule is ignored until policies are enabled."],"ref":"https://learn.microsoft.com/azure/private-link/disable-private-endpoint-network-policy"},{"id":"2.3.6-05","obj":"2.3.6","difficulty":"hard","type":"multi","stem":"Tailspin Toys uses Azure SQL Database. Clients in a virtual network must reach the logical server only by using a private IP address, and connections from the internet must fail.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Create a private endpoint for the logical server in the virtual network","Disable public network access on the logical server","Create a service endpoint for Microsoft.Sql on the subnet","Enable NSG network policies on the private endpoint subnet","Create an application security group for the private endpoint"],"answer":[0,1],"explanation":"A private endpoint provides the private path, but public access remains until you disable it or restrict it with the resource firewall. NSG policies and ASGs only refine filtering.","rationale":["Correct: The private endpoint provides the private IP address that clients use to reach the logical server from the virtual network.","Correct: A private endpoint does not restrict public access by itself. Disabling public network access makes private endpoints the only path, so internet connections fail.","Incorrect: A service endpoint keeps traffic on the public endpoint of the service with a virtual network rule. It does not give a private IP address.","Incorrect: Network policies add NSG filtering for traffic to the endpoint. They are useful extra control, but they do not create the private path or block internet access.","Incorrect: An application security group can be attached to a private endpoint to simplify NSG rules. It is optional and does not provide connectivity or block the internet."],"ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-overview"},{"id":"2.3.6-06","obj":"2.3.6","difficulty":"easy","type":"yesno","stem":"Relecloud has created a private endpoint for a web app in a virtual network that uses a private DNS zone group and a firewall for inspection.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Creating a private endpoint automatically disables public network access to the web app.","Deleting the private endpoint removes the DNS records that its DNS zone group created.","A user-defined route for 0.0.0.0/0 to the firewall overrides the /32 route of the private endpoint."],"answer":[1],"explanation":"A private endpoint does not close public access, a DNS zone group manages its records, and a broad UDR cannot override its /32 route.","rationale":["No: A private endpoint provides a private IP address but does not restrict public network access by itself. Use the resource networking settings to disable or limit it.","Yes: The zone group links the endpoint to the private DNS zone and manages the records, including removing them when the endpoint is deleted.","No: The private endpoint /32 route wins by longest prefix match, so a default route does not override it. A more specific route and enabled network policies are needed."],"ref":"https://learn.microsoft.com/azure/private-link/disable-private-endpoint-network-policy"},{"id":"2.3.6-07","obj":"2.3.6","difficulty":"medium","type":"dragdrop","stem":"Contoso, Ltd. is creating private DNS zones for private endpoints.\n\nWhich private DNS zone should you use for each private endpoint? To answer, drag the appropriate zones to the correct endpoints. Each zone may be used once, more than once, or not at all.","choices":["privatelink.blob.core.windows.net","privatelink.documents.azure.com","privatelink.azurewebsites.net","privatelink.vaultcore.azure.net"],"targets":["Endpoint 1: blob subresource of a storage account","Endpoint 2: SQL API of an Azure Cosmos DB account","Endpoint 3: an Azure App Service web app"],"answer":[0,1,2],"rationale":["The blob service of Azure Storage uses the privatelink.blob.core.windows.net zone for its private endpoint records.","Azure Cosmos DB for the SQL API uses the privatelink.documents.azure.com zone for private endpoint records.","App Service web apps use the privatelink.azurewebsites.net zone for private endpoint records."],"notes":["Zone for the blob service of Azure Storage. Use it for blob private endpoints.","Zone for Azure Cosmos DB SQL API private endpoints. Use it for the SQL API subresource of Cosmos DB accounts.","Zone for Azure App Service private endpoints. Use it for web apps and function apps that expose a private endpoint.","Zone for Azure Key Vault private endpoints. It is not needed for these three endpoints."],"explanation":"Each Azure service has its own privatelink zone name. Do not share one zone between private endpoints of different services, because records can overwrite each other.","ref":"https://learn.microsoft.com/azure/private-link/private-endpoint-dns"},{"id":"2.3.6-08","obj":"2.3.6","difficulty":"hard","type":"dropdown","stem":"Fabrikam, Inc. has a private endpoint named private-endpoint for an App Service web app in vnet-1. NSG rules must apply to traffic to the endpoint, but route tables must not be affected. The private DNS zone must not register VM records automatically.\n\nHow should you complete the commands? To answer, select the appropriate options in the answer area.\n\n```azurecli\naz network vnet subnet update --name default --resource-group test-rg --vnet-name vnet-1 [[1]]\n\naz network private-dns link vnet create --resource-group test-rg --zone-name \"privatelink.azurewebsites.net\" --name dns-link --virtual-network vnet-1 --registration-enabled [[2]]\n\naz network private-endpoint dns-zone-group create --resource-group test-rg --endpoint-name private-endpoint --name zone-group --private-dns-zone [[3]] --zone-name webapp\n```","targets":[{"label":"Box 1","options":["--private-endpoint-network-policies NetworkSecurityGroupEnabled","--private-endpoint-network-policies RouteTableEnabled","--private-endpoint-network-policies Disabled"],"why":["Correct: NetworkSecurityGroupEnabled enables NSG support for private endpoints and leaves user-defined routes bypassed, matching the requirement.","Incorrect: RouteTableEnabled enables route table (UDR) support only, so NSG rules would still be bypassed. Use it when UDRs must steer traffic to a firewall.","Incorrect: Disabled is the default and bypasses both NSGs and route tables, so the NSG requirement is not met."]},{"label":"Box 2","options":["false","true"],"why":["Correct: false turns off auto-registration, which suits a privatelink zone that holds only private endpoint records, as the requirement states.","Incorrect: true would auto-register VM records in the zone. Use it only for a private zone dedicated to VM name registration, not for a privatelink zone."]},{"label":"Box 3","options":["\"privatelink.azurewebsites.net\"","\"privatelink.blob.core.windows.net\"","\"azurewebsites.net\""],"why":["Correct: privatelink.azurewebsites.net is the private DNS zone name that the App Service private endpoint uses, so the zone group writes its record there.","Incorrect: privatelink.blob.core.windows.net is the zone for Azure Storage blob endpoints, so a web app record would never be resolved from it.","Incorrect: azurewebsites.net is the public suffix of web apps. Overriding it would break resolution of public web apps, so the privatelink zone is used instead."]}],"answer":[0,0,0],"explanation":"The subnet policy enables NSG support, the virtual network link has registration off, and the DNS zone group points to the service-specific privatelink zone.","ref":"https://learn.microsoft.com/azure/private-link/create-private-endpoint-cli"},{"id":"2.3.7-01","obj":"2.3.7","difficulty":"easy","type":"single","stem":"Contoso, Ltd. hosts a service on VMs behind a Standard Load Balancer. Customers in other Azure subscriptions must connect to the service privately from their virtual networks without peering and without the internet.\n\nWhich Azure resource should Contoso, Ltd. create on the service side?","choices":["A Private Link service","A private endpoint","A service endpoint","A virtual network gateway"],"answer":[0],"explanation":"A Private Link service is the provider side of a private connection to your own service. Consumers use private endpoints in their virtual networks to reach it.","rationale":["Correct: A Private Link service exposes your own service behind a Standard Load Balancer. Consumers create private endpoints that connect to it, with no peering or overlap concerns.","Incorrect: A private endpoint is the consumer-side resource that connects to a Private Link service or Azure PaaS resource. The provider needs the service resource to connect to.","Incorrect: A service endpoint extends a subnet identity to Azure PaaS services over their public endpoints. It cannot expose a customer-hosted service to other subscriptions.","Incorrect: A virtual network gateway builds VPN or ExpressRoute connectivity. It does not publish a load-balanced service to other subscriptions privately."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-service-overview"},{"id":"2.3.7-02","obj":"2.3.7","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. tries to create a Private Link service in front of a pair of VMs that sit behind a Basic Load Balancer. The creation cannot select the load balancer frontend.\n\nWhat should you do?","choices":["Replace the Basic load balancer with a Standard load balancer","Add a second NAT IP configuration to the service","Create a dedicated subnet for the Private Link service","Enable proxy protocol on the Basic load balancer"],"answer":[0],"explanation":"A Private Link service requires the frontend of a Standard Load Balancer. NAT IP configuration, visibility and approval settings come after that dependency is met.","rationale":["Correct: Private Link service is tied to the frontend IP of a Standard Load Balancer. A Basic Load Balancer is not supported, so the load balancer must be replaced.","Incorrect: NAT IP configurations provide source address translation and connection scale, but they do not make a Basic load balancer usable as the service frontend.","Incorrect: A dedicated subnet is not required for a Private Link service. You can choose any subnet in the virtual network, so a new subnet would not fix the problem.","Incorrect: Proxy protocol is a Private Link service setting that passes consumer connection information to the backend. It does not change which load balancer SKU is supported."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-faq"},{"id":"2.3.7-03","obj":"2.3.7","difficulty":"medium","type":"single","stem":"Woodgrove Bank provides a service through a Private Link service. Only customers in subscriptions SubA, SubB and SubC may find the service and request a connection. Requests from SubC must be approved automatically, and the others must be approved by the provider.\n\nWhat should you configure?","choices":["Visibility for SubA, SubB and SubC, and auto-approval for SubC","Visibility set to all, and auto-approval for SubC","Visibility for SubC, and auto-approval for SubA, SubB and SubC","Visibility for SubA, SubB and SubC, and auto-approval for all three"],"answer":[0],"explanation":"Use visibility to control exposure and auto-approval to control approval. Auto-approval is always a subset of the visibility list.","rationale":["Correct: Visibility limits who can locate the service, and auto-approval is a subset of it. SubA and SubB can request and wait for manual approval, while SubC is approved automatically.","Incorrect: Visibility set to all lets every subscription locate the service, which breaks the requirement that only three subscriptions can find it.","Incorrect: Auto-approval is a subset of visibility, so subscriptions outside the visibility list cannot be auto-approved. SubA and SubB would also not be able to request the connection.","Incorrect: Auto-approving all three removes the manual approval step for SubA and SubB, which the requirement keeps with the provider."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-service-overview"},{"id":"2.3.7-04","obj":"2.3.7","difficulty":"medium","type":"single","stem":"Litware, Inc. consumes a Private Link service of a partner. The private endpoint in the Litware, Inc. virtual network shows the connection state Pending, and the Litware, Inc. subscription is not in the partner auto-approval list.\n\nWhat should the partner do?","choices":["Approve the pending connection on the Private Link service","Approve the connection on the private endpoint in the Litware, Inc. subscription","Add a DNS zone group to the private endpoint","Recreate the Private Link service with proxy protocol enabled"],"answer":[0],"explanation":"The provider approves, rejects or deletes connection requests on the Private Link service. Auto-approval for listed subscriptions skips this manual step.","rationale":["Correct: Connections to a Private Link service arrive in the Pending state on the service object. Only the service provider can approve them, and only approved connections carry traffic.","Incorrect: The consumer cannot approve its own request. The approval decision is made on the target service, which is the Private Link service owned by the partner.","Incorrect: A DNS zone group manages DNS records for the endpoint. It does not affect the connection state, which stays Pending until the provider acts.","Incorrect: Proxy protocol passes connection details to the backend and does not influence approval. Recreating the service would also drop existing connections."],"ref":"https://learn.microsoft.com/troubleshoot/azure/private-link/troubleshoot-private-endpoint-pending-approval"},{"id":"2.3.7-05","obj":"2.3.7","difficulty":"medium","type":"single","stem":"Relecloud runs a Private Link service whose backend serves very many concurrent TCP connections from consumers. New connections fail because the available source ports of the NAT IP are exhausted.\n\nWhat should you do?","choices":["Add NAT IP configurations to the Private Link service","Add a second frontend IP configuration to the load balancer","Set the visibility of the service to all subscriptions","Add the consumer subscriptions to the auto-approval list"],"answer":[0],"explanation":"Private Link service performs destination-side NAT. Each NAT IP offers a limited number of ports, so scale by adding NAT IPs or backend VMs.","rationale":["Correct: Each NAT IP provides about 64 thousand TCP ports per backend VM. Adding NAT IPs, or backend VMs, increases the number of connections that the service can carry.","Incorrect: A frontend IP configuration of the load balancer is where traffic arrives. It does not add source ports for the destination-side NAT that Private Link performs.","Incorrect: Visibility controls who can locate the service. It does not change capacity, so connection failures from port exhaustion would remain.","Incorrect: Auto-approval only skips manual approval of connection requests. The failures occur on already approved connections and are caused by port exhaustion."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-faq"},{"id":"2.3.7-06","obj":"2.3.7","difficulty":"easy","type":"yesno","stem":"Tailspin Toys publishes a service through a Private Link service and manages connection requests.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["One private endpoint can connect to two different Private Link services.","One Private Link service can receive connections from multiple private endpoints.","The Private Link service requires a dedicated subnet in the provider virtual network."],"answer":[1],"explanation":"The relation is many private endpoints to one Private Link service, not the reverse, and no dedicated subnet is required.","rationale":["No: A private endpoint can connect to only one Private Link service. Create another private endpoint for each additional service.","Yes: A service can serve many consumers, each with its own private endpoint, and each connection has its own approval state.","No: A dedicated subnet is not required. You can choose any subnet in the virtual network that hosts the service for the NAT IP configuration."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-faq"},{"id":"2.3.7-07","obj":"2.3.7","difficulty":"hard","type":"order","stem":"Fabrikam, Inc. wants to publish an internal API from virtual network vnet-provider to a partner subscription. The partner must connect privately from its own virtual network, and the connection request must be approved by Fabrikam, Inc.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create an internal Standard load balancer with a frontend IP configuration for the API VMs.","Create a Private Link service that uses the load balancer frontend and a NAT IP configuration.","In the partner subscription, create a private endpoint that targets the Private Link service.","Approve the pending connection with `az network private-endpoint-connection approve --id <connection-id>`.","Create a service endpoint for Microsoft.Network on the provider subnet.","Create a VPN gateway connection between the two virtual networks."],"answer":[0,1,2,3],"explanation":"The dependency chain is load balancer, Private Link service, consumer private endpoint request, and provider approval.","rationale":["Step 1: the Private Link service is tied to a Standard Load Balancer frontend, so the load balancer must exist first.","Step 2: the service is created on top of the load balancer frontend and defines the NAT IP configuration, visibility and approval settings.","Step 3: the consumer needs the service resource ID or alias to request a connection, so the endpoint is created after the service exists. It starts in Pending state.","Step 4: the provider approves the pending request. Only approved connections can send traffic, so this step comes last.","Incorrect: Service endpoints extend a subnet identity to Azure PaaS services. They cannot publish your own load-balanced service to another subscription.","Incorrect: A VPN gateway would build a routed network connection and does not publish a single service privately. The requirement is service-level private access."],"ref":"https://learn.microsoft.com/azure/private-link/private-link-service-overview"},{"id":"2.3.7-08","obj":"2.3.7","difficulty":"hard","type":"dropdown","stem":"Contoso, Ltd. deploys a Private Link service by using an Azure Verified Module in Bicep. The service must use a load balancer frontend, partner subscription ptn-sub may find the service, and trusted subscription tst-sub must be approved automatically.\n\nHow should you complete the parameters? To answer, select the appropriate options in the answer area.\n\n```bicep\nparam name = 'pls1'\nparam ipConfigurations = [ { name: 'nat1', primary: true, privateIPAllocationMethod: 'Dynamic', subnetResourceId: '<subnetId>' } ]\nparam [[1]] = [ '<lbFrontendId>' ]\nparam [[2]] = [ '<ptn-sub-id>' ]\nparam [[3]] = [ '<tst-sub-id>' ]\n```","targets":[{"label":"Box 1","options":["loadBalancerFrontendIpConfigurationResourceIds","fqdns","enableProxyProtocol"],"why":["Correct: this parameter references the Standard Load Balancer frontend IP configurations that the Private Link service is tied to.","Incorrect: fqdns lists FQDNs for the service, not the load balancer frontend that the service uses.","Incorrect: enableProxyProtocol is a boolean that enables proxy protocol and cannot take a list of frontend resource IDs."]},{"label":"Box 2","options":["visibilitySubscriptionIds","autoApprovalSubscriptionIds"],"why":["Correct: visibility lists the subscriptions that can locate the service and request a connection, which matches the partner subscription requirement.","Incorrect: autoApprovalSubscriptionIds lists subscriptions approved automatically. The partner only needs to find the service, with manual approval."]},{"label":"Box 3","options":["autoApprovalSubscriptionIds","visibilitySubscriptionIds"],"why":["Correct: auto-approval lists the subscriptions whose connection requests are approved automatically, as required for the trusted subscription.","Incorrect: visibilitySubscriptionIds only controls who can locate the service. It would not approve the trusted subscription connections automatically."]}],"answer":[0,0,0],"explanation":"Visibility decides who can find the service, auto-approval decides who needs no manual approval, and the load balancer frontend ties the service to the backend.","ref":"https://learn.microsoft.com/azure/private-link/private-link-service-overview"},{"id":"2.3.8-01","obj":"2.3.8","difficulty":"easy","type":"single","stem":"Woodgrove Bank must inspect outbound encrypted HTTPS traffic from its virtual networks for malware by using signature-based intrusion detection and TLS inspection.\n\nWhich Azure Firewall SKU should you deploy?","choices":["Premium","Standard","Basic","Azure Web Application Firewall on an Application Gateway"],"answer":[0],"explanation":"TLS inspection, IDPS and full URL filtering are Premium features. Standard and Basic cover rules, threat intelligence and web categories at lower tiers.","rationale":["Correct: Azure Firewall Premium adds TLS inspection, signature-based IDPS and URL filtering, which are needed to decrypt and inspect outbound encrypted traffic.","Incorrect: Azure Firewall Standard offers threat intelligence in alert and deny mode, DNS proxy and web categories, but it has no TLS inspection and no IDPS.","Incorrect: Azure Firewall Basic targets small workloads and has threat intelligence in alert mode only. It has neither TLS inspection nor IDPS.","Incorrect: Azure Web Application Firewall protects inbound web applications at an Application Gateway or Front Door. It does not inspect outbound traffic from virtual networks."],"ref":"https://learn.microsoft.com/azure/networking/design-guide/azure-firewall"},{"id":"2.3.8-02","obj":"2.3.8","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. must publish an internal web server on TCP 443 through the public IP address of Azure Firewall. Inbound internet clients must reach the server at its private IP address.\n\nWhich rule type should you create?","choices":["DNAT rule","Network rule","Application rule","Threat intelligence rule"],"answer":[0],"explanation":"DNAT rules publish internal services through firewall public IPs. Application rules are not applied to inbound traffic, so inbound HTTP/S filtering belongs to a web application firewall.","rationale":["Correct: A DNAT rule translates inbound traffic from a firewall public IP and port to a private IP and port, and it implicitly allows the translated traffic.","Incorrect: A network rule filters by source, destination, port and protocol. It does not translate the destination address, so clients could not reach the private server through the public IP.","Incorrect: Application rules filter outbound and east-west traffic by FQDN or URL. They are not applied to inbound connections, so they cannot publish a server.","Incorrect: Threat intelligence filtering alerts on or blocks traffic to and from known malicious addresses. It does not publish services."],"ref":"https://learn.microsoft.com/azure/firewall/rule-processing"},{"id":"2.3.8-03","obj":"2.3.8","difficulty":"medium","type":"single","stem":"Litware, Inc. must let workload VMs reach only https://updates.contoso.example and block all other internet destinations. The IP addresses of the update site change frequently.\n\nWhat should you add to the Azure Firewall policy?","choices":["An application rule that allows the FQDN on HTTPS","A network rule that allows the current IP addresses on TCP 443","A DNAT rule that translates TCP 443 to the update site","An IDPS signature rule in Alert mode"],"answer":[0],"explanation":"Use application rules for FQDN-based outbound filtering. Network rules work on IP, port and protocol, and the firewall denies traffic that no rule allows.","rationale":["Correct: Application rules filter outbound HTTP and HTTPS by FQDN, so the rule keeps working when the IP addresses of the site change. The default deny blocks other destinations.","Incorrect: A network rule matches IP addresses, so every address change breaks access and requires a rule update. Use it when destinations have stable addresses.","Incorrect: DNAT rules handle inbound connections to the firewall public IP. They do not control outbound access from VMs to an internet site.","Incorrect: IDPS signatures detect attack patterns in traffic. An Alert mode rule does not allow or block destinations, so it cannot enforce an allow list."],"ref":"https://learn.microsoft.com/azure/firewall/policy-rule-sets"},{"id":"2.3.8-04","obj":"2.3.8","difficulty":"medium","type":"single","stem":"Relecloud has an Azure Firewall policy with a network rule collection at priority 500 that allows TCP 443 from the workload subnet to any destination. An application rule collection at priority 100 denies a web category, but users still reach sites in that category.\n\nWhat should you do?","choices":["Narrow the network rule so that it does not allow all HTTPS destinations","Lower the priority number of the application rule collection to 50","Move the application rule collection to a parent policy","Enable IDPS in Alert and deny mode"],"answer":[0],"explanation":"Azure Firewall evaluates rule types in a fixed order: DNAT, network, then application. A broad network allow therefore hides later application deny rules.","rationale":["Correct: The firewall processes DNAT rules, then network rules, then application rules regardless of priority. The broad network allow matches first and ends processing, so the application deny is never reached.","Incorrect: Priority orders collections of the same rule type. Application rules are always processed after network rules, so a smaller number does not change the outcome.","Incorrect: Parent policy rule collection groups take precedence over child groups, but the processing order of rule types still applies. Application rules still come after network rules.","Incorrect: IDPS inspects traffic after rule matching to find attack signatures. It does not enforce web category policy, so the category would stay reachable."],"ref":"https://learn.microsoft.com/azure/firewall-manager/rule-processing"},{"id":"2.3.8-05","obj":"2.3.8","difficulty":"hard","type":"multi","stem":"Contoso, Ltd. has an Azure Firewall Premium policy and must enable TLS inspection for outbound traffic from workload VMs.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Store an intermediate CA certificate in Azure Key Vault and give the firewall managed identity Get and List permissions on secrets","Deploy the CA certificate to the trusted certificate store of the workload VMs","Set threat intelligence to Alert and deny mode","Enable DNS proxy in the firewall policy","Create a DNAT rule for TCP 443"],"answer":[0,1],"explanation":"TLS inspection needs a CA certificate that the firewall can read from Key Vault and that clients trust. Other firewall features are independent settings.","rationale":["Correct: The firewall uses an intermediate CA certificate to generate certificates for inspected connections. It reads it through the Key Vault secret interface by using a managed identity.","Correct: Clients see certificates that the firewall generates with its CA. Without trust in that CA in their store, TLS connections show trust errors or fail.","Incorrect: Threat intelligence filters known malicious addresses and domains. It is a separate setting and is not needed to enable TLS inspection.","Incorrect: DNS proxy helps FQDN rule resolution. It is not a prerequisite for TLS inspection.","Incorrect: A DNAT rule publishes inbound services. TLS inspection applies to outbound and east-west traffic and is enabled on application rules."],"ref":"https://learn.microsoft.com/azure/firewall/premium-certificates"},{"id":"2.3.8-06","obj":"2.3.8","difficulty":"easy","type":"yesno","stem":"Tailspin Toys manages Azure Firewall through a firewall policy.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["DNAT rules are processed before network rules, and network rules before application rules.","Application rules filter inbound HTTP and HTTPS traffic from the internet.","Azure Firewall Basic supports threat intelligence in Alert and deny mode."],"answer":[0],"explanation":"Rule types run DNAT, network, application. Application rules are for outbound and east-west traffic, and Basic supports only alert mode for threat intelligence.","rationale":["Yes: The firewall evaluates rule types in the order DNAT, network and application, regardless of the priority numbers of collections.","No: Application rules are not applied to inbound connections. Use a web application firewall to filter inbound HTTP/S traffic.","No: Basic supports threat intelligence in alert mode only. Alert and deny mode requires Standard or Premium."],"ref":"https://learn.microsoft.com/azure/firewall/rule-processing"},{"id":"2.3.8-07","obj":"2.3.8","difficulty":"medium","type":"dragdrop","stem":"Fabrikam, Inc. is configuring an Azure Firewall Premium policy.\n\nWhich feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.","choices":["Network rule","Application rule","IDPS","DNAT rule"],"targets":["Requirement 1: allow UDP 123 from a subnet to the IP address of a time server","Requirement 2: allow outbound HTTPS to a list of FQDNs","Requirement 3: block traffic that matches known attack signatures"],"answer":[0,1,2],"rationale":["UDP 123 to a known IP address is a layer 3 and 4 decision, which a network rule expresses with source, destination, port and protocol.","Outbound HTTPS by FQDN is a layer 7 decision, which an application rule handles without tracking IP addresses.","Signature-based detection and blocking of attack patterns is done by the IDPS in Premium, in Alert and deny mode."],"notes":["Filters by source and destination IP, port and protocol. Use it for non-HTTP traffic such as NTP or SQL between subnets.","Filters outbound and east-west traffic by FQDN, URL or web category. Use it when destination addresses change.","Signature-based intrusion detection and prevention in Premium. Use Alert and deny mode to block matching traffic.","Translates inbound traffic from a firewall public IP to a private address. Use it to publish internal services, not for these requirements."],"explanation":"Choose by layer and purpose: network rules for IP, port and protocol, application rules for FQDNs and URLs, and IDPS for signature-based inspection.","ref":"https://learn.microsoft.com/azure/firewall/premium-features"},{"id":"2.3.8-08","obj":"2.3.8","difficulty":"hard","type":"order","stem":"Woodgrove Bank has an Azure Firewall Premium instance with a user-assigned managed identity, and a firewall policy. The company must inspect outbound HTTPS traffic of the workload subnet by using TLS inspection.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Store the intermediate CA certificate in an Azure Key Vault.","Grant the managed identity Get and List permissions on the secrets of the Key Vault.","Enable TLS inspection in the firewall policy and select the managed identity and the certificate.","Enable TLS inspection on the application rule that allows the outbound HTTPS traffic.","Set IDPS to Alert mode in the firewall policy.","Create a DNAT rule collection for TCP 443."],"answer":[0,1,2,3],"explanation":"TLS inspection is built from the certificate, then access for the identity, then policy-level configuration, and finally the application rules that opt in.","rationale":["Step 1: the certificate must exist in a vault before access can be granted or selected in the policy, so it is stored first.","Step 2: the firewall reads the certificate through the secret interface by using the managed identity, so the identity needs Get and List on secrets in the vault.","Step 3: the policy needs the identity and the certificate. With access granted, the firewall can retrieve it, and the setting is stored at policy level.","Step 4: TLS inspection is enabled per application rule, and the rule relies on the policy-level certificate configured in the previous step.","Incorrect: IDPS in Alert mode is an independent setting. It can use decrypted traffic later, but it is not a step to enable TLS inspection.","Incorrect: A DNAT rule collection publishes inbound services and does not enable inspection of outbound HTTPS traffic."],"ref":"https://learn.microsoft.com/azure/firewall/premium-certificates"},{"id":"2.3.9-01","obj":"2.3.9","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has VM1 with a network interface and a subnet that each have an NSG. An administrator must see the aggregate of all security rules that apply to the network interface of VM1.\n\nWhich Network Watcher tool should you use?","choices":["Effective security rules","Next hop","Packet capture","Connection troubleshoot"],"answer":[0],"explanation":"Effective security rules gives the combined view of NIC-level and subnet-level NSG rules. Other Network Watcher tools target routing, capture or connectivity.","rationale":["Correct: Effective security rules shows all rules that apply to a network interface, including rules from the NIC NSG, the subnet NSG, and the aggregate of both.","Incorrect: Next hop reports the next hop type and IP address for a destination, which diagnoses routing problems. It does not list security rules.","Incorrect: Packet capture records packets on a VM for deep analysis. It does not show which security rules apply to the interface.","Incorrect: Connection troubleshoot runs a one-time connectivity and latency check between endpoints. It does not list the security rules in effect."],"ref":"https://learn.microsoft.com/azure/network-watcher/network-watcher-overview"},{"id":"2.3.9-02","obj":"2.3.9","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has users who cannot connect to VM1 by using RDP on TCP 3389. An administrator must find out whether a security rule denies the traffic and which rule does so.\n\nWhich Network Watcher tool should you use?","choices":["IP flow verify","Next hop","VPN troubleshoot","Connection monitor"],"answer":[0],"explanation":"IP flow verify tests a specific flow against the security rules of a VM and names the rule that allows or denies it.","rationale":["Correct: IP flow verify checks whether a packet is allowed or denied to or from a VM and returns the name of the rule that made the decision, plus the NSG that contains it.","Incorrect: Next hop diagnoses routing by returning the next hop type and address. It does not evaluate security rules, so it would not name a denying rule.","Incorrect: VPN troubleshoot runs diagnostics on VPN gateways and connections. The problem here is a possible NSG rule on a VM, not a gateway.","Incorrect: Connection monitor tracks connectivity and latency over time between endpoints. It does not return the security rule that allows or denies a given flow."],"ref":"https://learn.microsoft.com/azure/network-watcher/ip-flow-verify-overview"},{"id":"2.3.9-03","obj":"2.3.9","difficulty":"medium","type":"single","stem":"Litware, Inc. runs an Application Gateway v2 and a virtual machine scale set. A network engineer must test whether ICMP traffic from the service tag VirtualNetwork is allowed to the scale set network interfaces, and be able to add a higher-priority rule from the same tool if needed.\n\nWhich Network Watcher tool should you use?","choices":["NSG diagnostics","IP flow verify","Effective security rules","Next hop"],"answer":[0],"explanation":"NSG diagnostics extends flow testing to scale sets, Application Gateway v2, ICMP, service tags and prefixes, while IP flow verify is limited to TCP and UDP on a VM NIC.","rationale":["Correct: NSG diagnostics supports virtual machines, scale set network interfaces and Application Gateway v2, accepts IP addresses, prefixes or service tags, tests ICMP, and can add a higher-priority rule.","Incorrect: IP flow verify tests TCP and UDP rules only and works on the network interface of a VM. It cannot test ICMP or scale set rules, so it does not meet the requirement.","Incorrect: Effective security rules lists the rules that apply to a NIC, but it does not simulate a specific flow with a result or offer to add a rule from the test.","Incorrect: Next hop is a routing tool. It reports where traffic goes and does not evaluate security rules for ICMP."],"ref":"https://learn.microsoft.com/azure/network-watcher/nsg-diagnostics-overview"},{"id":"2.3.9-04","obj":"2.3.9","difficulty":"medium","type":"single","stem":"Relecloud uses Azure Virtual Network Manager. Traffic to VM1 on TCP 443 fails although the NSGs at the subnet and NIC level allow it. The team suspects a security admin rule that is applied to the virtual network.\n\nWhich Network Watcher tool should you use to identify the rule that denies a TCP flow to the network interface of VM1?","choices":["IP flow verify","Next hop","Packet capture","Connection monitor"],"answer":[0],"explanation":"IP flow verify evaluates both NSG rules and Azure Virtual Network Manager security admin rules for a flow, so it can expose an admin Deny that NSGs do not show.","rationale":["Correct: IP flow verify checks the NSG rules on the network interface and the Azure Virtual Network Manager admin rules applied to the virtual network, and it returns the rule that allows or denies the flow.","Incorrect: Next hop returns routing information and does not evaluate any security rules, so it cannot name a denying security admin rule.","Incorrect: Packet capture shows packets on the VM and could confirm that traffic does not arrive, but it does not tell you which rule dropped it.","Incorrect: Connection monitor measures reachability and latency between endpoints over time. It shows that the connection fails but not which rule causes it."],"ref":"https://learn.microsoft.com/azure/network-watcher/ip-flow-verify-overview"},{"id":"2.3.9-05","obj":"2.3.9","difficulty":"hard","type":"multi","stem":"Tailspin Toys must identify which security rule denies a specific TCP flow to VM1, and must also export all inbound and outbound rules that are in effect on the VM1 network interface to a CSV file for an audit.\n\nWhich two Network Watcher tools should you use? Each correct answer presents part of the solution.","choices":["IP flow verify","Effective security rules","Next hop","Packet capture","Connection troubleshoot"],"answer":[0,1],"explanation":"Use IP flow verify to name the rule that decides a flow, and effective security rules to see and export the full set of rules in effect on a NIC.","rationale":["Correct: IP flow verify tests the TCP flow and returns the rule and NSG that deny it.","Correct: Effective security rules shows the rules in effect on the NIC and lets you download them as a CSV file for audit documentation.","Incorrect: Next hop reports routing information, which cannot identify a denying security rule or list rules for audit.","Incorrect: Packet capture records traffic for analysis, but it neither names the rule that denies a flow nor exports rules.","Incorrect: Connection troubleshoot checks connectivity and latency between endpoints. It does not export the rules or name the denying rule."],"ref":"https://learn.microsoft.com/azure/network-watcher/secure-network-watcher"},{"id":"2.3.9-06","obj":"2.3.9","difficulty":"easy","type":"yesno","stem":"Woodgrove Bank troubleshoots traffic filtering in Azure by using Azure Network Watcher.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["IP flow verify can test ICMP rules.","NSG diagnostics can check security rules for a virtual machine scale set network interface.","IP flow verify returns the name of the security rule that allows or denies the traffic."],"answer":[1,2],"explanation":"IP flow verify covers TCP and UDP on a VM NIC and names the deciding rule. NSG diagnostics adds ICMP, scale sets and Application Gateway v2.","rationale":["No: IP flow verify tests only TCP and UDP rules. Use NSG diagnostics to test ICMP traffic rules.","Yes: NSG diagnostics supports virtual machines, network interfaces, scale set network interfaces and Application Gateway v2.","Yes: The result includes access allowed or denied, the rule name and the NSG, with a link unless a default rule decided."],"ref":"https://learn.microsoft.com/azure/network-watcher/nsg-diagnostics-overview"},{"id":"2.3.9-07","obj":"2.3.9","difficulty":"medium","type":"dragdrop","stem":"Fabrikam, Inc. is troubleshooting network security rules in Azure.\n\nWhich Network Watcher tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once, more than once, or not at all.","choices":["IP flow verify","NSG diagnostics","Effective security rules","Next hop"],"targets":["Task 1: test a TCP flow with a specified local port and remote port against the rules of one VM network interface","Task 2: test ICMP traffic from an IP prefix to the network interfaces of a scale set","Task 3: view the aggregate of subnet NSG and NIC NSG rules on a network interface"],"answer":[0,1,2],"rationale":["IP flow verify takes direction, protocol, local and remote IP addresses and ports for one VM interface and returns the deciding rule.","NSG diagnostics supports ICMP, IP prefixes and scale set network interfaces, which IP flow verify does not.","Effective security rules lists the rules from both the subnet NSG and the NIC NSG and their aggregate for a network interface."],"notes":["Checks a TCP or UDP flow with ports against a VM NIC and names the rule. Use it for quick per-VM allow or deny answers.","Simulates flows to VMs, NICs, scale set NICs and Application Gateway v2 with ICMP, prefixes and service tags. Use it for broader targets.","Shows all rules applied to a NIC, from NIC and subnet NSGs. Use it for audit and to spot conflicting NSGs.","Shows the routing next hop for a destination. Use it to diagnose routes, not security rules."],"explanation":"Match by scope: IP flow verify for one VM flow with ports, NSG diagnostics for ICMP and wider targets, effective security rules for the combined rule list.","ref":"https://learn.microsoft.com/azure/network-watcher/network-watcher-overview"},{"id":"2.3.9-08","obj":"2.3.9","difficulty":"hard","type":"dropdown","stem":"Contoso, Ltd. must test whether an RDP connection from 203.0.113.10 on source port 60000 to VM1 at 10.0.0.4 is allowed by the security rules of the VM1 network interface.\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.\n\n```azurecli\naz network watcher test-ip-flow \\\n  --direction [[1]] \\\n  --protocol [[2]] \\\n  --local 10.0.0.4:[[3]] \\\n  --remote 203.0.113.10:60000 \\\n  --vm VM1 --resource-group rg1 --out table\n```","targets":[{"label":"Box 1","options":["Inbound","Outbound"],"why":["Correct: the client connects to the VM from 203.0.113.10, so the packet is inbound to the VM and inbound security rules are tested.","Incorrect: Outbound would test rules for traffic that VM1 sends to 203.0.113.10, which is the reverse of the scenario."]},{"label":"Box 2","options":["TCP","UDP"],"why":["Correct: RDP uses TCP port 3389, and IP flow verify tests TCP and UDP rules, so TCP is the protocol to test.","Incorrect: UDP would test a different protocol than the RDP connection uses. Use it for flows such as DNS or NTP."]},{"label":"Box 3","options":["3389","22","443"],"why":["Correct: 3389 is the RDP port, and the local port is the port on VM1 that the client connects to.","Incorrect: 22 is the SSH port. Testing it would not show whether the RDP connection is allowed.","Incorrect: 443 is the HTTPS port and has no relation to the RDP connection that is being tested."]}],"answer":[0,0,0],"explanation":"IP flow verify takes the direction, protocol, local IP and port, and remote IP and port. For a client RDP connection, test inbound TCP with the VM port set to 3389.","ref":"https://learn.microsoft.com/troubleshoot/azure/virtual-network/virtual-network-troubleshoot-nsg-blocking-traffic"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. is preparing to roll out Microsoft 365 Copilot. The administrator needs a tenant-wide snapshot that shows how many users have permissions to each SharePoint site, so that the exposure of site content to Copilot can be assessed.\n\nWhich data access governance report should you run?","choices":["The site permissions report (permission state snapshot)","The sharing links activity report for the last 28 days","The Everyone except external users report for active sites","The change history report for SharePoint site settings"],"answer":[0],"explanation":"The site permissions report is a snapshot of the unique number of users who have permissions to every SharePoint and OneDrive site. Copilot respects permissions, so the number of permissioned users shows the exposure of each site.","rationale":["Correct: the site permission state report is a snapshot of the whole organization and shows how many users can access each site, which is the baseline for judging Copilot exposure.","Incorrect: the sharing links activity report lists sites where users created the most links in the last 28 days. It is an activity report, not a permission snapshot. Use it to find hot spots of new link creation.","Incorrect: the EEEU report lists the top 100 sites where content was shared with the whole organization in the past 28 days. It does not count permissioned users for every site. Use it for org-wide sharing.","Incorrect: the change history report shows changes made to sites or organization settings. It says nothing about who has access today. Use it to audit administrative changes."],"ref":"https://learn.microsoft.com/microsoft-365/copilot/get-ready-copilot-sharepoint-advanced-management"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. stores board documents on a SharePoint site named Site1. The members of Site1 must keep their current access, and the site permissions must not change. However, the content of Site1 must stop surfacing in Microsoft 365 Copilot and in organization-wide search for users who are not recent contributors.\n\nWhich SharePoint Advanced Management capability should you configure for Site1?","choices":["Restricted content discovery turned on for Site1","Restricted access control with a Microsoft Entra security group","A site access review sent to the owners of Site1","An inactive sites policy with automatic archiving of Site1"],"answer":[0],"explanation":"Restricted content discovery keeps content accessible but prevents it from being broadly discoverable in Copilot and organization-wide search, and it leaves permissions unchanged.","rationale":["Correct: restricted content discovery hides the site from Copilot and org-wide search while the site permissions stay as they are, which matches both constraints in the stem.","Incorrect: restricted access control changes who can open the site by limiting access to members of a group. The stem says permissions must not change. Use it when access itself must be narrowed.","Incorrect: a site access review delegates the review of overshared data to the site owners. It does not hide the site from Copilot by itself. Use it to ask owners to clean up permissions.","Incorrect: an inactive sites policy detects and archives sites that are not used. Site1 is active and must stay available to its members. Use it for lifecycle cleanup of stale sites."],"ref":"https://learn.microsoft.com/microsoft-365/copilot/get-ready-copilot-sharepoint-advanced-management"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"hard","type":"multi","stem":"Woodgrove Bank wants to reduce the risk of Microsoft 365 Copilot returning content from sites that are exposed through 'Anyone' links. The security team must first identify the sites where users created the most sharing links during the last 28 days, and then have the owners of those sites review the exposure. Site permissions and discoverability must not be changed in this step.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Run the sharing links activity report in data access governance.","Send a site access review to the owners of the overshared sites.","Turn on restricted content discovery for all active sites.","Run the site permissions baseline report for every OneDrive site.","Create an inactive sites policy that archives unused sites."],"answer":[0,1],"explanation":"The sharing links activity report shows which sites have the most Anyone, organization and specific-people links in the last 28 days. A site access review then delegates the review of that report to the site owners.","rationale":["Correct: the sharing links activity report lists the sites with the highest number of links by type in the last 28 days, which identifies the sites the stem asks for.","Correct: a site access review lets you send the findings of a data access governance report to the owners of overshared sites so that they review and fix the exposure.","Incorrect: restricted content discovery changes discoverability, and the stem says discoverability must not change in this step. Use it later for sites that must stay accessible but hidden.","Incorrect: the site permissions baseline report is a snapshot of permissioned users, not of link creation in the last 28 days. Use it to size overall exposure, not to find new links.","Incorrect: an inactive sites policy archives sites that nobody uses. Sites with fresh sharing links are active, so the policy does not address the exposure. Use it to reduce content sprawl."],"ref":"https://learn.microsoft.com/microsoft-365/copilot/get-ready-copilot-sharepoint-advanced-management"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"hard","type":"yesno","stem":"Litware, Inc. runs the following command to start a data access governance report for SharePoint sites:\n\n```powershell\nStart-SPODataAccessGovernanceInsight -ReportEntity PermissionedUsers -ReportType Snapshot -Workload SharePoint -CountOfUsersMoreThan 0 -Name \"OrgWidePermissionedUsersReportSharePoint\"\n```\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The report shows the status of the whole organization as of the report generation date.","The administrator can create a second SharePoint workload report of this type at the same time.","The first report of this type can take up to five days to complete."],"answer":[0,2],"explanation":"A snapshot report covers the entire tenant at generation time. You can create up to two such reports, one per workload, and the first one can take up to five days.","rationale":["Yes: the permission state report is a snapshot report that gives the latest status of the entire organization as of the generation date.","No: you can create up to two of these comprehensive reports, one per workload. A second report for the SharePoint workload is not allowed; the other slot is for OneDrive for Business.","Yes: the first report always takes up to five days to complete regardless of tenant size. Later reports complete within 24 hours and can be rerun every 30 days."],"ref":"https://learn.microsoft.com/sharepoint/powershell-for-data-access-governance"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys plans to adopt Microsoft 365 Copilot. The security administrator needs Microsoft Purview to identify potential oversharing in the SharePoint sites that are used the most, without configuring anything first.\n\nWhich Data Security Posture Management capability should you review?","choices":["The default data risk assessments","The AI observability inventory of agents","The activity explorer AI activities tab","The asset explorer standard tab"],"answer":[0],"explanation":"Data risk assessments identify and help fix oversharing. A default assessment runs weekly for the top 100 SharePoint sites by usage without any setup.","rationale":["Correct: default data risk assessments run automatically each week for the top 100 SharePoint sites based on usage, so oversharing results are available without configuration.","Incorrect: AI observability inventories AI apps and agents with recent activity and their risk. It does not assess oversharing of SharePoint sites. Use it to see which agents are high risk.","Incorrect: the AI activities tab of activity explorer shows individual events such as prompts and sensitive information matches. It is not an oversharing assessment. Use it to investigate AI interactions.","Incorrect: the asset explorer standard tab shows labeled and unlabeled data by workload. It does not score oversharing of the busiest sites. Use it to see label coverage of data."],"ref":"https://learn.microsoft.com/purview/data-security-posture-management-oversharing"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"easy","type":"single","stem":"Litware, Inc. uses Microsoft 365 Copilot, Copilot Studio agents and several third-party AI apps. The compliance team needs one inventory of AI apps and agents with activity in the last 30 days that shows how many are high risk and how many had sensitive interactions.\n\nWhich Microsoft Purview capability should you use?","choices":["AI observability in Data Security Posture Management","Data risk assessments in Data Security Posture Management","Reports for sensitivity label usage in Data Security Posture Management","Activity explorer for DLP rule matches in Data Security Posture Management"],"answer":[0],"explanation":"AI observability provides an inventory of AI apps and agents with recent activity, shows how many are high risk, and breaks down agents and the policies that govern them.","rationale":["Correct: AI observability lists AI apps and agents active in the last 30 days, with counts of high-risk ones and of those with sensitive interactions, plus the policies that govern each agent.","Incorrect: data risk assessments scan SharePoint sites and Fabric workspaces for oversharing. They do not inventory AI apps or agents. Use them to find overshared data.","Incorrect: reports track sensitivity label usage, policy coverage and risky behavior over time. They are not an inventory of AI apps and agents with a risk count. Use them for trend reporting.","Incorrect: activity explorer lists individual events such as DLP rule matches and AI interactions. It does not summarize the number of risky agents. Use it to investigate specific events."],"ref":"https://learn.microsoft.com/purview/data-security-posture-management-application-card"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"medium","type":"dragdrop","stem":"Contoso, Ltd. uses Microsoft Purview Data Security Posture Management to reduce AI-related data risks. You must select a capability for each requirement.\n\nWhich capability should you use for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once, more than once, or not at all.","choices":["Activity explorer","Custom data risk assessment with item-level scanning","AI observability","Asset explorer"],"targets":["Requirement 1: review the prompts and responses of AI interactions and see whether they contained sensitive information","Requirement 2: find SharePoint items that have external or anonymous sharing links and notify the site owner","Requirement 3: see how many agents with recent activity are high risk"],"answer":[0,1,2],"rationale":["Requirement 1 needs event-level detail of AI interactions, which the AI activities view of activity explorer provides when you have the right permissions.","Requirement 2 needs item-level results and remediation, which a custom assessment with item-level scanning provides for SharePoint, including a notify action for the site owner.","Requirement 3 needs an agent inventory with a risk count, which AI observability provides for apps and agents with recent activity."],"notes":["Shows content-related events such as AI interactions, prompts, responses and DLP matches. Use it to investigate individual events.","A custom scan that, with item-level scanning and an Entra application, lists potentially overshared SharePoint items and lets you resolve, label or notify.","Inventory of AI apps and agents with activity in the last 30 days, with risk counts and governing policies. Use it to monitor agent risk.","Shows unlabeled or classified data by workload, with a Standard and an Agent tab. Use it for label coverage, not for AI interactions or sharing links."],"explanation":"Match the need to the scope of each capability: events for activity explorer, items for item-level assessments, agent inventory for AI observability.","ref":"https://learn.microsoft.com/purview/dspm-for-ai"},{"id":"3.1.2-04","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Woodgrove Bank created a custom data risk assessment for the SharePoint sites of the finance department. The assessment shows site-level oversharing, but the security team must also identify individual items that have external or anonymous sharing links, apply a sensitivity label to unlabeled items, and notify the site o
