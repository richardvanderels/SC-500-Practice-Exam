actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In Environment settings, select Add environment > Amazon Web Services and enter the connector name, account type, regions and AWS account ID","Select the Defender plans to enable, including Defender CSPM","Select the permissions type and the AWS CloudFormation deployment method, and download the template","Create the CloudFormation stack in AWS by using the downloaded template","Select Review and generate, and then select Create","Install the Azure Arc agent manually on every EC2 instance in the account","Create a Log Analytics workspace and install the Azure Monitor agent on the instances"],"answer":[0,1,2,3,4],"explanation":"The wizard collects account details, then plans, then access configuration. The template produced by the access step depends on the selected plans, so it is deployed in AWS before you review and create the connector.","rationale":["Step 1: the connector wizard starts in Environment settings, where you name the connector and identify the AWS account and regions.","Step 2: the plans you choose determine which permissions the template must grant, so plans come before the access step.","Step 3: the template content depends on the chosen plans and the permissions type, so you download it after the selection.","Step 4: the stack creates the IAM role that Defender for Cloud assumes. It must exist in AWS before the connector can validate access.","Step 5: after the stack is deployed you review the settings and create the connector so scanning starts.","Incorrect: the connector handles Azure Arc deployment through autoprovisioning for the plans that need it. Manual installation on every instance is unnecessary. Use manual Arc onboarding for machines outside connectors.","Incorrect: a Log Analytics workspace and Azure Monitor agent are not part of the native AWS connector setup for Defender CSPM. Use them for other collection scenarios such as Sentinel."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/quickstart-onboard-aws"},{"id":"4.1.4-06","obj":"4.1.4","difficulty":"hard","type":"multi","stem":"Tailspin Toys onboards a GCP organization that was created after May 2024. The deployment script that Defender for Cloud generated fails when it assigns IAM permissions to service accounts. The error indicates that the Domain Restricted Sharing organization policy blocks identities outside the GCP organization.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Add the Defender for Cloud principal to the allowed principals of the Domain Restricted Sharing policy","Run the deployment script that Defender for Cloud generated again after the policy change propagates","Create a service account key and upload it to the connector","Enable Security Command Center premium tier on the GCP organization","Assign the Contributor role on the Azure subscription to the GCP service account"],"answer":[0,1],"explanation":"Domain Restricted Sharing blocks IAM bindings for principals outside the organization, which breaks the generated script. Allowing the Defender for Cloud principal and then rerunning the script resolves it, without long-lived credentials.","rationale":["Correct: allowing the Defender for Cloud principal set in the policy removes the block on the IAM bindings that the script creates for the workload identity.","Correct: the script must run again after the policy change takes effect, because the earlier run failed before it created the required resources.","Incorrect: the connector does not use service account keys. It uses workload identity federation, and a key does not remove the policy block on IAM bindings.","Incorrect: Security Command Center is a native GCP service. Its tier has no effect on the organization policy that blocks the script.","Incorrect: the Contributor role on the Azure subscription is the permission of the person who creates the connector. It does not change GCP policies."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/resolve-gcp-sharing-policy"},{"id":"4.1.5-01","obj":"4.1.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. enables Defender for Servers Plan 1 on a subscription that contains Azure VMs. The security team wants to know how Microsoft Defender Vulnerability Management scans those VMs.\n\nWhich scanning method should you expect to apply to the VMs?","choices":["Agentless scanning of the VM disk snapshots each day","Agent-based scanning by the Defender for Endpoint sensor","A Qualys scanner that you license and deploy separately","Azure Policy guest configuration assessments of the VM baseline"],"answer":[1],"explanation":"The Defender for Endpoint integration provides vulnerability scanning in Defender for Servers Plan 1 and Plan 2. Agentless scanning is available in Plan 2 (and Defender CSPM) only. BYOL scanners are an optional alternative.","rationale":["Incorrect: agentless scanning is available in Defender for Servers Plan 2 or Defender CSPM, not in Plan 1 alone. Choose Plan 2 when machines cannot run a sensor.","Correct: Plan 1 includes the Defender for Endpoint integration, so the sensor on the VMs performs the vulnerability scanning with Defender Vulnerability Management.","Incorrect: Qualys is a bring-your-own-license alternative that you deploy yourself. It is not what the integrated scanner uses. Use it when the organization already licenses Qualys.","Incorrect: guest configuration assesses operating system settings against baselines. It does not scan for software vulnerabilities. Use it for OS misconfiguration findings."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/auto-deploy-vulnerability-assessment"},{"id":"4.1.5-02","obj":"4.1.5","difficulty":"easy","type":"single","stem":"Contoso, Ltd. must scan Azure VMs for vulnerabilities without installing any agent on the VMs. The company wants to enable a single Defender for Cloud workload protection plan for this purpose and no posture plan.\n\nWhich plan should you enable?","choices":["Defender for Servers Plan 1","Defender for Storage","Defender for Servers Plan 2","Defender for App Service"],"answer":[2],"explanation":"Agentless vulnerability scanning is part of agentless machine scanning, which is available in Defender for Servers Plan 2 and in the Defender CSPM plan. Plan 1 relies on the Defender for Endpoint sensor.","rationale":["Incorrect: Plan 1 scans through the Defender for Endpoint sensor, which is an agent. Use Plan 1 when sensor-based scanning is acceptable and cost matters.","Incorrect: Defender for Storage protects storage accounts and does not scan VMs. Use it to detect storage threats and scan uploaded blobs.","Correct: Plan 2 provides agentless vulnerability scanning through Defender Vulnerability Management, so no agent is needed on the VMs.","Incorrect: Defender for App Service protects web apps against threats. It does not assess VM vulnerabilities. Use it for App Service plans."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-agentless-data-collection"},{"id":"4.1.5-03","obj":"4.1.5","difficulty":"medium","type":"single","stem":"Litware, Inc. licenses both Qualys and Rapid7 vulnerability scanners. The security team wants Defender for Cloud to show vulnerability findings for Azure VMs and asks whether both partner scanners can be deployed through Defender for Cloud.\n\nWhat should you recommend?","choices":["Deploy both scanners and merge their results in the recommendations","Deploy Qualys on Windows VMs and Rapid7 on Linux VMs","Deploy both scanners and disable the integrated Defender Vulnerability Management","Choose one BYOL scanner, because Defender for Cloud supports a single non-Microsoft scanner"],"answer":[3],"explanation":"Defender for Cloud supports one bring-your-own-license scanner at a time, either Qualys or Rapid7. Multiple non-Microsoft scanners are not supported. The integrated Defender Vulnerability Management scanner is the Microsoft alternative.","rationale":["Incorrect: Defender for Cloud does not merge results from several non-Microsoft scanners, because only one BYOL solution is supported.","Incorrect: splitting the scanners by operating system still deploys two non-Microsoft solutions, which is not supported. One scanner covers every supported OS.","Incorrect: disabling the integrated scanner does not make two partner scanners supported. The limit is on non-Microsoft scanners, not on the integrated one.","Correct: a single BYOL scanner is supported, so the team must choose either Qualys or Rapid7, or use the integrated Defender Vulnerability Management scanner."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/faq-defender-for-servers"},{"id":"4.1.5-04","obj":"4.1.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank has Defender for Servers Plan 2 with agentless scanning turned on. VM1 also runs the Defender for Endpoint sensor, and both scanning methods report findings for VM1.\n\nWhich vulnerability results should you expect Defender for Cloud to show for VM1?","choices":["Agent-based results only, for better data freshness","Agentless results only, because agentless scanning has priority","A merged list of agent-based and agentless findings","The results of the most recent scan of either method"],"answer":[0],"explanation":"Machines that use only one method show results from that method. Machines that use both show agent-based results only, because they are fresher. Agentless scanning runs once every 24 hours.","rationale":["Correct: for machines that are scanned by both methods, Defender for Cloud shows the agent-based results to give better freshness.","Incorrect: agentless scanning runs on a 24-hour schedule, so its data is less fresh. It supplies the results only for machines without the sensor.","Incorrect: results are not merged. A machine with both methods shows one source, the agent-based one, to avoid duplicate or stale findings.","Incorrect: Defender for Cloud does not pick the newest scan per machine. The rule is fixed: agent-based results take precedence when both exist."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/auto-deploy-vulnerability-assessment#hybrid-scanning-behavior"},{"id":"4.1.5-05","obj":"4.1.5","difficulty":"hard","type":"order","stem":"Adatum Corporation must enable agentless vulnerability scanning for the Azure VMs in a subscription and then review the findings. The plan is currently off, and the Plan 2 commands use the Azure CLI.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["`az security pricing create --name VirtualMachines --tier Standard --subplan P2`","In the Defender for Servers plan settings, confirm that Agentless scanning for machines is turned on","In Recommendations, open the Vulnerabilities recommendations and review the findings by resource","`az security pricing create --name VirtualMachines --tier Standard --subplan P1`","`az security pricing create --name CloudPosture --tier Free`"],"answer":[0,1,2],"explanation":"The plan must be on at Plan 2 before its agentless setting can be managed. Scanning then runs and produces findings that you review under Recommendations.","rationale":["Step 1: Plan 2 enables Defender for Servers on the subscription and includes agentless scanning, so it must come first.","Step 2: agentless scanning is a setting of the enabled plan, so you confirm it after the plan exists.","Step 3: findings appear as vulnerability recommendations after scanning completes, so you review them last.","Incorrect: this command sets Plan 1, which does not include agentless scanning. Use it when sensor-based scanning is enough.","Incorrect: this command turns off the Defender CSPM plan, which is another source of agentless scanning, and does not enable the VM plan."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/enable-agentless-scanning-vms"},{"id":"4.1.5-06","obj":"4.1.5","difficulty":"hard","type":"yesno","stem":"Tailspin Toys uses Defender for Servers Plan 1 on one subscription and Plan 2 on another subscription. The security team plans how to use Microsoft Defender Vulnerability Management for Azure VMs.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The integrated scanner finds vulnerabilities on the network devices that connect the VMs.","Agentless scanning runs once every 24 hours on a schedule that you cannot configure.","Premium Defender Vulnerability Management capabilities such as certificate assessment are included in Plan 1."],"answer":[1],"explanation":"The integrated scanner finds vulnerabilities on the machine itself, not on the network. Agentless scanning uses a fixed 24-hour cycle. Premium Defender Vulnerability Management features belong to Plan 2.","rationale":["No: the integrated Defender Vulnerability Management scanner assesses only vulnerabilities on the machine itself. Use a network scanner for network devices.","Yes: agentless scanning runs once every 24 hours on a nonconfigurable schedule, so findings for agentless-only machines can be up to a day old.","No: premium capabilities such as certificate assessment and baseline assessment are part of Defender for Servers Plan 2, not Plan 1."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/auto-deploy-vulnerability-assessment"},{"id":"4.1.6-01","obj":"4.1.6","difficulty":"easy","type":"single","stem":"Contoso, Ltd. starts using Microsoft Defender External Attack Surface Management (Defender EASM). The security team provides known assets such as the domain contoso.com so that Defender EASM can find related internet-facing infrastructure.\n\nWhat should you provide as the starting point for discovery?","choices":["Inventory candidates","Discovery seeds","Attack surface insights","Data connections"],"answer":[1],"explanation":"Discovery seeds are known assets that belong to the organization. Defender EASM scans them recursively through observed connections to discover other infrastructure and compile the attack surface inventory.","rationale":["Incorrect: candidates are discovered assets that need manual approval before they join the inventory. They are results of discovery, not its input.","Correct: seeds are the known legitimate assets from which discovery starts, such as domains, IP blocks, hosts, email contacts and ASNs.","Incorrect: attack surface insights are dashboards that highlight risks by using vulnerability and infrastructure data. They are an output.","Incorrect: data connections export Defender EASM data to Log Analytics or Azure Data Explorer. They do not start discovery."],"ref":"https://learn.microsoft.com/azure/external-attack-surface-management/what-is-discovery"},{"id":"4.1.6-02","obj":"4.1.6","difficulty":"easy","type":"single","stem":"Northwind Traders uses Defender CSPM in Defender for Cloud. The security team wants Defender for Cloud to validate internet exposure of resources by contacting them from outside, without buying a separate Defender EASM license or configuring anything.\n\nWhich plan should you rely on?","choices":["Defender CSPM","Defender for Servers Plan 2","Foundational CSPM","Defender for APIs"],"answer":[0],"explanation":"The Defender EASM integration is included in the Defender CSPM plan by default and needs no separate license or configuration. Defender for Cloud uses outside-in data for internet exposure validation.","rationale":["Correct: Defender CSPM includes the integration with Defender EASM by default, which supplies outside-in exposure validation.","Incorrect: Defender for Servers Plan 2 protects machines and does not include the EASM integration. Use it for server vulnerability and endpoint protection.","Incorrect: Foundational CSPM is the free tier and lacks the Defender EASM integration. Upgrade to Defender CSPM to get it.","Incorrect: Defender for APIs protects API endpoints in API Management. It does not provide outside-in exposure discovery."],"ref":"https://learn.microsoft.com/azure/defender-for-cloud/concept-easm"},{"id":"4.1.6-03","obj":"4.1.6","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. acquired a subsidiary, Fabrikam Labs, whose domains are linked to the central infrastructure but that is managed by another company. The security team runs a Defender EASM discovery group and does not want the subsidiary assets to be added to the inventory.\n\nWhat should you do?","choices":["Remove the shared domain from the seeds","Set the recurrence of the discovery group to Never","Add the subsidiary entities as exclusions in the discovery group","Turn on the Recent only toggle on the asset details page"],"answer":[2],"explanation":"Discovery groups accept exclusions: entities that must not be added to the inventory even when they are detected, for example subsidiaries that connect to central infrastructure but belong to another organization.","rationale":["Incorrect: removing the shared seed would stop discovery of assets that the organization really owns. Use exclusions to filter specific entities instead.","Incorrect: a recurrence of Never runs discovery once. The subsidiary assets would still be discovered in that run.","Correct: exclusions prevent matching entities from being added to the inventory when discovery detects them.","Incorrect: the Recent only toggle limits the data displayed on an asset page to recent observations. It does not control which assets are added."],"ref":"https://learn.microsoft.com/azure/external-attack-surface-management/using-and-managing-discovery"},{"id":"4.1.6-04","obj":"4.1.6","difficulty":"medium","type":"single","stem":"Litware, Inc. reviews the results of a Defender EASM discovery run. Several assets show the status Candidate in the discovery information. The security team wants to include the assets that belong to the company in the inventory.\n\nWhat should you do?","choices":["Create a data connection that exports the inventory to Log Analytics","Change the discovery group recurrence to Weekly and rerun discovery","Add the candidate assets to the Quick Start list of attack surfaces","Review the candidates and approve the assets that the company owns"],"answer":[3],"explanation":"Candidate means that the connection between the seed and the asset was not strong enough for automatic approval. Candidates require manual review and approval before they join the approved inventory.","rationale":["Incorrect: a data connection exports inventory data to another tool. It does not approve candidates.","Incorrect: weekly recurrence only reruns discovery. The relationship stays weak and the assets stay candidates until someone approves them.","Incorrect: Quick Start searches prepopulated attack surfaces by organization name while you create a discovery group. It is not a list of approved assets.","Correct: candidates need manual approval, so reviewing and approving the owned assets adds them to the approved inventory."],"ref":"https://learn.microsoft.com/azure/external-attack-surface-management/understanding-asset-details"},{"id":"4.1.6-05","obj":"4.1.6","difficulty":"hard","type":"order","stem":"Relecloud has no Defender EASM resource. The security team must create the resource in the Azure portal, discover the company attack surface from a known domain, and then review the inventory.\n\nWhich five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a resource group in a supported region","Create a Defender EASM resource in the resource group","Add a discovery group and enter the known domain as a seed","Review the discovery group and select Create & Run","Review the new assets in the approved inventory","Deploy the Defender for Servers plan to the resource group","Create a data connection to Azure Data Explorer before the first discovery run"],"answer":[0,1,2,3,4],"explanation":"The EASM resource is created inside a resource group, discovery groups exist inside the resource, and inventory appears only after a discovery run completes.","rationale":["Step 1: the Defender EASM resource lives in a resource group, so the group must exist first, in a supported region.","Step 2: the workspace is created in the resource group and provides the portal where discovery is configured.","Step 3: a discovery group needs at least one seed such as the known domain, so you add it after the resource exists.","Step 4: reviewing and selecting Create & Run starts discovery from the seeds.","Step 5: after the run completes, discovered assets appear in the approved inventory for review.","Incorrect: Defender for Servers protects machines and is unrelated to creating an EASM resource or running discovery.","Incorrect: a data connection exports data after assets exist and is optional. It is not required before discovery and it needs permissions for the EASM API first."],"ref":"https://learn.microsoft.com/azure/external-attack-surface-management/deploying-the-defender-easm-azure-resource"},{"id":"4.1.6-06","obj":"4.1.6","difficulty":"hard","type":"multi","stem":"Tailspin Toys creates a Defender EASM discovery group. The security team wants to seed the discovery with assets that the company knows it owns. Defender EASM monitors the attack surface from an external perspective.\n\nWhich three items should you add as seeds? Each correct answer presents part of the solution.","choices":["The primary domain tailspintoys.com","A public IP address block that is registered to the company","The autonomous system number (ASN) of the company","The internal address range 10.0.0.0/8","The Microsoft Entra tenant ID of the company"],"answer":[0,1,2],"explanation":"Defender EASM accepts domains, IP blocks, hosts, email contacts, ASNs and Whois organizations as seeds. Because it monitors from outside, private IP addresses cannot be used as seeds.","rationale":["Correct: a domain is a supported seed type and a typical starting point for discovery.","Correct: public IP blocks are supported seeds, because they are externally visible infrastructure.","Correct: ASNs are supported seed types that let discovery find IP blocks that belong to the same network.","Incorrect: private IP ranges cannot be seeds, because Defender EASM sees the attack surface from the internet and cannot reach internal ranges.","Incorrect: a tenant ID is not a supported seed type. Seeds must be internet-visible assets such as domains, hosts, IP blocks, email contacts, ASNs or Whois organizations."],"ref":"https://learn.microsoft.com/azure/external-attack-surface-management/using-and-managing-discovery"},{"id":"4.2.1-01","obj":"4.2.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Log Analytics workspace named Workspace1. User1 has the Microsoft Sentinel Contributor role on the resource group that contains Workspace1. User1 must add Microsoft Sentinel to Workspace1 but receives an authorization error.\n\nWhich additional role should you assign to User1?","explanation":"Enabling Microsoft Sentinel on a workspace needs Contributor permissions on the subscription in which the workspace resides. Microsoft Sentinel Contributor and Reader roles apply to using Sentinel after it is enabled.","ref":"https://learn.microsoft.com/azure/sentinel/quickstart-onboard","choices":["Contributor on the subscription that contains Workspace1","Microsoft Sentinel Automation Contributor on the resource group","Log Analytics Reader on Workspace1","Security Reader on the subscription"],"answer":[0],"rationale":["Correct: Enabling Microsoft Sentinel on a workspace requires Contributor on the subscription. The Microsoft Sentinel Contributor role that User1 already has covers day-to-day use of Sentinel on the resource group, not the deployment step.","Incorrect: This is a service role that lets Microsoft Sentinel add playbooks to automation rules. It is not assigned to users and grants no right to enable Sentinel. Use it on the playbook resource group.","Incorrect: Log Analytics Reader gives read access to workspace data and settings, so it cannot deploy the Sentinel solution onto the workspace. It suits an analyst who only needs to run queries.","Incorrect: Security Reader gives read access to security information such as Defender for Cloud data, but it does not allow deploying resources. It suits an auditor who reviews posture without changing anything."]},{"id":"4.2.1-02","obj":"4.2.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. uses Microsoft Defender for Cloud, which created a default Log Analytics workspace named DefaultWorkspace1. An administrator tries to add Microsoft Sentinel to DefaultWorkspace1, but the workspace is not listed.\n\nWhat should you do to deploy Microsoft Sentinel?","explanation":"Default workspaces that Defender for Cloud creates are not shown in the Sentinel onboarding list, and Sentinel cannot be installed on them. You create or select a different Log Analytics workspace and add Sentinel to that one.","ref":"https://learn.microsoft.com/azure/sentinel/quickstart-onboard","choices":["Move DefaultWorkspace1 to a different resource group and add Microsoft Sentinel","Register the Microsoft.SecurityInsights resource provider on the subscription","Assign the Owner role on DefaultWorkspace1 to the administrator","Create a new Log Analytics workspace and add Microsoft Sentinel to it"],"answer":[3],"rationale":["Incorrect: Moving the workspace does not change the fact that it is a Defender for Cloud default workspace, and a workspace with Sentinel deployed cannot be moved later. Moves are only a layout change, not a fix.","Incorrect: Registering the resource provider is a valid prerequisite step on a new subscription, but it does not make a default workspace eligible. Use it when deployment fails with a provider not registered error.","Incorrect: Owner rights remove permission problems, but the workspace is hidden by design, not because of missing rights. Owner would help if the administrator saw the workspace but could not add Sentinel.","Correct: A dedicated workspace is the supported path. Sentinel can run on any regular Log Analytics workspace, so you create one in the region you need and add Sentinel to it."]},{"id":"4.2.1-03","obj":"4.2.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank has two Microsoft Entra tenants named Tenant1 and Tenant2. One security operations team must collect Microsoft Entra ID sign-in logs and Azure Activity logs from both tenants by using the built-in data connectors.\n\nWhat should you deploy?","explanation":"Service-to-service connectors that rely on diagnostic settings work only inside their own Microsoft Entra tenant, so each tenant needs its own Sentinel workspace. The team then uses multiple-workspace views to work across them.","ref":"https://learn.microsoft.com/azure/sentinel/prepare-multiple-workspaces","choices":["One workspace in Tenant1 with diagnostic settings in Tenant2 that point to it","One workspace in Tenant1 with Azure Lighthouse delegation from Tenant2","One Log Analytics workspace with Microsoft Sentinel in each tenant","One workspace in Tenant1 configured as the parent workspace for workspace manager"],"answer":[2],"rationale":["Incorrect: Diagnostic settings cannot send logs to a workspace that is in a different tenant than the resource, and tenant-level Entra ID logs cannot be redirected that way. This pattern fits resources inside one tenant.","Incorrect: Azure Lighthouse delegates management of resources across tenants, which helps run a SOC centrally, but diagnostic settings-based connectors such as Azure Activity and Entra ID still cannot write across the tenant boundary.","Correct: Connectors for Entra ID and Azure Activity work only within their own tenant, so at least one workspace per tenant is the recommended design. Incidents can still be viewed centrally across workspaces.","Incorrect: Workspace manager publishes content such as rules and workbooks from a central workspace to member workspaces. It does not collect data, so it cannot replace per-tenant data connectors."]},{"id":"4.2.1-04","obj":"4.2.1","difficulty":"hard","type":"single","stem":"Tailspin Toys has Microsoft Sentinel enabled on Workspace1. User1 has the Microsoft Sentinel Contributor role on the resource group that contains Workspace1 and must connect Workspace1 to the Microsoft Defender portal. Workspace1 does not appear on the SIEM workspaces page for User1. User1 must not receive the Owner role.\n\nWhich additional role should you assign to User1 at the subscription scope?","explanation":"Onboarding a workspace to the Defender portal needs either Owner on the subscription, or User Access Administrator at subscription scope combined with Microsoft Sentinel Contributor at subscription or resource group scope. Workspaces you lack the roles for are not listed.","ref":"https://learn.microsoft.com/azure/sentinel/isv/sentinel-data-lake-onboarding","choices":["Log Analytics Contributor","User Access Administrator","Monitoring Contributor","Microsoft Entra Security Administrator"],"answer":[1],"rationale":["Incorrect: Log Analytics Contributor manages workspace settings and data but does not include the role-assignment permissions that onboarding uses. It suits someone who manages tables and retention.","Correct: User Access Administrator at the subscription plus the Microsoft Sentinel Contributor that User1 already holds is the least-privilege alternative to Owner for connecting a workspace to the Defender portal.","Incorrect: Monitoring Contributor manages Azure Monitor resources such as data collection rules and alerts. It does not satisfy the onboarding prerequisite. Use it for people who create DCRs.","Incorrect: This Entra role is needed to onboard a tenant to the Sentinel data lake, not to connect a workspace to the Defender portal. It is an Entra directory role, not an Azure subscription role."]},{"id":"4.2.1-05","obj":"4.2.1","difficulty":"hard","type":"multi","stem":"Fabrikam, Inc. has two Microsoft Sentinel workspaces in the same Microsoft Entra tenant: WorkspaceEU in West Europe and WorkspaceUS in East US. Data residency rules prevent copying data between the regions. The security operations team must triage incidents from both workspaces in the Microsoft Defender portal.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","explanation":"The Defender portal supports one Microsoft Entra tenant with one primary workspace and multiple secondary workspaces. Connecting each workspace from SIEM workspaces keeps data in its own region while giving one incident queue.","ref":"https://learn.microsoft.com/azure/sentinel/microsoft-sentinel-onboard","choices":["Export the WorkspaceUS tables to WorkspaceEU by using data export rules","Connect both workspaces from the SIEM workspaces page in the Defender portal settings","Move WorkspaceUS to the resource group that contains WorkspaceEU","Designate one of the connected workspaces as the primary workspace","Create a second Microsoft Entra tenant that hosts WorkspaceUS"],"answer":[1,3],"rationale":["Incorrect: Exporting tables copies data across regions, which the residency rules forbid. Use export rules when you need an archive copy inside an allowed region.","Correct: Each workspace is connected from System > Settings > Microsoft Sentinel > SIEM workspaces. Data stays in its home region, and incidents appear together in the Defender portal.","Incorrect: Once Microsoft Sentinel is deployed, the workspace cannot be moved to another resource group or subscription, and moving would not address the Defender portal requirement anyway.","Correct: One connected workspace is the primary, and the others are secondary. With two workspaces you must decide which one is primary when you connect them.","Incorrect: The Defender portal supports a single Microsoft Entra tenant, so a second tenant splits the view instead of unifying it. Multiple tenants need multitenant management, a different scenario."]},{"id":"4.2.1-06","obj":"4.2.1","difficulty":"medium","type":"order","stem":"Litware, Inc. must deploy Microsoft Sentinel on a new workspace in the West Europe region and make the workspace available in the Microsoft Defender portal.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","explanation":"Sentinel is a layer on top of a Log Analytics workspace, so the workspace must exist first. Only a workspace with Sentinel enabled can then be connected to the Defender portal.","ref":"https://learn.microsoft.com/azure/sentinel/quickstart-onboard","choices":["Create a data collection endpoint in West Europe.","Add Microsoft Sentinel to the workspace.","Create the workspace by running `az monitor log-analytics workspace create` with the West Europe location.","Install the Azure Monitor Agent on the on-premises servers.","In the Defender portal, connect the workspace from the SIEM workspaces page.","Assign the Microsoft Sentinel Automation Contributor role on the workspace."],"answer":[2,1,4],"rationale":["Incorrect: A data collection endpoint is needed for some ingestion scenarios such as the Logs ingestion API with private link. It is not part of enabling Sentinel. Create one when a connector requires it.","Step 2: With the workspace in place, you add Microsoft Sentinel to it. This enables the SIEM features on that Log Analytics workspace.","Step 1: The Log Analytics workspace comes first because Sentinel is added to an existing workspace, and the workspace region fixes where the data is stored.","Incorrect: Agents are a data collection step that follows onboarding. They are not required to enable Sentinel or connect it to the Defender portal. Install them when you start collecting server logs.","Step 3: After Sentinel is enabled, you connect the workspace from the SIEM workspaces page. This makes the workspace's incidents and data available in the Defender portal.","Incorrect: Automation Contributor is a service role on the playbook resource group that lets Sentinel run playbooks. It does not apply to the workspace and is not an onboarding step."]},{"id":"4.2.2-01","obj":"4.2.2","difficulty":"easy","type":"single","stem":"Adatum Corporation has an internal auditor named User1. User1 must view incidents, workbooks, and ingested data in Microsoft Sentinel but must not change incidents or any configuration.\n\nWhich role should you assign to User1 on the resource group that contains the workspace?","explanation":"Microsoft Sentinel Reader lets a user view data, incidents, workbooks, and other resources. Responder adds incident management, and Contributor adds the ability to create and edit resources.","ref":"https://learn.microsoft.com/azure/sentinel/roles","choices":["Microsoft Sentinel Responder","Microsoft Sentinel Reader","Microsoft Sentinel Contributor","Microsoft Sentinel Playbook Operator"],"answer":[1],"rationale":["Incorrect: Responder includes all Reader permissions and adds managing incidents, such as assigning and closing them. It is the right pick for a triage analyst, but User1 must not change incidents.","Correct: Reader provides view-only access to Sentinel data, incidents, workbooks, and other resources, which matches an auditor who must not change anything.","Incorrect: Contributor includes Responder permissions and adds creating and editing resources and installing solutions. That is far more than a view-only auditor needs.","Incorrect: Playbook Operator lists, views, and manually runs playbooks. It does not grant read access to incidents and data in the workspace, so it does not fit a general auditor."]},{"id":"4.2.2-02","obj":"4.2.2","difficulty":"easy","type":"single","stem":"Litware, Inc. has an analyst named User1 who has the Microsoft Sentinel Responder role. User1 must run an existing playbook manually on incidents. The playbook is in a resource group named RG-Playbooks.\n\nWhich role should you assign to User1 on RG-Playbooks?","explanation":"Responder lets a user access an incident, but running a playbook manually needs Microsoft Sentinel Playbook Operator on the resource group that holds the playbook.","ref":"https://learn.microsoft.com/azure/sentinel/roles","choices":["Microsoft Sentinel Automation Contributor","Microsoft Sentinel Contributor","Microsoft Sentinel Playbook Operator","Logic App Contributor"],"answer":[2],"rationale":["Incorrect: This role is used by Microsoft Sentinel itself so that automation rules can run playbooks. It is not meant for user accounts and does not let a user run playbooks manually.","Incorrect: Microsoft Sentinel Contributor lets a user attach a playbook to an automation rule or analytics rule and manage resources. It is broader than needed for running a playbook by hand.","Correct: Playbook Operator lists, views, and manually runs playbooks. Combined with Responder for incident access, it lets User1 run the playbook on incidents.","Incorrect: Logic App Contributor edits and manages the logic apps that implement playbooks. It is for authors who build playbooks, not for analysts who only run them."]},{"id":"4.2.2-03","obj":"4.2.2","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a Microsoft Sentinel workspace. User1 has the Microsoft Sentinel Contributor role and creates an automation rule that must run Playbook1. Playbook1 resides in RG-Playbooks, but Playbook1 is unavailable in the Run playbook list of the rule.\n\nWhat should you do?","explanation":"Microsoft Sentinel runs playbooks from automation rules by using its own service account, which needs the Microsoft Sentinel Automation Contributor role on the playbook resource group. The Manage playbook permissions option grants it, and you need Owner or User Access Administrator to do so.","ref":"https://learn.microsoft.com/azure/sentinel/automation/run-playbooks","choices":["Assign User1 the Microsoft Sentinel Playbook Operator role on RG-Playbooks","Grant Microsoft Sentinel permissions on RG-Playbooks by using Manage playbook permissions","Assign User1 the Microsoft Sentinel Responder role on the workspace","Assign the Logic App Operator role on Playbook1 to the Microsoft Sentinel service account"],"answer":[1],"rationale":["Incorrect: Playbook Operator lets a user run a playbook manually. The playbook is hidden because Sentinel itself lacks access to the resource group, not because User1 lacks a user role.","Correct: Manage playbook permissions assigns Automation Contributor to the Sentinel service account on RG-Playbooks. After that, any automation rule can run any playbook in that resource group.","Incorrect: Responder grants incident access, which User1 already has through Contributor. It does not change whether the Sentinel service account can reach the playbook resource group.","Incorrect: Logic App Operator is a Logic Apps role that reads, enables, and disables logic apps. The Sentinel service account needs the Sentinel Automation Contributor role instead, so this assignment would not make the playbook appear."]},{"id":"4.2.2-04","obj":"4.2.2","difficulty":"medium","type":"yesno","stem":"Relecloud assigns Microsoft Sentinel built-in roles at the resource group level that contains its workspace. The security team plans these assignments.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","explanation":"Reader views, Responder manages incidents, Contributor creates and edits resources and installs solutions, and Playbook Operator only runs playbooks. Authoring playbooks needs Logic Apps roles.","ref":"https://learn.microsoft.com/azure/sentinel/roles","choices":["A user who has the Microsoft Sentinel Reader role can view incidents and workbooks.","A user who has the Microsoft Sentinel Responder role can install and update solutions from the content hub.","A user who has the Microsoft Sentinel Contributor role on the resource group can install solutions from the content hub.","A user who has the Microsoft Sentinel Playbook Operator role can create and edit playbooks."],"answer":[0,2],"rationale":["Yes: Reader is the view-only role for data, incidents, workbooks, and other resources, so this statement is true.","No: Installing or updating solutions needs Microsoft Sentinel Contributor at the resource group level. Responder only adds incident management on top of Reader.","Yes: Managing content hub solutions needs Microsoft Sentinel Contributor on the resource group that the workspace belongs to, so this statement is true.","No: Playbook Operator lists, views, and manually runs playbooks. Creating or editing playbooks needs a Logic Apps role such as Logic App Contributor."]},{"id":"4.2.2-05","obj":"4.2.2","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. has one Microsoft Sentinel workspace. The owners of the Azure virtual machines in each business unit must query only the logs that their own VMs send to the workspace. The company does not want to create more workspaces.\n\nWhich access model should you use?","explanation":"Resource-context RBAC gives users access to log data pertaining to the Azure resources they already have permissions on, without extra workspaces. Table-level RBAC restricts by table, not by resource owner.","ref":"https://learn.microsoft.com/azure/sentinel/prepare-multiple-workspaces","choices":["Microsoft Sentinel Reader at the resource group of the workspace","Table-level Azure RBAC on the SecurityEvent and Syslog tables","Resource-context Azure RBAC based on the Azure permissions on each VM","Microsoft Sentinel Responder at the subscription of each business unit"],"answer":[2],"rationale":["Incorrect: Reader at the workspace resource group exposes all data in the workspace to every owner. It fits a SOC analyst who must see everything.","Incorrect: Table-level RBAC limits access to named tables, but each owner would then see the rows of every business unit in those tables. It fits a team such as Operations that needs two specific tables.","Correct: With resource-context RBAC, resource owners see only the data from resources they have access to, which meets the per-business-unit requirement within one workspace.","Incorrect: Responder is a Sentinel role scoped to the incidents and workspace; assigning it elsewhere does not filter log rows by resource and adds incident management rights that are not needed."]},{"id":"4.2.2-06","obj":"4.2.2","difficulty":"hard","type":"dropdown","stem":"Adatum Corporation must assign Microsoft Sentinel roles at the resource group rg-sentinel. User1 must install solutions from the content hub and create analytics rules. User2 must triage incidents, including assigning owners and closing them, but must not change rules.\n\nHow should you complete the commands? To answer, select the appropriate options in the answer area.\n\n```\naz role assignment create --assignee user1@adatum.com --role \"[[1]]\" --scope /subscriptions/<subscription-id>/resourceGroups/rg-sentinel\naz role assignment create --assignee user2@adatum.com --role \"[[2]]\" --scope /subscriptions/<subscription-id>/resourceGroups/rg-sentinel\n```","explanation":"Match the role to the task: Contributor installs solutions and edits resources, Responder manages incidents, Reader views, Playbook Operator runs playbooks, and Automation Contributor belongs to the Sentinel service account.","ref":"https://learn.microsoft.com/azure/sentinel/roles","targets":[{"label":"Box 1","options":["Microsoft Sentinel Reader","Microsoft Sentinel Responder","Microsoft Sentinel Contributor","Microsoft Sentinel Playbook Operator"],"why":["Incorrect: Reader is view-only, so User1 could not install solutions or create rules. Use it for auditors.","Incorrect: Responder manages incidents but cannot install solutions or create analytics rules. Use it for triage analysts, as for User2.","Correct: Contributor includes Responder rights and adds creating and editing resources, including installing solutions from the content hub at resource group scope.","Incorrect: Playbook Operator only lists and runs playbooks, which is unrelated to installing solutions or authoring rules."]},{"label":"Box 2","options":["Microsoft Sentinel Reader","Microsoft Sentinel Responder","Microsoft Sentinel Contributor","Microsoft Sentinel Automation Contributor"],"why":["Incorrect: Reader can view incidents but cannot assign owners or close them. Use it when only visibility is needed.","Correct: Responder includes Reader rights and adds managing incidents, such as assigning owners and closing them, without rights to change rules.","Incorrect: Contributor would let User2 create and edit rules and install solutions, which the requirement forbids.","Incorrect: Automation Contributor is a service role for Sentinel to run playbooks from automation rules. It is not assigned to analysts."]}],"answer":[2,1]},{"id":"4.2.3-01","obj":"4.2.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs a third-party firewall and wants the data connector, analytics rule templates, hunting queries, and workbooks for that product in its Microsoft Sentinel workspace. The team wants to deploy the whole package in one step.\n\nWhat should you use?","explanation":"Content hub solutions are packaged integrations that bundle connectors, rules, queries, and workbooks for a product or scenario, and you deploy them in a single step.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["A repository connection to a GitHub repository","A solution from the content hub","The analytics rule template gallery","An ARM template that you export from another workspace"],"answer":[1],"rationale":["Incorrect: Repositories deploy custom content that you maintain in source control by using CI/CD. They do not offer prepackaged vendor content. Use them for your own rules and workbooks.","Correct: A solution packages the connector, rule templates, hunting queries, and workbooks for the product, and installing it deploys all of them together from the content hub.","Incorrect: Rule templates cover only one content type and no connector or workbook. Use them when you need only detections for data that is already ingested.","Incorrect: An exported ARM template could clone content, but it is a manual process that is not maintained by the vendor and does not receive updates from the content hub."]},{"id":"4.2.3-02","obj":"4.2.3","difficulty":"easy","type":"single","stem":"Tailspin Toys wants a single community hunting query for a known threat in its Microsoft Sentinel workspace. The query must stay up to date automatically as the community improves it, without installing a full product package.\n\nWhich type of content hub item should you install?","explanation":"Standalone content items in the content hub install a single item such as a hunting query, and they are kept up to date automatically. Solutions are bundles that you update yourself.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["A solution","A custom repository item","A standalone content item","A cloned rule template"],"answer":[2],"rationale":["Incorrect: A solution is a bundle for a product or scenario, and solution updates are applied when you update the solution. It is more than needed for one query.","Incorrect: Items in a repository are custom content that you author and deploy through your own CI/CD. They are not updated by the content hub.","Correct: Standalone content installs one item and is updated automatically. Active or custom items created from it are left untouched.","Incorrect: A cloned copy becomes custom content, so it no longer follows the upstream template. Use cloning when you want to diverge from the original."]},{"id":"4.2.3-03","obj":"4.2.3","difficulty":"medium","type":"single","stem":"Litware, Inc. installed the Azure Activity solution from the content hub in a Microsoft Sentinel workspace. Two hours later no Azure Activity data is in the workspace and the data connector status is Not connected.\n\nWhat should you do next?","explanation":"Installing a solution makes its data connector available but does not connect it. You still open the connector page and complete the configuration, such as connecting the subscriptions, before data flows.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["Update the Azure Activity solution to the latest version","Configure the Azure Activity data connector from the Data connectors page","Create a new data collection rule for the AzureActivity table","Install the Azure Monitor Agent on a virtual machine in the subscription"],"answer":[1],"rationale":["Incorrect: Updating applies a newer solution version, but it does not connect any subscription. Use it when the content hub reports an available update.","Correct: The solution only adds the connector to the gallery. Opening the connector page and completing its configuration is what starts ingestion and moves the status to Connected.","Incorrect: The AzureActivity table is fed through the diagnostic settings pipeline, and the table does not support DCR-based ingestion, so a new DCR is not the right tool here.","Incorrect: Azure Monitor Agent collects data from machines, not subscription-level activity logs, so installing it does not help the Azure Activity connector."]},{"id":"4.2.3-04","obj":"4.2.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. is onboarding Microsoft Sentinel and must install eight solutions and update three installed solutions in one pass. The user has the Microsoft Sentinel Contributor role on the resource group.\n\nWhat should you use in the content hub?","explanation":"The content hub list view supports selecting multiple solutions and standalone items and installing or updating them in bulk with the Install/Update button.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["The list view, select the items, and select Install/Update","The card view, opening each solution and selecting Install","The Repositories page to connect a GitHub repository","The Analytics page to enable the rule templates of each solution"],"answer":[0],"rationale":["Correct: The list view is built for bulk work. You can select several solutions and standalone items and run Install/Update, and items that are already current are skipped without affecting the others.","Incorrect: Opening each solution works, but it is a one-at-a-time process. Use it when you need to review details of a single solution before installing.","Incorrect: Repositories deploy custom content from source control. They do not install or update content hub solutions.","Incorrect: The Analytics page enables rules from templates after content exists. It does not install solutions or update them."]},{"id":"4.2.3-05","obj":"4.2.3","difficulty":"hard","type":"dragdrop","stem":"Woodgrove Bank manages Microsoft Sentinel content in three ways. You must choose the mechanism for each requirement.\n\nWhich mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once, more than once, or not at all.","explanation":"Match the delivery model to the content: solutions for packaged vendor value, standalone items for single maintained items, repositories for your own content under source control.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["Content hub solution","Content hub standalone item","Repositories connection","Workspace manager"],"targets":["Requirement 1: deploy a vendor package that includes a data connector, analytics rule templates, and workbooks","Requirement 2: add one hunting query that the community maintains and that updates automatically","Requirement 3: deploy the company's own analytics rules from a GitHub repository after each commit"],"answer":[0,1,2],"rationale":["A solution bundles the connector, rule templates, and workbooks for a product, so the whole package installs together.","A standalone item is a single content item that is kept up to date automatically, which matches one community query.","A repository connection links source control to the workspace so custom content is deployed by CI/CD on each commit."],"notes":["Packaged integration for a product or scenario. Use it when you want connectors, rules, queries, and workbooks together; you update it from the content hub.","A single item such as a hunting query, analytics rule template, or workbook. Use it for one piece of content; it updates automatically.","Connects a GitHub or Azure DevOps repository so custom content is deployed from source control. Use it for content you author yourself.","Publishes content from a central workspace to member workspaces at scale. Use it to manage many workspaces; it does not link source control or install vendor packages."]},{"id":"4.2.3-06","obj":"4.2.3","difficulty":"hard","type":"single","stem":"Adatum Corporation installed a solution from the content hub and customized three of the analytics rules that were created from its templates. The content hub now shows an update for the solution. The team wants the new templates, and must keep the customized rules unchanged with the least administrative effort.\n\nWhat should you do?","explanation":"Updating a solution refreshes its templates and content, while active or custom items that were created from the solution remain untouched. No backup or recreate step is needed.","ref":"https://learn.microsoft.com/azure/sentinel/sentinel-solutions-deploy","choices":["Update the solution in the content hub and keep the active rules as they are","Delete the three customized rules, update the solution, and recreate the rules","Uninstall the solution and install it again to refresh the templates","Export the three rules to ARM templates and import them after the update"],"answer":[0],"rationale":["Correct: The update touches the solution content and templates. Active rules created from earlier templates remain untouched, so the customizations survive without extra steps.","Incorrect: Deleting the rules is unnecessary because updates do not overwrite active items. It costs effort and risks losing rule history and settings.","Incorrect: Uninstalling and reinstalling is heavier than an update and is not needed to get new templates. Use uninstall when you want to remove the content entirely.","Incorrect: Exporting rules protects against overwrites, but updates do not overwrite active rules, so this adds work. It fits a case where you move rules between workspaces."]},{"id":"4.2.4-01","obj":"4.2.4","difficulty":"easy","type":"single","stem":"Litware, Inc. must ingest subscription-level events such as resource write operations and service health events into Microsoft Sentinel for one Azure subscription.\n\nWhich data connector should you enable?","explanation":"The Azure Activity connector streams the subscription activity log, which holds Resource Manager operations, write operations, and service health events, into the AzureActivity table.","ref":"https://learn.microsoft.com/azure/sentinel/data-connectors-reference","choices":["Microsoft Entra ID","Azure Activity","Microsoft Defender for Cloud","Azure Storage Account"],"answer":[1],"rationale":["Incorrect: The Entra ID connector sends tenant-level sign-in, audit, and provisioning logs. It does not carry subscription control-plane events. Use it for identity activity.","Correct: The Azure Activity connector ingests the subscription activity log into the AzureActivity table, which covers resource operations and service health events.","Incorrect: The Defender for Cloud connector brings in security alerts and recommendations, not the raw activity log. Use it to see Defender alerts as Sentinel incidents.","Incorrect: The Storage Account connector collects diagnostics and metrics of storage accounts. It does not collect subscription activity logs. Use it for data-plane logging of storage."]},{"id":"4.2.4-02","obj":"4.2.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has a Microsoft Entra tenant with only Microsoft Entra ID Free licenses. The security team wants the interactive user sign-in logs in the SigninLogs table of Microsoft Sentinel.\n\nWhat should the company obtain?","explanation":"A Microsoft Entra ID P1 or P2 license is required to ingest sign-in logs into Microsoft Sentinel, while other log types such as audit logs work with any Entra ID license.","ref":"https://learn.microsoft.com/azure/sentinel/connect-azure-active-directory","choices":["Microsoft Entra ID P1 or P2 licenses","Microsoft Entra Workload ID Premium licenses","Microsoft Defender for Cloud Apps licenses","Microsoft Sentinel Contributor assignments"],"answer":[0],"rationale":["Correct: Sign-in logs require Entra ID P1 or P2 in the tenant. Audit logs and several other log types need no premium license, but SigninLogs do.","Incorrect: Workload ID Premium is required for risky service principal and service principal risk event logs, not for interactive user sign-in logs.","Incorrect: Defender for Cloud Apps adds cloud app discovery and protection and is not a prerequisite for the Entra ID connector. Use it to monitor SaaS app activity.","Incorrect: Sentinel Contributor is a role on the workspace that the user needs to enable the connector, not a license. It does not remove the licensing requirement for sign-in logs."]},{"id":"4.2.4-03","obj":"4.2.4","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has 30 Azure Batch accounts in a subscription, and new Batch accounts are created every week. The diagnostic logs of all current and future Batch accounts must stream to a Microsoft Sentinel workspace without per-resource configuration.\n\nWhat should you do?","explanation":"The Azure Batch Account connector is a diagnostic settings-based connector managed by Azure Policy. Assigning the policy at subscription scope covers new resources, and a remediation task covers existing ones.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-diagnostic-setting-based","choices":["Create a diagnostic setting on each Batch account that sends logs to the workspace","Install the Azure Monitor Agent on the compute nodes and create a data collection rule","Launch the Azure Policy assignment wizard from the connector page and create a remediation task","Enable the Azure Activity connector for the subscription"],"answer":[2],"rationale":["Incorrect: A manual diagnostic setting works for each existing account, but it does not cover accounts created later and requires per-resource work. Use it for a single resource.","Incorrect: The Azure Monitor Agent collects data from machines, such as OS logs, not the service diagnostic logs of a Batch account. Use it for VM logs.","Correct: The connector wizard assigns a policy that applies the diagnostic setting to new resources, and the remediation task applies it to existing ones. The assigner needs the Owner role at that scope.","Incorrect: The Azure Activity connector ingests subscription control-plane events, not the diagnostic logs of a specific resource type."]},{"id":"4.2.4-04","obj":"4.2.4","difficulty":"medium","type":"single","stem":"Relecloud has subscriptions that were connected to Microsoft Sentinel by using the legacy Azure Activity connection method. An administrator starts to set up the new Azure Activity connector that uses diagnostic settings, but the setup is blocked.\n\nWhat should you do first?","explanation":"The new Azure Activity connector uses the diagnostic settings pipeline. Subscriptions that are connected through the legacy method must be disconnected first, and the connector page offers a Disconnect All button.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-diagnostic-setting-based","choices":["Delete the AzureActivity table from the workspace","Assign the Owner role on the workspace to the administrator","Install the Azure Monitor Agent on a virtual machine in each subscription","Disconnect the subscriptions from the legacy method by using Disconnect All on the connector page"],"answer":[3],"rationale":["Incorrect: Deleting the table would not remove the legacy connections and would risk losing ingested data. Tables are not the source of this block.","Incorrect: Owner on the workspace does not remove the legacy connection. Policy-based connectors need Owner at the policy assignment scope, a different requirement.","Incorrect: Azure Monitor Agent collects data from machines and is unrelated to the subscription activity log pipeline. Use it for VM-based collection.","Correct: Disconnect All removes the legacy subscription connections so that you can continue with the new diagnostic settings-based connector."]},{"id":"4.2.4-05","obj":"4.2.4","difficulty":"hard","type":"yesno","stem":"Woodgrove Bank enables the Microsoft Sentinel Microsoft Entra ID data connector for one workspace. The tenant has Microsoft Entra ID P2 licenses. An engineer who has the Microsoft Sentinel Contributor role on the workspace and the Security Administrator role on the tenant configures the connector.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","explanation":"The Entra ID connector writes each log type to its own table, needs Sentinel Contributor on the workspace plus Security Administrator on the tenant, and works within a single tenant. Sign-in logs need P1 or P2.","ref":"https://learn.microsoft.com/azure/sentinel/connect-azure-active-directory","choices":["Non-interactive user sign-in logs are stored in the AADNonInteractiveUserSignInLogs table.","The engineer needs both the Sentinel Contributor and the Security Administrator roles to enable the connector.","The connector can stream logs from a second Microsoft Entra tenant into the same workspace.","Microsoft Entra ID Free licenses are enough to ingest the SigninLogs table."],"answer":[0,1],"rationale":["Yes: The connector lists non-interactive user sign-ins as a data type that is stored in the AADNonInteractiveUserSignInLogs table.","Yes: The user needs Microsoft Sentinel Contributor on the workspace and Security Administrator (or equivalent permissions) on the tenant that streams the logs.","No: Diagnostic settings-based connectors work only within the tenant where the resource lives, so a second tenant needs its own workspace.","No: Ingesting sign-in logs requires Entra ID P1 or P2. Other log types such as audit logs work with any license."]},{"id":"4.2.4-06","obj":"4.2.4","difficulty":"hard","type":"multi","stem":"Tailspin Toys must stream the diagnostics of the storage account Storage1 to Microsoft Sentinel by using the standalone diagnostic settings-based Azure Storage Account connector. Storage1 contains blob, file, queue, and table services.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","explanation":"For storage accounts, the parent account resource exports the Transaction metric, and each child resource for blobs, files, queues, and tables exports all its logs and metrics. You see only the storage types that exist.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-diagnostic-setting-based","choices":["Configure a diagnostic setting on the parent storage account resource that exports the Transaction metric","Install the Azure Monitor Agent on Storage1 and create a data collection rule","Enable the Azure Activity connector for the subscription that contains Storage1","Configure a diagnostic setting on the parent account that exports the logs of the blob service","Configure a diagnostic setting on each child storage-type resource that exports all logs and metrics"],"answer":[0,4],"rationale":["Correct: The parent storage account resource is configured to export the Transaction metric, which the connector expects at account level.","Incorrect: Azure Monitor Agent runs on machines and storage accounts are PaaS resources, so there is nothing to install. Use the agent for VM log collection.","Incorrect: The Azure Activity connector ingests control-plane events of the subscription. It does not deliver the service logs of the storage account.","Incorrect: Blob service logs are produced by the child blob resource, not by the parent account resource, so this setting would not deliver them.","Correct: Each child storage-type resource, such as blob, file, queue, and table, gets its own diagnostic setting that exports its logs and metrics to the workspace."]},{"id":"4.2.5-01","obj":"4.2.5","difficulty":"easy","type":"single","stem":"Litware, Inc. has security appliances that send events in Common Event Format (CEF) over TCP port 514. The events must land in the CommonSecurityLog table of Microsoft Sentinel.\n\nWhich data connector should you use?","explanation":"The Common Event Format (CEF) via AMA connector collects CEF messages through a Linux log forwarder and writes them to CommonSecurityLog. Syslog via AMA writes plain syslog to the Syslog table.","ref":"https://learn.microsoft.com/azure/sentinel/cef-syslog-ama-overview","choices":["Syslog via AMA","Windows Security Events via AMA","Common Event Format (CEF) via AMA","Custom Logs via AMA"],"answer":[2],"rationale":["Incorrect: Syslog via AMA collects plain syslog messages into the Syslog table. Use it for Linux machines or devices that do not send CEF-formatted events.","Incorrect: Windows Security Events via AMA collects Windows Security log events into the SecurityEvent table. It does not receive CEF messages from appliances.","Correct: This connector parses CEF messages that arrive at the forwarder and stores them in CommonSecurityLog, which is the stated destination.","Incorrect: Custom Logs via AMA reads text log files into a custom _CL table. It would not parse CEF fields into CommonSecurityLog."]},{"id":"4.2.5-02","obj":"4.2.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. has network firewalls that cannot run agents but can send syslog and CEF messages over the network to a collector. The messages must reach Microsoft Sentinel through the Azure Monitor Agent.\n\nWhat should you deploy?","explanation":"Devices that cannot host an agent send their messages to a dedicated Linux VM, the log forwarder. Its rsyslog or syslog-ng daemon receives the messages, and the Azure Monitor Agent forwards them to the workspace.","ref":"https://learn.microsoft.com/azure/sentinel/cef-syslog-ama-overview","choices":["A Windows Event Collector server that has the Azure Monitor Agent","A dedicated Linux log forwarder with a syslog daemon and the Azure Monitor Agent","The Azure Monitor Agent directly on each firewall","A Logic Apps playbook that polls each firewall"],"answer":[1],"rationale":["Incorrect: A Windows Event Collector gathers Windows events through Windows Event Forwarding. It does not receive syslog or CEF messages from network devices.","Correct: The log forwarder is a Linux VM, which can be in Azure, on-premises, or in another cloud, running rsyslog or syslog-ng plus the Azure Monitor Agent. The firewalls send to its syslog daemon.","Incorrect: The firewalls are closed appliances that cannot host the agent, which is the stated constraint. Direct AMA installs fit machines that you manage, such as Linux VMs.","Incorrect: Playbooks react to incidents and alerts after data is already in Sentinel. They do not collect device logs, and firewalls push syslog rather than being polled."]},{"id":"4.2.5-03","obj":"4.2.5","difficulty":"medium","type":"single","stem":"Contoso, Ltd. collects CEF and Syslog messages through the same log forwarder. Both streams use the same facility, and the source devices cannot change that facility. The team now sees the same events in the CommonSecurityLog and Syslog tables.\n\nWhat should you do to stop the duplication?","explanation":"When the facility cannot be changed at the source, add a transformKql filter to the Syslog DCR that drops messages whose ProcessName or SyslogMessage indicates CEF. Otherwise remove the CEF facilities from the Syslog configuration.","ref":"https://learn.microsoft.com/azure/sentinel/cef-syslog-ama-overview","choices":["Add an ingestion-time transformation to the Syslog data collection rule that filters out CEF messages","Change the forwarder to use UDP instead of TCP for incoming messages","Raise the minimum severity of the facility in both data collection rules","Switch the Syslog table to the Basic table plan"],"answer":[0],"rationale":["Correct: A KQL transformation such as filtering on ProcessName and SyslogMessage removes CEF messages from the Syslog stream, so they are stored only in CommonSecurityLog.","Incorrect: The transport protocol does not decide which table receives a message. Switching to UDP would only change delivery behavior, and the same message would still match both rules.","Incorrect: A higher minimum severity drops lower-severity messages from both streams, but messages above the threshold would still be duplicated. It is a volume control, not a de-duplication.","Incorrect: The table plan changes cost and query features, not what is ingested, so the same events would still be written twice."]},{"id":"4.2.5-04","obj":"4.2.5","difficulty":"medium","type":"dropdown","stem":"Woodgrove Bank must stop CEF messages from being written to the Syslog table. The company edits the transformKql of the Syslog data collection rule so that messages whose ProcessName contains CEF, or whose SyslogMessage contains the CEF header, are dropped.\n\nHow should you complete the transformation? To answer, select the appropriate options in the answer area.\n\n```\n\"transformKql\": \"source | where ProcessName [[1]] \\\"CEF\\\" [[2]] SyslogMessage [[3]] \\\"CEF:0\\\"\"\n```","explanation":"A negated contains test on both ProcessName and SyslogMessage, joined with and, removes CEF messages from the Syslog stream while keeping every other syslog message.","ref":"https://learn.microsoft.com/azure/sentinel/cef-syslog-ama-overview","targets":[{"label":"Box 1","options":["contains","!contains","=="],"why":["Incorrect: contains keeps only the CEF messages, the opposite of the goal. Use it to select a message type to keep.","Correct: !contains keeps rows whose ProcessName does not contain CEF, which removes CEF messages from the Syslog stream.","Incorrect: An equality test keeps only rows whose ProcessName is exactly CEF, which selects the opposite of what you need and is not a contains test."]},{"label":"Box 2","options":["and","or"],"why":["Correct: and keeps a row only when both tests pass, so a message is dropped when either field shows CEF. This is the behavior required.","Incorrect: or keeps a row when at least one negated test passes, so a CEF message would survive whenever the other field lacks the CEF marker, and duplicates would remain."]},{"label":"Box 3","options":["contains","!contains","=="],"why":["Incorrect: contains would keep only messages with the CEF header and discard normal syslog. Use it to select CEF rows.","Correct: !contains keeps messages whose SyslogMessage lacks the CEF:0 header, which together with Box 1 removes CEF messages from the Syslog stream.","Incorrect: An equality test keeps only messages that are exactly CEF:0, which no real message is, so it would drop all syslog data and is not a contains test."]}],"answer":[1,0,1]},{"id":"4.2.5-05","obj":"4.2.5","difficulty":"hard","type":"single","stem":"Litware, Inc. has a Linux log forwarder in Azure with rsyslog and Azure Monitor Agent version 1.35. Network devices send CEF messages to port 514. A packet capture on the forwarder shows the messages arriving on port 514, but no rows appear in CommonSecurityLog after 30 minutes. The data collection rule is associated with the forwarder.\n\nWhat should you do first?","explanation":"With Azure Monitor Agent 1.28.11 and later, rsyslog or syslog-ng receives messages on port 514 and passes them to the agent on local TCP port 28330. If messages reach 514 but not the workspace, check the rsyslog forwarding configuration and the agent listener.","ref":"https://learn.microsoft.com/azure/sentinel/cef-syslog-ama-troubleshooting","choices":["Reconfigure the devices to send the messages to TCP port 28330","Open TCP port 28330 on the network security group for traffic from the devices","Verify that rsyslog forwards messages to the agent on local TCP port 28330 and that the agent listens there","Reinstall the Log Analytics agent on the forwarder"],"answer":[2],"rationale":["Incorrect: Devices must send to the syslog daemon on port 514. Port 28330 is the local hand-off between the daemon and the agent, so devices sending there would bypass the daemon.","Incorrect: Port 28330 is used on the forwarder itself between rsyslog and the agent. External devices do not connect to it, so changing the NSG does not fix a local forwarding problem.","Correct: Because the packets already arrive on 514, the next hop to verify is rsyslog to the agent on 28330. Check the omfwd configuration for the agent and that the agent process listens on that port.","Incorrect: The Log Analytics agent is the legacy agent that has been replaced by Azure Monitor Agent. Installing it would not repair the local hand-off and could cause duplicate ingestion."]},{"id":"4.2.5-06","obj":"4.2.5","difficulty":"hard","type":"order","stem":"Adatum Corporation must collect CEF messages from firewalls through a new Linux log forwarder in Azure into Microsoft Sentinel. The forwarder VM already exists and has a syslog daemon.\n\nWhich five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","explanation":"You first install the solution that brings the CEF via AMA connector, create the DCR (which installs the agent on the forwarder), run the script that configures the syslog daemon, point the devices at the forwarder, and then verify in CommonSecurityLog.","ref":"https://learn.microsoft.com/azure/sentinel/connect-cef-syslog-ama","choices":["Install the Microsoft Monitoring Agent on the forwarder.","Configure the firewalls to send CEF messages to the forwarder on port 514.","Install the Common Event Format solution from the content hub.","Create a data collection rule from the CEF via AMA connector page and select the forwarder VM.","Query the CommonSecurityLog table to verify that events arrive.","Create a data collection endpoint for the Windows Event Forwarding connector.","Run the installation script on the forwarder to configure the syslog daemon."],"answer":[2,3,6,1,4],"rationale":["Incorrect: The Microsoft Monitoring Agent is the legacy agent and is not used with the CEF via AMA connector. Using both agent types would also cause duplicate ingestion.","Step 4: Once the forwarder listens on port 514 and the agent is in place, you point the firewalls at the forwarder so that messages flow.","Step 1: The solution from the content hub installs the CEF via AMA data connector, which you need before you can create a DCR.","Step 2: Creating the DCR from the connector page selects the forwarder and installs the Azure Monitor Agent on it automatically.","Step 5: Last, query CommonSecurityLog to confirm the events from the firewalls arrive; this can take up to about 20 minutes.","Incorrect: A data collection endpoint for the Windows Event Forwarding connector belongs to a Windows scenario and is not part of CEF via AMA setup.","Step 3: After the DCR and agent exist, the installation script configures rsyslog or syslog-ng to listen on port 514 and forward to the agent."]},{"id":"4.2.6-01","obj":"4.2.6","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants to collect Windows security events into Microsoft Sentinel from physical servers in its datacenter. The servers are not Azure virtual machines and will use the Windows Security Events via AMA connector.\n\nWhat should you do on the servers before you enable the connector?","explanation":"Systems that are not Azure VMs must have Azure Arc installed and enabled before you enable an Azure Monitor Agent-based connector, so that the agent and the data collection rule can be deployed to them.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-windows-based","choices":["Install the Microsoft Monitoring Agent","Enable Windows Event Forwarding to a collector","Install the Azure Arc Connected Machine agent","Create a data collection endpoint on each server"],"answer":[2],"rationale":["Incorrect: The Microsoft Monitoring Agent is the legacy agent. The AMA-based connector installs the Azure Monitor Agent instead, and running both causes duplicate ingestion.","Incorrect: Windows Event Forwarding is an alternative design that uses a Windows Event Collector. It is not a prerequisite for the AMA-based connector on each server.","Correct: Azure Arc represents the physical servers in Azure so that Azure Monitor Agent and a data collection rule can be deployed to them. It must be in place before you enable the connector.","Incorrect: A data collection endpoint is a network ingestion construct for some scenarios and is not created on servers. The DCR is what targets machines."]},{"id":"4.2.6-02","obj":"4.2.6","difficulty":"easy","type":"single","stem":"Litware, Inc. needs a full user audit trail from Windows servers in Microsoft Sentinel, including both sign-in and sign-out events (event IDs 4624 and 4634), but wants to reduce the volume compared with collecting every event.\n\nWhich Windows Security Events event set should you select?","explanation":"The Common set is designed to reduce volume while keeping a full audit trail, including sign-in and sign-out events. Minimal omits sign-out events, and All events does not reduce volume.","ref":"https://learn.microsoft.com/azure/sentinel/windows-security-event-id-reference","choices":["All events","Minimal","Custom","Common"],"answer":[3],"rationale":["Incorrect: All events collects the full unfiltered Security and AppLocker logs, so it meets the audit need but does not reduce volume. Use it when completeness matters more than cost.","Incorrect: Minimal contains sign-in events such as 4624 and 4625 but not sign-out events such as 4634, so it lacks a full audit trail. Use it when only breach indicators are needed.","Incorrect: Custom lets you define XPath queries yourself. It could work but requires building the list of events, and the built-in set already matches the requirement.","Correct: Common includes both 4624 and 4634 and other audit actions, with fewer events than All events, which matches the stated need."]},{"id":"4.2.6-03","obj":"4.2.6","difficulty":"medium","type":"single","stem":"Woodgrove Bank has 2,000 workstations on which the security team cannot install agents. The workstations already forward events to a Windows Event Collector server named WEC1 through Windows Event Forwarding. The team wants these events in Microsoft Sentinel.\n\nWhich machine should you install the Azure Monitor Agent on?","explanation":"For the Windows Forwarded Events connector, Windows Event Collection must be running and the Azure Monitor Agent must be installed on the WEC machine. The forwarded events then land in the WindowsEvent table.","ref":"https://learn.microsoft.com/azure/sentinel/connect-services-windows-based","choices":["On each workstation","On WEC1","On a Linux log forwarder","On the domain controllers"],"answer":[1],"rationale":["Incorrect: Installing agents on 2,000 workstations is the approach that the stem rules out. Direct agents fit endpoints that you can manage.","Co
